# Lefthook configuration for learn-languages
# Pre-commit: fast feedback on staged files
# Pre-push: full validation before code reaches remote

pre-commit:
  parallel: true
  commands:
    lint-staged:
      glob: '*.{ts,tsx,vue,astro,js,jsx,json,css,md,mdx,yaml,yml}'
      run: npx lint-staged
    typecheck:
      glob: '*.{ts,tsx,vue}'
      run: npx tsc --noEmit

pre-push:
  parallel: false
  commands:
    validate-content:
      run: npm run validate:content
    test-unit:
      run: npm run test -- --reporter=verbose
    # E2E and a11y gates run in the CI pipeline (.github/workflows/pipe.yml),
    # not here — they need a built dist/ and browser installs, too slow for
    # every push. Uncomment locally if you want them pre-push too:
    # test-e2e:
    #   run: npm run build && npm run test:e2e
    # test-a11y:
    #   run: npm run build && npm run test:a11y
