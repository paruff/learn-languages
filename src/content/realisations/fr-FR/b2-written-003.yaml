nodeId: B2-WRITTEN-003
lang: fr-FR
vocabulary:
  - id: fr-FR-B2-WRITTEN-003-001
    term: 'écrire avec une orthographe correcte'
    translation: 'to write with correct spelling'
    partOfSpeech: phrase
    gender: feminine
    example: 'Je dois écrire avec une orthographe correcte.'
    exampleTranslation: 'I need to write with correct spelling.'
  - id: fr-FR-B2-WRITTEN-003-002
    term: 'utiliser une ponctuation appropriée'
    translation: 'to use appropriate punctuation'
    partOfSpeech: phrase
    gender: feminine
    example: "Il est important d'utiliser une ponctuation appropriée dans le texte."
    exampleTranslation: 'It is important to use appropriate punctuation in the text.'
  - id: fr-FR-B2-WRITTEN-003-003
    term: 'relire le texte'
    translation: 'to review the text'
    partOfSpeech: phrase
    gender: masculine
    example: "Je vais relire le texte pour garantir l'exactitude."
    exampleTranslation: 'I will review the text to ensure correctness.'
  - id: fr-FR-B2-WRITTEN-003-004
    term: 'corriger les erreurs'
    translation: 'to correct errors'
    partOfSpeech: phrase
    gender: feminine
    example: 'Je dois corriger les erreurs orthographiques et grammaticales.'
    exampleTranslation: 'I need to correct spelling and grammatical errors.'
  - id: fr-FR-B2-WRITTEN-003-005
    term: 'utiliser des modèles de rédaction'
    translation: 'to use writing models'
    partOfSpeech: phrase
    gender: masculine
    example: "Il est utile d'utiliser des modèles de rédaction pour progresser."
    exampleTranslation: 'It is useful to use writing models to improve.'
  - id: fr-FR-B2-WRITTEN-003-006
    term: 'rédiger avec précision'
    translation: 'to write with precision'
    partOfSpeech: phrase
    gender: feminine
    example: "L'objectif est de rédiger avec précision et clarté."
    exampleTranslation: 'The goal is to write with precision and clarity.'
grammar:
  - id: B2-GRAMMAR-010
    point: 'Agreement of past participle with preceding direct object'
    explanation: "Correct agreement in compound tenses (les fautes que j'ai corrigées)"
    examples:
      - "Les fautes que j'ai corrigées."
      - "La lettre que j'ai écrite."
    cefrNotes: 'B2 learners master past participle agreement in writing'
culturalNotes: "French spelling reform (1990) is tolerated but traditional spelling still expected in formal exams; 'relire' implies careful proofreading; 'modèles de rédaction' includes formal letter templates."
