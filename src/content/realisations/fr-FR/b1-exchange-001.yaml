    example: 'Pourriez-vous confirmer l’adresse ?'
    exampleTranslation: 'Could you confirm the address?'
  - id: fr-FR-B1-EXCHANGE-001-003
    term: 'des informations factuelles'
    translation: 'factual information'
    partOfSpeech: phrase
    example: 'Nous avons échangé des informations factuelles sur le retard.'
    exampleTranslation: 'We exchanged factual information about the delay.'
  - id: fr-FR-B1-EXCHANGE-001-004
