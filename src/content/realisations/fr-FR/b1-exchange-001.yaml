    term: 'vérifier l’information'
    translation: 'to check the information'
    partOfSpeech: phrase
    example: 'Laisse-moi vérifier l’information avant de partir.'
    exampleTranslation: 'Let me check the information before I leave.'
  - id: fr-FR-B1-EXCHANGE-001-002
    term: 'confirmer'
    translation: 'to confirm'
