    example: 'Excusez-moi, comment vous appelez-vous ?'
    exampleTranslation: 'Excuse me, what is your name?'
  - id: fr-FR-A1-INTRO-002-002
    term: 'Quel âge avez-vous ?'
    translation: 'How old are you?'
    partOfSpeech: phrase
    example: 'Pardon, quel âge avez-vous ?'
    exampleTranslation: 'Pardon, how old are you?'
  - id: fr-FR-A1-INTRO-002-003
    term: 'Vous venez de quel pays ?'
    translation: 'Where are you from?'
    partOfSpeech: phrase
