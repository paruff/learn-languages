    exampleTranslation: 'The doctor gave me a prescription.'
  - id: fr-FR-A2-HEALTH-001-005
    term: 'pharmacie'
    translation: 'pharmacy'
    partOfSpeech: noun
    gender: feminine
    example: 'Je vais à la pharmacie chercher le médicament.'
    exampleTranslation: 'I am going to the pharmacy to get the medicine.'
  - id: fr-FR-A2-HEALTH-001-006
    term: 'rendez-vous'
