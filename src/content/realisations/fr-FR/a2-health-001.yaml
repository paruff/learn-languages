    term: 'médecin'
    translation: 'doctor'
    partOfSpeech: noun
    gender: masculine
    example: 'Je dois aller chez le médecin.'
    exampleTranslation: 'I need to go to the doctor.'
  - id: fr-FR-A2-HEALTH-001-002
    term: 'maladie'
    translation: 'illness'
    partOfSpeech: noun
    gender: feminine
    example: 'La maladie a duré une semaine.'
    exampleTranslation: 'The illness lasted a week.'
  - id: fr-FR-A2-HEALTH-001-003
    term: 'douleur'
    translation: 'pain'
    partOfSpeech: noun
    gender: feminine
    example: 'J’ai une douleur au ventre depuis hier.'
    exampleTranslation: 'I have had a stomach pain since yesterday.'
  - id: fr-FR-A2-HEALTH-001-004
    term: 'ordonnance'
    translation: 'prescription'
    partOfSpeech: noun
    gender: feminine
