  - id: fr-FR-A2-JOB-002-005
    term: 'parfois'
    translation: 'sometimes'
    partOfSpeech: adverb
    example: 'Parfois, je déjeune au restaurant du coin.'
    exampleTranslation: 'Sometimes I have lunch at the corner restaurant.'
  - id: fr-FR-A2-JOB-002-006
    term: 'finir'
    translation: 'to finish'
    partOfSpeech: verb
    example: "D'habitude, je finis le travail à six heures."
