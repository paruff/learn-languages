  - id: fr-FR-A2-JOB-002-001
    term: 'routine'
    translation: 'routine'
    partOfSpeech: noun
    gender: feminine
    example: 'Ma routine de travail est très chargée.'
    exampleTranslation: 'My work routine is very busy.'
  - id: fr-FR-A2-JOB-002-002
    term: 'tâche'
    translation: 'task'
    partOfSpeech: noun
    gender: feminine
    example: "J'ai beaucoup de tâches à faire aujourd'hui."
    exampleTranslation: 'I have many tasks to do today.'
  - id: fr-FR-A2-JOB-002-003
    term: 'réunion'
    translation: 'meeting'
    partOfSpeech: noun
    gender: feminine
    example: "J'ai une réunion à dix heures."
    exampleTranslation: 'I have a meeting at ten in the morning.'
