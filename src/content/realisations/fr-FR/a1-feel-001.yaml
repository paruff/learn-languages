    exampleTranslation: 'I am very happy today.'
  - id: fr-FR-A1-FEEL-001-002
    term: 'triste'
    translation: 'sad'
    partOfSpeech: adjective
    example: 'Il est triste.'
    exampleTranslation: 'He is sad.'
  - id: fr-FR-A1-FEEL-001-003
    term: 'fatigué'
