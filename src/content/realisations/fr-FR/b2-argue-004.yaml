    exampleTranslation: 'I have to write an essay that develops an argument.'
grammar:
  - id: B2-GRAMMAR-008
    point: 'Subjunctive in subordinate clauses after expressions of necessity'
    explanation: 'Using subjunctive after il faut que, il est important que, etc.'
    examples:
      - "Il faut que l'argument soit clair."
      - 'Il est important que la thèse soit soutenue.'
    cefrNotes: 'B2 learners use subjunctive in formal written argumentation'
culturalNotes: "French essays follow a structured plan: introduction, développement (thèse/antithèse/synthèse), conclusion. 'Rédiger' is more formal than 'écrire' for essays."
