culturalNotes: 'Formal letters open with « Madame, Monsieur » when the recipient is unknown, carry an « Objet: » line, and close with « Veuillez agréer, Madame, Monsieur, l’expression de mes salutations distinguées »; everyday e-mails use « Bonjour » and « Cordialement ».'
