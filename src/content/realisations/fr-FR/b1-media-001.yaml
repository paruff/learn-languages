nodeId: B1-MEDIA-001
lang: fr-FR
vocabulary:
  - id: fr-FR-B1-MEDIA-001-001
    term: 'un bulletin d’information'
    translation: 'a news bulletin'
    partOfSpeech: phrase
    gender: masculine
    example: 'J’écoute le bulletin d’information chaque matin.'
    exampleTranslation: 'I listen to the news bulletin every morning.'
  - id: fr-FR-B1-MEDIA-001-002
    term: 'une émission radiophonique'
    translation: 'a radio broadcast'
    partOfSpeech: phrase
    gender: feminine
    example: 'L’émission radiophonique a couvert les élections.'
    exampleTranslation: 'The radio broadcast covered the election.'
  - id: fr-FR-B1-MEDIA-001-003
    term: 'un document enregistré'
    translation: 'a recorded document'
    partOfSpeech: phrase
    gender: masculine
    example: 'Le document enregistré est disponible en ligne.'
    exampleTranslation: 'The recorded document is available online.'
  - id: fr-FR-B1-MEDIA-001-004
    term: 'l’intrigue'
    translation: 'the plot'
    partOfSpeech: phrase
    example: 'J’ai suivi l’intrigue du film facilement.'
    exampleTranslation: 'I followed the plot of the film easily.'
  - id: fr-FR-B1-MEDIA-001-005
    term: 'les sous-titres'
    translation: 'subtitles'
    partOfSpeech: noun
    example: 'Je regarde des films français avec les sous-titres.'
    exampleTranslation: 'I watch French films with subtitles.'
  - id: fr-FR-B1-MEDIA-001-006
    term: 'un débit lent'
    translation: 'a slow pace'
    partOfSpeech: phrase
    gender: masculine
    example: 'Je comprends mieux quand l’orateur utilise un débit lent.'
    exampleTranslation: 'I understand better when the speaker uses a slow pace.'
grammar: []
culturalNotes: 'French learners typically meet the language through the « journal télévisé » of France 2 or TF1 and radio stations such as France Inter; slow-paced diction is associated with news presenters and language-learning broadcasts.'
