grammar:
  - id: it-IT-B2-WRITTEN-003-G01
    point: 'Writing accuracy and self-correction'
    explanation: 'Using grammatical knowledge for self-correction in writing'
    examples:
      - 'Although I wrote correctly, I will review the punctuation.'
      - 'The text is correct, but I can improve the structure.'
    cefrNotes: 'B2 learners use grammatical awareness for self-correction'

culturalNotes: "British writing values accuracy. Using 'I reviewed the text' or 'I corrected the errors' signals attention to quality."
