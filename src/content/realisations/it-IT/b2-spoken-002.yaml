vocabulary:
  - id: it-IT-B2-SPOKEN-002-001
    concept: 'to-understand-tv-news'
    term: 'capire le notizie televisive'
    translation: 'to understand TV news'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I can understand TV news on current topics.'
    exampleTranslation: 'Consigo compreender notícias de TV sobre temas atuais.'
  - id: it-IT-B2-SPOKEN-002-002
    concept: 'to-follow-current-affairs-programmes'
    term: 'seguire programmi di attualità'
    translation: 'to follow current affairs programmes'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I will follow current affairs programmes this week.'
    exampleTranslation: 'Vou acompanhar programas de atualidades esta semana.'
  - id: it-IT-B2-SPOKEN-002-003
    concept: 'to-understand-films-without-subtitles'
    term: 'capire i film senza sottotitoli'
    translation: 'to understand films without subtitles'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I need to understand films without subtitles.'
    exampleTranslation: 'Preciso de compreender filmes sem legendas.'
  - id: it-IT-B2-SPOKEN-002-004
    concept: 'to-identify-the-main-theme'
    term: 'identificare il tema principale'
    translation: 'to identify the main theme'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'It is important to identify the main theme of the report.'
    exampleTranslation: 'É importante identificar o tema principal da reportagem.'
  - id: it-IT-B2-SPOKEN-002-005
    concept: 'to-understand-cultural-references'
    term: 'capire i riferimenti culturali'
    translation: 'to understand cultural references'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'It is useful to understand cultural references in the news.'
    exampleTranslation: 'É útil perceber referências culturais no noticiário.'
  - id: it-IT-B2-SPOKEN-002-006
    concept: 'to-synthesise-oral-information'
    term: 'sintetizzare le informazioni orali'
    translation: 'to synthesise oral information'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I will synthesise the oral information I heard.'
    exampleTranslation: 'Vou sintetizar a informação oral que ouvi.'
grammar:
  - id: it-IT-B2-SPOKEN-002-G01
    point: 'Complex tense usage in media contexts'
    explanation: 'Using compound tenses common in news reporting'
    examples:
      - 'The government may have decided to implement new measures.'
      - 'The authorities had warned of the risk.'
    cefrNotes: 'B2 learners handle complex tenses in media English'

culturalNotes: "British TV news uses formal register. Terms like 'according to official sources' or 'the report states' signal sourcing."
