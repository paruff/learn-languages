grammar:
  - id: it-IT-B2-WRITTEN-002-G01
    point: 'Advanced connectors for written argumentation'
    explanation: 'Using sophisticated connectors for structured written expression'
    examples:
      - 'Despite the difficulties, the project progressed.'
      - 'In contrast, the results were positive.'
    cefrNotes: 'B2 learners use advanced connectors for formal written argumentation'

culturalNotes: "British essay writing values clear thesis and systematic development. Using 'my thesis is that' or 'I argue that' introduces your argument."
