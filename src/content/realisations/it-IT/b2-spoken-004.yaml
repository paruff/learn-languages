grammar:
  - id: it-IT-B2-SPOKEN-004-G01
    point: 'Impersonal structures for formal announcements'
    explanation: 'Using impersonal constructions to add formality and objectivity to public announcements'
    examples:
      - 'It is announced that the meeting is postponed.'
      - 'Passengers are reminded to keep their belongings.'
    cefrNotes: 'B2 learners use passive/impersonal forms for formal public communication'

culturalNotes: "British public announcements (transport, events) use formal register: 'We would like to inform passengers that...' rather than direct imperatives."
