nodeId: B2-ARGUE-001
lang: it-IT
vocabulary:
  - id: it-IT-B2-ARGUE-001-001
    concept: 'to-construct-a-chain-of-reasoning'
    term: 'costruire una catena di ragionamento'
    translation: 'to construct a chain of reasoning'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I will construct a chain of reasoning to explain.'
    exampleTranslation: 'Vou construir uma cadeia de raciocínio para explicar.'
  - id: it-IT-B2-ARGUE-001-002
    concept: 'to-develop-the-argument'
    term: 'sviluppare l’argomento'
    translation: 'to develop the argument'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'It is important to develop the argument step by step.'
    exampleTranslation: 'É importante desenvolver o argumento passo a passo.'
  - id: it-IT-B2-ARGUE-001-003
    concept: 'to-present-deductions'
    term: 'presentare deduzioni'
    translation: 'to present deductions'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I can present deductions based on facts.'
    exampleTranslation: 'Posso apresentar deduções baseadas em factos.'
  - id: it-IT-B2-ARGUE-001-004
    concept: 'to-connect-ideas-logically'
    term: 'collegare le idee logicamente'
    translation: 'to connect ideas logically'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I need to connect the ideas logically.'
    exampleTranslation: 'Preciso de ligar as ideias de forma lógica.'
  - id: it-IT-B2-ARGUE-001-005
    concept: 'to-use-consequence-connectors'
    term: 'usare connettori di conseguenza'
    translation: 'to use consequence connectors'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'It is useful to use connectors like therefore, thus, consequently.'
    exampleTranslation: 'É útil usar conectores como portanto, logo, por conseguinte.'
  - id: it-IT-B2-ARGUE-001-006
    concept: 'to-structure-the-discourse'
    term: 'strutturare il discorso'
    translation: 'to structure the discourse'
    partOfSpeech: 'phrase'
    gender: 'n/a'
    example: 'I will structure the discourse in three parts.'
    exampleTranslation: 'Vou estruturar o discurso em três partes.'
grammar:
  - id: it-IT-B2-ARGUE-001-G01
    point: 'Passive voice for objectivity'
    explanation: 'Using passive constructions to add formality and objectivity'
    examples:
      - 'The project was developed by the team.'
      - 'Several arguments were presented.'
    cefrNotes: 'B2 learners use passive voice to shift focus from agent to action'

culturalNotes: "British academic discourse values logical structure. Using 'firstly', 'furthermore', 'in conclusion' signals organised thinking."
