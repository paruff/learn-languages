    concept: news
    term: notizia
    translation: news
    partOfSpeech: noun
    gender: feminine
    example: La notizia è molto interessante.
    exampleTranslation: The news is very interesting.
  - id: it-IT-A2-HABIT-003-002
    concept: press
    term: stampa
    translation: press
    partOfSpeech: noun
    gender: feminine
    example: La stampa parla del cambiamento climatico.
    exampleTranslation: The press is talking about climate change.
  - id: it-IT-A2-HABIT-003-003
    concept: television
    term: televisione
    translation: television
    partOfSpeech: noun
    gender: feminine
    example: Guardo la televisione la sera.
    exampleTranslation: I watch television in the evening.
  - id: it-IT-A2-HABIT-003-004
    concept: newspaper
    term: giornale
    translation: newspaper
    partOfSpeech: noun
    gender: masculine
    example: Leggo il giornale al mattino.
