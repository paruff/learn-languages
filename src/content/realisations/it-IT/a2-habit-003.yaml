grammar:
  - id: it-IT-A2-HABIT-003-G01
    point: comprendere notizie semplici
    explanation: Leggere e capire articoli e titoli di notizie in lingua semplice.
    examples:
      - Il giornale parla del clima.
      - Il rapporto descrive gli eventi.
    cefrNotes: A2 learners identify core news vocabulary and understand short current-events
      items.
culturalNotes: La notizia e la stampa sono fonti comuni di informazione e spesso stimolano
  conversazioni su politica, clima e vita quotidiana.
