grammar:
  - id: it-IT-B2-TEXT-001-G01
    point: 'Complex noun phrases for academic reading'
    explanation: 'Using extended noun phrases for precise academic comprehension'
    examples:
      - 'The sustainable development policy was implemented.'
      - 'The reference document presents the guiding principles.'
    cefrNotes: 'B2 learners handle complex noun phrases for academic reading'

culturalNotes: "British academic reading requires identifying key arguments. Using 'the author argues that' or 'the presented thesis is' helps summarise positions."
