grammar:
  - id: it-IT-A2-CULT-002-G01
    point: confrontare culture e usanze
    explanation: Usare il comparativo per parlare delle differenze tra culture e tradizioni.
    examples:
      - La cultura italiana è diversa da quella spagnola.
      - Le usanze variano da regione a regione.
    cefrNotes: A2 learners compare cultural practices using basic comparative phrases.
culturalNotes: Le differenze regionali in Italia sono marcate, soprattutto tra cucina,
  dialetti e abitudini festive.
