vocabulary:
  - id: it-IT-C1-MEDIATION-001-001
    concept: to-translate-for-laymen
    term: tradurre per i non addetti ai lavori
    translation: to translate for laymen
    partOfSpeech: phrase
    gender: n/a
    example: Tradurre per i non addetti ai lavori significa semplificare senza tradire il senso.
    exampleTranslation: Translating for laypeople means simplifying without betraying the meaning.
  - id: it-IT-C1-MEDIATION-001-002
    concept: to-simplify-without-losing-rigour
    term: semplificare senza perdere rigore
    translation: to simplify without losing rigour
    partOfSpeech: phrase
    gender: n/a
    example: Il giornalista semplifica i dati complessi senza perdere rigore.
    exampleTranslation: The journalist simplifies the complex data without losing rigour.
  - id: it-IT-C1-MEDIATION-001-003
    concept: to-bridge-between-audiences
    term: fare da ponte tra pubblici
    translation: to bridge between audiences
    partOfSpeech: phrase
    gender: n/a
    example: Il mediatore fa da ponte tra il pubblico tecnico e quello generico.
    exampleTranslation: The mediator bridges between the technical and general audiences.
  - id: it-IT-C1-MEDIATION-001-004
    concept: to-rewrite-the-explanation
    term: riscrivere la spiegazione
    translation: to rewrite the explanation
    partOfSpeech: phrase
    gender: n/a
    example: Ha riscritto la spiegazione tre volte finché non è stata chiara.
    exampleTranslation: He rewrote the explanation three times until it was clear.
  - id: it-IT-C1-MEDIATION-001-005
    concept: the-heart-of-the-matter
    term: il nocciolo della questione
    translation: the heart of the matter
    partOfSpeech: noun
    gender: masculine
    example: Il nocciolo della questione è la definizione delle priorità.
    exampleTranslation: The heart of the matter is the definition of priorities.
  - id: it-IT-C1-MEDIATION-001-006
    concept: presentation-in-simple-terms
    term: esposizione in termini semplici
    translation: presentation in simple terms
    partOfSpeech: noun
    gender: feminine
    example: L'esposizione in termini semplici ha convinto l'assemblea.
    exampleTranslation: The presentation in simple terms convinced the assembly.
