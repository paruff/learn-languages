    concept: critical-review
    term: recensione critica
    translation: critical review
    partOfSpeech: noun
    gender: feminine
    example: La recensione critica è destinata a una rivista culturale.
    exampleTranslation: The critical review is intended for a cultural magazine.
  - id: it-IT-C1-WRITTEN-002-002
    concept: reference-works
    term: opere di riferimento
    translation: reference works
    partOfSpeech: noun
    gender: feminine
    example: L'articolo attinge a opere di riferimento indispensabili.
    exampleTranslation: The article draws on indispensable reference works.
  - id: it-IT-C1-WRITTEN-002-003
    concept: aesthetic-judgement
    term: giudizio estetico
