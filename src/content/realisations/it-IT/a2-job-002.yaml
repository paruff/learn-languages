  concept: routine
  term: routine
  translation: routine
  partOfSpeech: noun
  gender: feminine
  example: La mia routine al lavoro è semplice.
  exampleTranslation: My work routine is simple.
- id: it-IT-A2-JOB-002-002
  concept: task
  term: compito
  translation: task
  partOfSpeech: noun
  gender: masculine
  example: Ho molti compiti oggi.
  exampleTranslation: I have a lot of tasks today.
- id: it-IT-A2-JOB-002-003
  concept: meeting
  term: riunione
  translation: meeting
  partOfSpeech: noun
  gender: feminine
  example: La riunione inizia alle nove.
  exampleTranslation: The meeting starts at nine.
- id: it-IT-A2-JOB-002-004
  concept: always
