  partOfSpeech: verb
  example: Finisco il lavoro alle sei.
  exampleTranslation: I finish work at six.
grammar:
- id: it-IT-A2-JOB-002-G01
  point: avverbi di frequenza
  explanation: Usare sempre, a volte e di solito per descrivere la frequenza delle
    attività lavorative.
  examples:
  - Arrivo sempre in orario.
  - A volte prendo il pranzo fuori.
  cefrNotes: A2 learners describe routines and frequency in everyday work situations.
culturalNotes: Nelle descrizioni del lavoro quotidiano, i tempi di lavoro e la frequenza
  delle attività sono spesso centrali in conversazioni informali.
