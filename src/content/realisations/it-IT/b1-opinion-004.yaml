grammar:
  - id: B1-GRAMMAR-009
    point: Written opinion structure
    explanation: Organising written opinions with introduction, arguments, and conclusion
    examples:
      - First of all, I want to present my point of view.
      - In conclusion, I defend that we need to act.
    cefrNotes: B1 learners develop written opinion skills with clear structure
culturalNotes: British opinion writing values structured argumentation. Using connectors
  like 'firstly', 'furthermore', 'in conclusion' helps organise written expression.
