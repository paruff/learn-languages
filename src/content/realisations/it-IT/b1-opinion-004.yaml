    concept: opinion-article
    term: articolo di opinione
    translation: opinion article
    partOfSpeech: phrase
    gender: masculine
    example: I read an opinion article about the future of work.
    exampleTranslation: I read an opinion article about the future of work.
  - id: it-IT-B1-OPINION-004-002
    concept: to-write-about
    term: scrivere di
    translation: to write about
    partOfSpeech: phrase
    gender: n/a
    example: I am going to write about the importance of education.
    exampleTranslation: I am going to write about the importance of education.
  - id: it-IT-B1-OPINION-004-003
    concept: to-express-my-position
    term: esprimere la mia posizione
    translation: to express my position
    partOfSpeech: phrase
    gender: n/a
    example: It is important to express my position clearly.
