grammar:
- id: it-IT-A2-CULT-001-G01
  point: descrivere eventi culturali
  explanation: Usare aggettivi e avverbi per descrivere festival e celebrazioni.
  examples:
  - Il festival è molto popolare.
  - La celebrazione è stata incredibile.
  cefrNotes: A2 learners can describe cultural events and traditions in simple connected
    speech.
culturalNotes: In Italia i festival e le sagre sono spesso legati a produzioni locali,
  tradizioni regionali e celebrazioni religiose.
