grammar:
  - id: it-IT-A2-STUDY-003-G01
    point: comprendere testi accademici semplici
    explanation: Usare strategie di lettura per capire idee principali e dettagli nei
      testi di studio.
    examples:
      - L’articolo parla dei risultati dello studio.
      - Il riassunto mette in luce le conclusioni.
    cefrNotes: A2 learners understand simple academic texts by scanning for main ideas
      and key details.
culturalNotes: L’istruzione e la lettura di testi informativi sono momenti importanti
  per lo studio e per la cultura generale.
