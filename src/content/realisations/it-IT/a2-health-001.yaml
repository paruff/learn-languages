grammar:
  - id: it-IT-A2-HEALTH-001-G01
    point: descrivere sintomi
    explanation: Usare “ho” + sintomo per parlare di problemi di salute in modo semplice.
    examples:
      - Ho mal di testa.
      - Mi sento stanco.
    cefrNotes: A2 learners describe symptoms and understand basic medical advice.
culturalNotes: In Italia la visita dal medico richiede spesso prenotazione e la farmacia
  è un punto di riferimento comune per consigli pratici.
