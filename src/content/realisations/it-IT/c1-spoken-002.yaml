  - id: it-IT-C1-SPOKEN-002-001
    concept: to-get-down-to-business
    term: 'andare al sodo'
    translation: 'to get down to business'
    partOfSpeech: phrase
    gender: n/a
    example: 'Dopo i convenevoli, è ora di andare al sodo.'
    exampleTranslation: "Enough beating about the bush; let's get down to business."
  - id: it-IT-C1-SPOKEN-002-002
    concept: a-wild-and-uncalled-for-addition
    term: 'aggiunta fuori luogo'
    translation: 'a wild and uncalled-for addition'
    partOfSpeech: phrase
    gender: feminine
    example: "Quel commento è stato un'aggiunta fuori luogo alla discussione."
    exampleTranslation: 'That comment was a wild and uncalled-for addition to the discussion.'
  - id: it-IT-C1-SPOKEN-002-003
    concept: to-have-the-patience-of-a-saint
    term: 'avere la pazienza di un santo'
    translation: 'to have the patience of a saint'
    partOfSpeech: phrase
    gender: n/a
    example: "L'insegnante ha la pazienza di un santo con gli alunni più lenti."
    exampleTranslation: 'The teacher has the patience of a saint with the slower students.'
  - id: it-IT-C1-SPOKEN-002-004
    concept: to-know-what-one-is-talking-about
    term: 'sapere di che cosa si parla'
