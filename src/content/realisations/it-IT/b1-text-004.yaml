grammar:
  - id: B1-GRAMMAR-018
    point: Cohesive writing with discourse markers
    explanation: Using connectors and linking words for text coherence
    examples:
      - First, I will describe the context.
      - Then, I present my conclusions.
    cefrNotes: B1 learners develop cohesive writing skills
culturalNotes: British writing values clear structure and logical flow. Using 'firstly',
  'furthermore', 'in conclusion' helps organise written expression.
