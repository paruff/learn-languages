grammar:
- id: it-IT-A2-JOB-003-G01
  point: leggere annunci di lavoro
  explanation: Analizzare parole chiave e informazioni essenziali negli annunci.
  examples:
  - L’annuncio chiede due anni di esperienza.
  - Lo stipendio è tra mille e millecinquecento euro.
  cefrNotes: A2 learners scan job advertisements for key information such as pay and
    requirements.
culturalNotes: Gli annunci di lavoro italiani spesso menzionano esperienza, orario
  e requisiti linguistici o di formazione.
