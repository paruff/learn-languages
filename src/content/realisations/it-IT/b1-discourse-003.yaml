vocabulary:
  - id: it-IT-B1-DISCOURSE-003-001
    concept: due-to
    term: a causa di
    translation: due to
    partOfSpeech: phrase
    gender: n/a
    example: Due to the rain, the event was postponed.
    exampleTranslation: Due to the rain, the event was postponed.
  - id: it-IT-B1-DISCOURSE-003-002
    concept: as-a-result
    term: di conseguenza
    translation: as a result
    partOfSpeech: phrase
    gender: n/a
    example: As a result, the economy grew.
    exampleTranslation: As a result, the economy grew.
  - id: it-IT-B1-DISCOURSE-003-003
    concept: because-of
    term: a causa di
    translation: because of
    partOfSpeech: phrase
    gender: n/a
    example: Because of the traffic, I arrived late.
    exampleTranslation: Because of the traffic, I arrived late.
  - id: it-IT-B1-DISCOURSE-003-004
    concept: consequently
    term: di conseguenza
    translation: consequently
    partOfSpeech: phrase
    gender: n/a
    example: Consequently, we needed to change plans.
    exampleTranslation: Consequently, we needed to change plans.
  - id: it-IT-B1-DISCOURSE-003-005
    concept: this-led-to
    term: questo ha portato a
    translation: this led to
    partOfSpeech: phrase
    gender: n/a
    example: This led to us making new discoveries.
    exampleTranslation: This led to us making new discoveries.
  - id: it-IT-B1-DISCOURSE-003-006
    concept: the-cause-was
    term: la causa era
    translation: the cause was
    partOfSpeech: phrase
    gender: feminine
    example: The cause was the lack of communication.
    exampleTranslation: The cause was the lack of communication.
grammar:
  - id: B1-GRAMMAR-012
    point: Cause and effect connectors
    explanation: Using 'due to', 'as a result', 'because of' for causal relationships
    examples:
      - Due to the price increase, many customers changed.
      - As a result of the reform, the system improved.
    cefrNotes: Cause and effect connectors enable B1 learners to express reasoning
culturalNotes: British communication values clear cause and effect relationships.
  Using 'due to' or 'as a result' demonstrates analytical thinking.
