grammar:
  - id: it-IT-B2-SPOKEN-001-G01
    point: 'Reported speech in listening comprehension'
    explanation: 'Using indirect speech to summarise spoken content'
    examples:
      - 'The speaker explained that the project would start soon.'
      - 'According to him, the measures were already being implemented.'
    cefrNotes: 'B2 learners use reported speech to summarise what they hear'

culturalNotes: "British lectures value signposting. Using 'firstly', 'to sum up' helps follow the speaker's structure."
