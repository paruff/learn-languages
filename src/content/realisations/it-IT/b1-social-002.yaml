grammar:
  - id: B1-GRAMMAR-003
    point: Conditional tense for polite conversation
    explanation: Using conditional forms (gostaria, poderia, seria) to soften statements
    examples:
      - I would like to know more about that.
      - Would it be possible to meet tomorrow?
    cefrNotes: Conditional tense enables more nuanced and polite extended conversation
culturalNotes: British conversation culture values active listening and taking turns.
  Showing interest through follow-up questions is appreciated. Avoid dominating the
  conversation.
