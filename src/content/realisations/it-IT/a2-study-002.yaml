grammar:
- id: it-IT-A2-STUDY-002-G01
  point: passato per esperienze scolastiche
  explanation: Usare il passato semplice per descrivere la propria esperienza scolastica.
  examples:
  - Ho studiato all’università di Milano.
  - L’insegnante era molto paziente.
  cefrNotes: A2 learners narrate school and study history using simple past forms.
culturalNotes: Le esperienze scolastiche sono spesso opinioni personali legate alla
  qualità dell’insegnamento e alla routine della classe.
