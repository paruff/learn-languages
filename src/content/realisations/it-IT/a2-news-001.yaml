grammar:
- id: it-IT-A2-NEWS-001-G01
  point: strategies per leggere le notizie
  explanation: Capire titoli e informazioni principali in un articolo semplice.
  examples:
  - L’articolo parla dell’economia.
  - Il titolo riassume l’evento.
  cefrNotes: A2 learners scan news items for main ideas and key details.
culturalNotes: Le notizie e i giornali locali sono una fonte importante per orientarsi
  sui temi del giorno in Italia.
