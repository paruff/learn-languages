grammar:
  - id: it-IT-B2-SPOKEN-003-G01
    point: 'Advanced reported speech with complex tenses'
    explanation: 'Using sophisticated indirect speech for summarising complex spoken content'
    examples:
      - 'The speaker argued that the situation would worsen if measures were not taken.'
      - 'He explained that, given the data, the conclusion was inevitable.'
    cefrNotes: 'B2 learners handle advanced reported speech for complex summarisation'

culturalNotes: "British spoken discourse values understanding implicit meanings. Using 'that is to say' or 'in other words' signals clarification or paraphrase."
