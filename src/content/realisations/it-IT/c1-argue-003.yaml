vocabulary:
  - id: it-IT-C1-ARGUE-003-001
    concept: to-soften-a-statement
    term: attenuare un'affermazione
    translation: to soften a statement
    partOfSpeech: phrase
    gender: n/a
    example: In un contesto delicato conviene attenuare un'affermazione.
    exampleTranslation: In a sensitive setting, it is better to soften a statement.
  - id: it-IT-C1-ARGUE-003-002
    concept: to-qualify-one-s-opinion
    term: sfumare la propria opinione
    translation: to qualify one's opinion
    partOfSpeech: phrase
    gender: n/a
    example: Sfumare la propria opinione con esempi concreti è segno di maturità.
    exampleTranslation: Qualifying one's opinion with concrete examples is a sign of maturity.
  - id: it-IT-C1-ARGUE-003-003
    concept: rhetorical-modesty
    term: modestia retorica
    translation: rhetorical modesty
    partOfSpeech: noun
    gender: feminine
    example: La modestia retorica permette di presentare idee forti senza ostilità.
    exampleTranslation: Rhetorical modesty allows presenting strong ideas without hostility.
  - id: it-IT-C1-ARGUE-003-004
    concept: to-show-reserve
    term: mostrare riserbo
    translation: to show reserve
    partOfSpeech: phrase
    gender: n/a
    example: Ha mostrato riserbo sulle previsioni più ottimistiche.
    exampleTranslation: He showed reserve regarding the most optimistic forecasts.
  - id: it-IT-C1-ARGUE-003-005
    concept: to-guard-one-s-opinion
    term: custodire la propria opinione
    translation: to guard one's opinion
    partOfSpeech: phrase
    gender: n/a
    example: Ha custodito la propria opinione con un'ultima riserva.
    exampleTranslation: He guarded his opinion with a final caveat.
  - id: it-IT-C1-ARGUE-003-006
    concept: to-express-prudent-doubt
    term: esprimere un dubbio prudente
    translation: to express prudent doubt
    partOfSpeech: phrase
    gender: n/a
    example: Esprimere un dubbio prudente prima di acconsentire è comune nelle conversazioni informali.
    exampleTranslation: Expressing prudent doubt before agreeing is common in informal conversations.
