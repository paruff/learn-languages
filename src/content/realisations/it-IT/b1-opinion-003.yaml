    term: i vantaggi sono
    translation: the advantages are
    partOfSpeech: phrase
    gender: n/a
    example: The advantages are economic and environmental.
    exampleTranslation: The advantages are economic and environmental.
  - id: it-IT-B1-OPINION-003-002
    concept: the-disadvantages-are
    term: gli svantaggi sono
    translation: the disadvantages are
    partOfSpeech: phrase
    gender: n/a
    example: The disadvantages are the cost and the time.
    exampleTranslation: The disadvantages are the cost and the time.
  - id: it-IT-B1-OPINION-003-003
    concept: on-the-one-hand-on-the-other-hand
    term: da un lato... dall'altro
    translation: on the one hand... on the other hand
