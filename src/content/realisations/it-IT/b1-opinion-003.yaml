grammar:
  - id: B1-GRAMMAR-008
    point: Comparative structures for advantages and disadvantages
    explanation: Using 'more... than', 'as... as' for comparison
    examples:
      - This project is more advantageous than the previous one.
      - The cost is as high as the benefit.
    cefrNotes: B1 learners expand comparative structures for balanced assessment
culturalNotes: British discussion of pros and cons values balanced perspective. Using
  'on the one hand... on the other hand' shows considered thinking.
