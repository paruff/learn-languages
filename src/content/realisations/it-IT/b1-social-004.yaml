grammar:
  - id: B1-GRAMMAR-005
    point: Discourse management phrases
    explanation: Using set phrases to manage conversation flow and turn-taking
    examples:
      - In my opinion, I think that...
      - I understand your point of view, however...
    cefrNotes: Discourse management phrases help B1 learners maintain extended conversations
culturalNotes: British conversation values polite turn-taking and avoiding interruption.
  Using phrases like 'Sorry to interrupt' or 'If I may add' shows respect for other
  speakers.
