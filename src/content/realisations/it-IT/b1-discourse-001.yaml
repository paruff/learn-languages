grammar:
  - id: B1-GRAMMAR-010
    point: Complex connectors for extended discourse
    explanation: Using connectors beyond and, but, because to organise longer speech
    examples:
      - Furthermore, we need to consider the budget.
      - However, the situation is not so simple.
    cefrNotes: B1 introduces advanced connectors for organised discourse
culturalNotes: British discourse values logical connectors. Using 'furthermore', 'however',
  'therefore' demonstrates organised thinking in formal contexts.
