nodeId: B1-SOCIAL-003
lang: pt-PT
vocabulary:
  - id: pt-PT-B1-SOCIAL-003-001
    term: 'sentir-se'
    translation: 'to feel'
    partOfSpeech: verb
    gender: n/a
    example: 'Sinto-me muito bem quando estou com os meus amigos.'
    exampleTranslation: 'I feel very good when I am with my friends.'
  - id: pt-PT-B1-SOCIAL-003-002
    term: 'expressar sentimentos'
    translation: 'to express feelings'
    partOfSpeech: phrase
    gender: n/a
    example: 'É importante expressar os nossos sentimentos.'
    exampleTranslation: 'It is important to express our feelings.'
  - id: pt-PT-B1-SOCIAL-003-003
    term: 'concordar com'
    translation: 'to agree with'
    partOfSpeech: phrase
    gender: n/a
    example: 'Concordo completamente com a sua opinião.'
    exampleTranslation: 'I completely agree with your opinion.'
  - id: pt-PT-B1-SOCIAL-003-004
    term: 'discordar educadamente'
    translation: 'to disagree politely'
    partOfSpeech: phrase
    gender: n/a
    example: 'Compreendo o seu ponto, mas discordo educadamente.'
    exampleTranslation: 'I understand your point, but I disagree politely.'
  - id: pt-PT-B1-SOCIAL-003-005
    term: 'demonstrar interesse'
    translation: 'to show interest'
    partOfSpeech: phrase
    gender: n/a
    example: 'É bom demonstrar interesse quando alguém nos conta algo.'
    exampleTranslation: 'It is good to show interest when someone tells us something.'
  - id: pt-PT-B1-SOCIAL-003-006
    term: 'partilhar a minha perspetiva'
    translation: 'to share my perspective'
    partOfSpeech: phrase
    gender: n/a
    example: 'Gostava de partilhar a minha perspetiva sobre este assunto.'
    exampleTranslation: 'I would like to share my perspective on this topic.'
grammar:
  - id: B1-GRAMMAR-004
    point: 'Sentir-se + adjective for emotional states'
    explanation: 'Using reflexive verb sentir-se with adjectives to describe feelings'
    examples:
      - 'Sinto-me motivado para começar o projeto.'
      - 'Ela sente-se confiante na sua decisão.'
    cefrNotes: 'Sentir-se constructions allow B1 learners to express nuanced emotional states'
culturalNotes: 'Portuguese people value emotional expression in conversation. Sharing feelings is seen as a sign of trust and openness in relationships.'
