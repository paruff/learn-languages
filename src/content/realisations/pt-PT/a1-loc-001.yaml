nodeId: A1-LOC-001
lang: pt-PT
vocabulary:
  - id: pt-PT-A1-LOC-001-001
    term: 'Onde fica...?'
    translation: 'Where is...?'
    partOfSpeech: phrase
    example: 'Onde fica a estação de comboios?'
    exampleTranslation: 'Where is the train station?'
  - id: pt-PT-A1-LOC-001-002
    term: 'À esquerda'
    translation: 'On the left'
    partOfSpeech: phrase
    example: 'A loja fica à esquerda.'
    exampleTranslation: 'The shop is on the left.'
  - id: pt-PT-A1-LOC-001-003
    term: 'À direita'
    translation: 'On the right'
    partOfSpeech: phrase
    example: 'Vire à direita.'
    exampleTranslation: 'Turn right.'
  - id: pt-PT-A1-LOC-001-004
    term: 'Em frente'
    translation: 'Straight ahead'
    partOfSpeech: phrase
    example: 'Siga em frente.'
    exampleTranslation: 'Go straight ahead.'
grammar: []
culturalNotes: 'Portuguese directions often reference landmarks (perto da igreja, ao lado do café) rather than street numbers.'
