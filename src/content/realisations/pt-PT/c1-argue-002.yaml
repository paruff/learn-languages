nodeId: C1-ARGUE-002
lang: pt-PT
vocabulary:
  - id: pt-PT-C1-ARGUE-002-001
    term: 'refutar um argumento'
    translation: 'to refute an argument'
    partOfSpeech: phrase
    gender: n/a
    example: 'Refutou o argumento do adversário com dados objetivos.'
    exampleTranslation: "She refuted her opponent's argument with objective data."
  - id: pt-PT-C1-ARGUE-002-002
    term: 'ponderar os prós e contras'
    translation: 'to weigh the pros and cons'
    partOfSpeech: phrase
    gender: n/a
    example: 'Antes de decidir, ponderou os prós e contras de cada opção.'
    exampleTranslation: 'Before deciding, she weighed the pros and cons of each option.'
  - id: pt-PT-C1-ARGUE-002-003
    term: 'apresentar contra-argumentos'
    translation: 'to present counter-arguments'
    partOfSpeech: phrase
    gender: n/a
    example: 'Não se limitou a defender a sua posição; também apresentou contra-argumentos.'
    exampleTranslation: 'She did not just defend her position; she also presented counter-arguments.'
  - id: pt-PT-C1-ARGUE-002-004
    term: 'dar ênfase a'
    translation: 'to give emphasis to'
    partOfSpeech: phrase
    gender: n/a
    example: 'O orador deu ênfase à necessidade de um diálogo aberto.'
    exampleTranslation: 'The speaker gave emphasis to the need for open dialogue.'
  - id: pt-PT-C1-ARGUE-002-005
    term: 'tirar conclusões'
    translation: 'to draw conclusions'
    partOfSpeech: phrase
    gender: n/a
    example: 'No final, tirou conclusões que surpreenderam parte da audiência.'
    exampleTranslation: 'In the end, she drew conclusions that surprised part of the audience.'
  - id: pt-PT-C1-ARGUE-002-006
    term: 'fundamentar a posição'
    translation: "to substantiate one's position"
    partOfSpeech: phrase
    gender: n/a
    example: 'Fundamentou a sua posição em estudos recentes.'
    exampleTranslation: 'She substantiated her position with recent studies.'
grammar:
  - id: C1-GRAMMAR-004
    point: 'Advanced discourse connectors'
    explanation: "Using multi-word connectors such as 'na medida em que' and 'tendo em conta que' to structure reasoned argumentation and evaluate counter-arguments"
    examples:
      - 'Tendo em conta que os custos aumentaram, é razoável rever o plano.'
      - 'Na medida em que os dados apoiam esta leitura, a proposta é defensável.'
    cefrNotes: 'C1 learners use complex connectors to signal logical relationships explicitly in extended argument'
culturalNotes: 'European Portuguese argumentation favours explicit logical structuring: speakers signal concession and rebuttal openly before asserting the conclusion, often saving the decisive point for the end for rhetorical effect.'
