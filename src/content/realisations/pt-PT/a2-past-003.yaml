nodeId: A2-PAST-003
lang: pt-PT
vocabulary:
  - id: pt-PT-A2-PAST-003-001
    term: 'história'
    translation: 'story'
    partOfSpeech: noun
    gender: feminine
    example: 'A história do meu avô é muito interessante.'
    exampleTranslation: "My grandfather's story is very interesting."
  - id: pt-PT-A2-PAST-003-002
    term: 'acontecer'
    translation: 'to happen'
    partOfSpeech: verb
    example: 'O que é que aconteceu ontem?'
    exampleTranslation: 'What happened yesterday?'
  - id: pt-PT-A2-PAST-003-003
    term: 'quando'
    translation: 'when'
    partOfSpeech: conjunction
    example: 'Quando era criança, brincava na rua.'
    exampleTranslation: 'When I was a child, I played in the street.'
  - id: pt-PT-A2-PAST-003-004
    term: 'lembrar-se'
    translation: 'to remember'
    partOfSpeech: verb
    example: 'Lembro-me daquele dia perfeitamente.'
    exampleTranslation: 'I remember that day perfectly.'
  - id: pt-PT-A2-PAST-003-005
    term: 'naquela época'
    translation: 'at that time'
    partOfSpeech: adverb
    example: 'Naquela época não havia internet.'
    exampleTranslation: 'At that time there was no internet.'
  - id: pt-PT-A2-PAST-003-006
    term: 'recordar'
    translation: 'to recall'
    partOfSpeech: verb
    example: 'Recordo-me bem daquela viagem.'
    exampleTranslation: 'I recall that trip well.'
grammar:
  - id: pt-PT-A2-PAST-003-G01
    point: 'understanding past narratives'
    explanation: 'Following sequences of past events'
    examples:
      - 'Quando era criança, vivia no Algarve.'
      - 'Um dia, aconteceu algo estranho.'
culturalNotes: 'Portuguese oral tradition values storytelling. Grandparents often share stories about the past, especially about rural life and traditions.'
