grammar:
  - id: C2-GRAMMAR-014
    point: 'Advanced passive impersonal constructions for academic prose'
    explanation: "Use advanced impersonal constructions for academic prose: 'Demonstra-se que os resultados são consistentes com a hipótese' (It is demonstrated that the results are consistent with the hypothesis)."
    examples:
      - 'Sublinha-se que a análise revela padrões significativos.'
      - 'Não se pode ignorar que a evidência é robusta.'
    cefrNotes: 'C2 academic writers use advanced impersonal constructions for sophisticated argumentation'
culturalNotes: 'At C2 level, Portuguese academic writers can express themselves clearly and fluently on complex subjects, presenting well-structured, coherent and convincing texts with effective use of a wide range of language.'
