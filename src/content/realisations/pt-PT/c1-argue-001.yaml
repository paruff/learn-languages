vocabulary:
  - id: pt-PT-C1-ARGUE-001-001
    term: 'desenvolver sub-temas'
    translation: 'to develop sub-topics'
    partOfSpeech: phrase
    gender: n/a
    example: 'O orador desenvolveu os sub-temas com uma coerência invejável.'
    exampleTranslation: 'The speaker developed the sub-topics with enviable coherence.'
  - id: pt-PT-C1-ARGUE-001-002
    term: 'estruturar a exposição'
    translation: 'to structure the presentation'
    partOfSpeech: phrase
    gender: n/a
    example: 'Saber estruturar a exposição é essencial para manter a atenção.'
    exampleTranslation: 'Knowing how to structure the presentation is essential for keeping attention.'
  - id: pt-PT-C1-ARGUE-001-003
    term: 'aprofundar os pontos'
    translation: 'to elaborate the points'
    partOfSpeech: phrase
    gender: n/a
    example: 'Após a introdução, aprofundou os pontos mais polémicos da questão.'
    exampleTranslation: 'After the introduction, he elaborated on the most controversial points of the issue.'
  - id: pt-PT-C1-ARGUE-001-004
