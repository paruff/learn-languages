    translation: 'to establish connections'
    partOfSpeech: phrase
    gender: n/a
    example: 'Foi notável a forma como estabeleceu ligações entre os vários temas.'
    exampleTranslation: 'The way he established connections between the various topics was remarkable.'
  - id: pt-PT-C1-ARGUE-001-005
    term: 'apresentar uma visão global'
    translation: 'to present an overview'
    partOfSpeech: phrase
