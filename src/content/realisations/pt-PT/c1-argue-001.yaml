    exampleTranslation: 'The historical examples gave depth to the presentation.'
grammar:
  - id: C1-GRAMMAR-003
    point: 'Cleft sentences with ser + relative clause'
    explanation: "Using constructions like 'E foi... que' to highlight and focus the element the speaker considers most significant"
    examples:
      - 'Foi a falta de investimento que travou o projeto.'
      - 'É precisamente este ponto que quero aprofundar.'
    cefrNotes: 'C1 learners use cleft sentences to manage emphasis deliberately in extended discourse'
culturalNotes: "In European Portuguese, cleft structures with 'é que' are a natural spoken resource for emphasis. Speakers foreground new or contested information while keeping the rest of the sentence grammatically intact, which allows emphasis without rising intonation."
