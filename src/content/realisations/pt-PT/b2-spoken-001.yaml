grammar:
  - id: B2-GRAMMAR-013
    point: 'Reported speech in listening comprehension'
    explanation: 'Using indirect speech to summarise spoken content'
    examples:
      - 'O orador explicou que o projeto seria iniciado em breve.'
      - 'Segundo ele, as medidas já estavam a ser implementadas.'
    cefrNotes: 'B2 learners use reported speech to summarise what they hear'
culturalNotes: "Portuguese lectures value signposting. Using 'em primeiro lugar', 'para concluir' helps follow the speaker's structure."
