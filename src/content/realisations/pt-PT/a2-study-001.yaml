grammar:
  - id: pt-PT-A2-STUDY-001-G01
    point: 'connectors for listing (e, mas, também)'
    explanation: 'Used to connect educational experiences'
    examples:
      - 'Estudo na universidade e trabalho ao fim de semana.'
      - 'Tenho um diploma, mas quero fazer um mestrado.'
culturalNotes: 'Portuguese higher education follows the Bologna Process. Students typically complete a licenciatura (3 years) before a mestrado (2 years).'
