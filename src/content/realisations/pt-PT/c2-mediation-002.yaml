grammar:
  - id: C2-GRAMMAR-017
    point: 'Advanced participial clauses for reading comprehension at C2 level'
    explanation: "Use participial clauses for advanced reading comprehension: 'Tendo lido o texto na íntegra, compreendo todas as suas camadas de significado' (Having read the text in full, I understand all its layers of meaning)."
    examples:
      - 'Tendo analisado a obra, reconheço todas as alusões culturais.'
      - 'Depois de examinar o texto, interpreto o seu significado implícito.'
    cefrNotes: 'C2 readers use participial clauses to demonstrate sophisticated comprehension of complex texts'
culturalNotes: 'At C2 level, Portuguese readers can understand all forms of written language, including abstract, technically and linguistically complex texts, grasping the finer points of style and implicit meaning.'
