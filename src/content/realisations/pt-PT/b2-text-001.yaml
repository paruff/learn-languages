nodeId: B2-TEXT-001
lang: pt-PT
vocabulary:
  - id: pt-PT-B2-TEXT-001-001
    term: 'ler com autonomia'
    translation: 'to read with independence'
    partOfSpeech: phrase
    gender: n/a
    example: 'Consigo ler com autonomia sobre temas familiares.'
    exampleTranslation: 'I can read with independence on familiar topics.'
  - id: pt-PT-B2-TEXT-001-002
    term: 'compreender textos de dificuldade média'
    translation: 'to understand texts of medium difficulty'
    partOfSpeech: phrase
    gender: n/a
    example: 'Vou compreender textos de dificuldade média.'
    exampleTranslation: 'I will understand texts of medium difficulty.'
  - id: pt-PT-B2-TEXT-001-003
    term: 'identificar ideias principais'
    translation: 'to identify main ideas'
    partOfSpeech: phrase
    gender: n/a
    example: 'É importante identificar as ideias principais do texto.'
    exampleTranslation: 'It is important to identify the main ideas of the text.'
  - id: pt-PT-B2-TEXT-001-004
    term: 'usar estratégias de leitura'
    translation: 'to use reading strategies'
    partOfSpeech: phrase
    gender: n/a
    example: 'Vou usar estratégias de leitura para compreender melhor.'
    exampleTranslation: 'I will use reading strategies to understand better.'
  - id: pt-PT-B2-TEXT-001-005
    term: 'ler de forma crítica'
    translation: 'to read critically'
    partOfSpeech: phrase
    gender: n/a
    example: 'Preciso de ler de forma crítica para avaliar.'
    exampleTranslation: 'I need to read critically to evaluate.'
  - id: pt-PT-B2-TEXT-001-006
    term: 'adaptar o ritmo de leitura'
    translation: 'to adapt the reading pace'
    partOfSpeech: phrase
    gender: n/a
    example: 'Vou adaptar o ritmo de leitura ao tipo de texto.'
    exampleTranslation: 'I will adapt the reading pace to the type of text.'
grammar:
  - id: B2-GRAMMAR-009
    point: 'Complex noun phrases for academic reading'
    explanation: 'Using extended noun phrases for precise academic comprehension'
    examples:
      - 'A política de desenvolvimento sustentável foi implementada.'
      - 'O documento de referência apresenta as linhas orientadoras.'
    cefrNotes: 'B2 learners handle complex noun phrases for academic reading'
culturalNotes: "Portuguese academic reading requires identifying key arguments. Using 'o autor defende que' or 'a tese apresentada é' helps summarise positions."
