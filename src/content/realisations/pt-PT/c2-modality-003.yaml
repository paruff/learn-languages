    gender: feminine
    example: 'Tenho compreensão total do discurso oral, mesmo veloz.'
    exampleTranslation: 'I have complete understanding of spoken discourse, even fast.'
grammar:
  - id: C2-GRAMMAR-003
    point: 'Advanced conditional and subjunctive for hypothetical listening scenarios'
    explanation: "Use conditional + subjunctive for hypothetical scenarios in listening: 'Mesmo que falassem rapidamente, eu compreenderia tudo' (Even if they spoke quickly, I would understand everything)."
    examples:
      - 'Ainda que o orador seja rápido, consigo seguir o raciocínio.'
      - 'Mesmo com sotaques diferentes, entendo perfeitamente.'
    cefrNotes: 'C2 listeners use hypothetical constructions to express their capacity with any spoken language'
culturalNotes: 'Understanding any kind of spoken Portuguese at fast native speed, including varied accents and registers, demonstrates the highest level of listening comprehension.'
