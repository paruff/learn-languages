vocabulary:
  - id: pt-PT-C2-MODALITY-003-001
    term: 'rápida compreensão auditiva'
    translation: 'rapid auditory comprehension'
    partOfSpeech: phrase
    gender: feminine
    example: 'Tenho uma rápida compreensão auditiva em qualquer registo.'
    exampleTranslation: 'I have rapid auditory comprehension in any register.'
  - id: pt-PT-C2-MODALITY-003-002
    term: 'fala nativa rápida'
    translation: 'fast native speech'
    partOfSpeech: phrase
    gender: feminine
    example: 'Consigo acompanhar a fala nativa rápida sem dificuldade.'
    exampleTranslation: 'I can follow fast native speech without difficulty.'
  - id: pt-PT-C2-MODALITY-003-003
    term: 'sotaques variados'
    translation: 'varied accents'
    partOfSpeech: phrase
    gender: masculine
    example: 'Entendo sotaques variados de português sem problema.'
    exampleTranslation: 'I understand varied Portuguese accents without issue.'
  - id: pt-PT-C2-MODALITY-003-004
    term: 'qualquer tipo de discurso'
    translation: 'any kind of spoken language'
    partOfSpeech: phrase
    gender: masculine
    example: 'Compreendo qualquer tipo de discurso, ao vivo ou gravado.'
    exampleTranslation: 'I understand any kind of spoken language, live or recorded.'
  - id: pt-PT-C2-MODALITY-003-005
    term: 'rápida adaptação'
    translation: 'quick adaptation'
    partOfSpeech: phrase
    gender: feminine
    example: 'Adapto-me rapidamente a qualquer sotaque ou estilo.'
    exampleTranslation: 'I quickly adapt to any accent or style.'
  - id: pt-PT-C2-MODALITY-003-006
