nodeId: B1-OPINION-003
lang: pt-PT
vocabulary:
  - id: pt-PT-B1-OPINION-003-001
    term: 'as vantagens são'
    translation: 'the advantages are'
    partOfSpeech: phrase
    gender: n/a
    example: 'As vantagens são económicas e ambientais.'
    exampleTranslation: 'The advantages are economic and environmental.'
  - id: pt-PT-B1-OPINION-003-002
    term: 'os inconvenientes são'
    translation: 'the disadvantages are'
    partOfSpeech: phrase
    gender: n/a
    example: 'Os inconvenientes são o custo e o tempo.'
    exampleTranslation: 'The disadvantages are the cost and the time.'
  - id: pt-PT-B1-OPINION-003-003
    term: 'por um lado... por outro lado'
    translation: 'on the one hand... on the other hand'
    partOfSpeech: phrase
    gender: n/a
    example: 'Por um lado é bom, por outro lado há riscos.'
    exampleTranslation: 'On the one hand it is good, on the other hand there are risks.'
  - id: pt-PT-B1-OPINION-003-004
    term: 'um aspeto positivo'
    translation: 'a positive aspect'
    partOfSpeech: phrase
    gender: masculine
    example: 'Um aspeto positivo é a sustentabilidade.'
    exampleTranslation: 'A positive aspect is sustainability.'
  - id: pt-PT-B1-OPINION-003-005
    term: 'um aspeto negativo'
    translation: 'a negative aspect'
    partOfSpeech: phrase
    gender: masculine
    example: 'Um aspeto negativo é o custo elevado.'
    exampleTranslation: 'A negative aspect is the high cost.'
  - id: pt-PT-B1-OPINION-003-006
    term: 'no geral'
    translation: 'overall'
    partOfSpeech: phrase
    gender: n/a
    example: 'No geral, acho que é uma boa ideia.'
    exampleTranslation: 'Overall, I think it is a good idea.'
grammar:
  - id: B1-GRAMMAR-008
    point: 'Comparative structures for advantages and disadvantages'
    explanation: "Using 'mais... do que', 'tão... como' for comparison"
    examples:
      - 'Este projeto é mais vantajoso do que o anterior.'
      - 'O custo é tão elevado quanto o benefício.'
    cefrNotes: 'B1 learners expand comparative structures for balanced assessment'
culturalNotes: "When discussing pros and cons in Portuguese, using 'por um lado... por outro lado' signals balanced thinking and is appreciated in academic and professional contexts."
