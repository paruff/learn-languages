    exampleTranslation: 'The final chapter has a one-breath effect.'
grammar:
  - id: C1-GRAMMAR-016
    point: 'Hedging devices for personal narrative'
    explanation: "Managing the distance between memory and certainty with epistemic verbs and adverbs such as 'a meu ver', 'segundo me lembro' and 'tudo indica que'"
    examples:
      - 'Segundo me lembro, a festa durou até de madrugada.'
      - 'Tudo indica que a decisão foi tomada na véspera.'
    cefrNotes: 'C1 writers grade reliability of memory and interpretation in first-person narrative'
culturalNotes: 'European Portuguese memoir writing oscillates between vivid certainty and honest doubt; the writer flags unreliable memory explicitly. This measured tone distinguishes the genre from dramatic storytelling.'
