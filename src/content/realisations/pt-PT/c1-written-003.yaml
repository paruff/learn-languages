vocabulary:
  - id: pt-PT-C1-WRITTEN-003-001
    term: 'narrativa pessoal'
    translation: 'personal narrative'
    partOfSpeech: noun
    gender: feminine
    example: 'A narrativa pessoal do autor cruzou-se com a história coletiva.'
    exampleTranslation: "The author's personal narrative crossed paths with the collective history."
  - id: pt-PT-C1-WRITTEN-003-002
    term: 'fio das lembranças'
    translation: 'thread of memories'
    partOfSpeech: noun
    gender: masculine
    example: 'O texto segue o fio das lembranças sem perder o rumo.'
    exampleTranslation: 'The text follows the thread of memories without losing its way.'
  - id: pt-PT-C1-WRITTEN-003-003
    term: 'memórias de infância'
    translation: 'childhood memories'
    partOfSpeech: noun
    gender: feminine
    example: 'As memórias de infância surgem com nitidez surpreendente.'
    exampleTranslation: 'The childhood memories emerge with surprising clarity.'
  - id: pt-PT-C1-WRITTEN-003-004
    term: 'ponto de vista pessoal'
    translation: 'personal point of view'
    partOfSpeech: noun
    gender: masculine
    example: 'O ponto de vista pessoal dá coerência a toda a crónica.'
    exampleTranslation: 'The personal point of view lends coherence to the whole chronicle.'
  - id: pt-PT-C1-WRITTEN-003-005
    term: 'ressalvas honestas'
    translation: 'honest caveats'
    partOfSpeech: noun
    gender: feminine
    example: 'As ressalvas honestas conferem credibilidade ao relato.'
    exampleTranslation: 'The honest caveats lend credibility to the account.'
  - id: pt-PT-C1-WRITTEN-003-006
    term: 'efeito de um só fôlego'
