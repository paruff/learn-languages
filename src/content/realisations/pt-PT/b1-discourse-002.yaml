grammar:
  - id: B1-GRAMMAR-011
    point: 'Temporal markers for narrative sequence'
    explanation: 'Using time markers to order events in a narrative'
    examples:
      - 'Primeiro, chegámos ao hotel.'
      - 'Em seguida, explorámos a cidade.'
    cefrNotes: 'Temporal markers help B1 learners create coherent narratives'
culturalNotes: 'Portuguese narratives often use descriptive detail. Adding context like weather, mood, or setting enriches storytelling.'
