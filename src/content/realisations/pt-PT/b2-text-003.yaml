nodeId: B2-TEXT-003
lang: pt-PT
vocabulary:
  - id: pt-PT-B2-TEXT-003-001
    term: 'reconhecer a linha de argumentação'
    translation: 'to recognise the line of argument'
    partOfSpeech: phrase
    gender: n/a
    example: 'Consigo reconhecer a linha de argumentação do autor.'
    exampleTranslation: "I can recognise the author's line of argument."
  - id: pt-PT-B2-TEXT-003-002
    term: 'analisar a estrutura do texto'
    translation: 'to analyse the text structure'
    partOfSpeech: phrase
    gender: n/a
    example: 'Vou analisar a estrutura do texto para compreender melhor.'
    exampleTranslation: 'I will analyse the text structure to understand better.'
  - id: pt-PT-B2-TEXT-003-003
    term: 'identificar premissas e conclusões'
    translation: 'to identify premises and conclusions'
    partOfSpeech: phrase
    gender: n/a
    example: 'É importante identificar premissas e conclusões no argumento.'
    exampleTranslation: 'It is important to identify premises and conclusions in the argument.'
  - id: pt-PT-B2-TEXT-003-004
    term: 'avaliar a força do argumento'
    translation: 'to evaluate the strength of the argument'
    partOfSpeech: phrase
    gender: n/a
    example: 'Preciso de avaliar a força do argumento apresentado.'
    exampleTranslation: 'I need to evaluate the strength of the presented argument.'
  - id: pt-PT-B2-TEXT-003-005
    term: 'reconhecer pressupostos'
    translation: 'to recognise assumptions'
    partOfSpeech: phrase
    gender: n/a
    example: 'Vou reconhecer os pressupostos do autor.'
    exampleTranslation: "I will recognise the author's assumptions."
  - id: pt-PT-B2-TEXT-003-006
    term: 'extrair ilações'
    translation: 'to draw conclusions'
    partOfSpeech: phrase
    gender: n/a
    example: 'Posso extrair ilações a partir do texto.'
    exampleTranslation: 'I can draw conclusions from the text.'
grammar:
  - id: B2-GRAMMAR-011
    point: 'Complex conditional sentences in analysis'
    explanation: 'Using advanced conditional structures for textual analysis'
    examples:
      - 'Se o autor tivesse apresentado dados, o argumento seria mais forte.'
      - 'Caso a premissa seja verdadeira, a conclusão é válida.'
    cefrNotes: 'B2 learners use complex conditionals for textual analysis'
culturalNotes: "Portuguese academic analysis values identifying logical structure. Using 'a premissa é que' or 'a conclusão lógica é' signals analytical thinking."
