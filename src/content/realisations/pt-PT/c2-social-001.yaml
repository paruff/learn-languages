grammar:
  - id: C2-GRAMMAR-018
    point: 'Advanced hypothetical constructions for social interaction'
    explanation: "Use hypothetical clauses for social interaction: 'Se me fosse pedido, explicaria o assunto com total clareza' (If I were asked, I would explain the subject with total clarity)."
    examples:
      - 'Podes falar comigo sobre qualquer assunto, que eu compreendo.'
      - 'Não importa o tema, consigo comunicar com eficácia.'
    cefrNotes: 'C2 speakers use hypothetical constructions to demonstrate near-native social interaction'
culturalNotes: 'At C2 level, Portuguese speakers can interact with native speakers with a degree of fluency, spontaneity, confidence and precision that enables effective communication in all social contexts.'
