    exampleTranslation: 'The ranking of the risks guides the investment priority.'
grammar:
  - id: C1-GRAMMAR-021
    point: 'Connectors and impersonal structures for professional documents'
    explanation: "Organising formal prose with layered connectors and impersonal structures such as 'regista-se que', 'importa referir que' in recommendation sections"
    examples:
      - 'Regista-se que os resultados superaram as expectativas.'
      - 'Importa referir que os prazos foram cumpridos sem exceção.'
    cefrNotes: 'C1 writers build dense, impersonal professional prose whose reasoning is transparent'
culturalNotes: "Portuguese professional writing follows a fixed architecture: introduction, situation, objectives, measures, conclusion. The impersonal 'se' carries responsibility away from the author, and recommendations are stated as facts rather than opinions."
