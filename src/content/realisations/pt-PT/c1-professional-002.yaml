vocabulary:
  - id: pt-PT-C1-PROFESSIONAL-002-001
    term: 'relatório circunstanciado'
    translation: 'detailed report'
    partOfSpeech: noun
    gender: masculine
    example: 'O relatório circunstanciado acompanha todos os números do trimestre.'
    exampleTranslation: 'The detailed report covers all the figures of the quarter.'
  - id: pt-PT-C1-PROFESSIONAL-002-002
    term: 'plano de contingência'
    translation: 'contingency plan'
    partOfSpeech: noun
    gender: masculine
    example: 'O plano de contingência prevê respostas para cenários adversos.'
    exampleTranslation: 'The contingency plan provides responses for adverse scenarios.'
  - id: pt-PT-C1-PROFESSIONAL-002-003
    term: 'ponto culminante da análise'
    translation: 'culminating point of the analysis'
    partOfSpeech: noun
    gender: masculine
    example: 'O ponto culminante da análise é a comparação entre os dois mercados.'
    exampleTranslation: 'The culminating point of the analysis is the comparison between the two markets.'
  - id: pt-PT-C1-PROFESSIONAL-002-004
