grammar:
  - id: B1-DISCOURSE-005-GR01
    point: 'Writing short reports'
    explanation: 'Short reports at B1 use Präteritum for narration, clear topic sentences, and logical connectors (deshalb, außerdem). Structure: introduction → events → conclusion/reflection.'
    examples:
      - 'Während meines Praktikums lernte ich viel.'
      - 'Deshalb kann ich das Unternehmen empfehlen.'
culturalNotes: 'German report writing ("Berichterstattung") emphasizes objectivity and factual language; personal opinions are typically separated from the factual account.'
