grammar:
  - id: C1-WRITTEN-003-GR01
    point: 'Writing with correct spelling and punctuation'
    explanation: 'At C1, demonstrate accurate spelling and punctuation: use of commas in complex sentences (Nebensätze), correct use of umlauts (ä, ö, ü, ß), proper capitalization of nouns, and accurate verb placement in subordinate clauses.'
    examples:
      - 'Obwohl es regnete, ging ich spazieren. (comma before obwohl-clause)'
      - 'Ich weiß, dass er kommt. (comma before dass-clause)'
culturalNotes: 'German spelling rules ("Rechtschreibreform") were reformed in 1996; C1 writers should be familiar with current conventions, especially comma rules in complex sentences.'
