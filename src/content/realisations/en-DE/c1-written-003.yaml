    example: 'Meine Rechtschreibung ist gut.'
    exampleTranslation: 'My spelling is good.'
  - id: en-DE-C1-WRITTEN-003-002
    term: 'punctuation'
    translation: 'Zeichensetzung'
    partOfSpeech: noun
