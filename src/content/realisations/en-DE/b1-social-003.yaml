vocabulary:
  - id: en-DE-B1-SOCIAL-003-001
    term: 'feeling'
    translation: 'Gefühl'
    partOfSpeech: noun
    gender: n/a
    example: 'Wie fühlst du dich?'
    exampleTranslation: 'How are you feeling?'
  - id: en-DE-B1-SOCIAL-003-002
    term: 'to be glad / to be happy'
    translation: 'freuen'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich freue mich darauf.'
    exampleTranslation: 'I am looking forward to it.'
  - id: en-DE-B1-SOCIAL-003-003
    term: 'sad'
    translation: 'traurig'
    partOfSpeech: adjective
    gender: n/a
    example: 'Ich bin etwas traurig.'
    exampleTranslation: 'I am a little sad.'
  - id: en-DE-B1-SOCIAL-003-004
    term: 'excited / nervous'
    translation: 'aufgeregt'
    partOfSpeech: adjective
    gender: n/a
    example: 'Ich bin sehr aufgeregt.'
    exampleTranslation: 'I am very excited.'
  - id: en-DE-B1-SOCIAL-003-005
    term: 'disappointed'
    translation: 'enttäuscht'
    partOfSpeech: adjective
    gender: n/a
    example: 'Ich bin etwas enttäuscht.'
    exampleTranslation: 'I am a little disappointed.'
  - id: en-DE-B1-SOCIAL-003-006
