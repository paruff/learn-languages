grammar:
  - id: B1-SOCIAL-003-GR01
    point: 'Expressing and responding to feelings'
    explanation: 'At B1, express emotions with: Ich fühle mich + adjective, Ich bin + adjective, Ich freue mich auf (+ Akkusativ for future). Respond with: Das freut mich! / Das tut mir leid. / Das verstehe ich.'
    examples:
      - 'Ich freue mich auf das Wochenende.'
      - 'Das tut mir leid. Ich hoffe, es geht dir besser.'
culturalNotes: 'Germans express feelings more reservedly than many cultures; "Mir geht es gut" (I am fine) is the standard response, even when things are not perfect.'
