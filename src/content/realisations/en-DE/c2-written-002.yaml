grammar:
  - id: C2-WRITTEN-002-GR01
    point: 'Writing essays with original thought and sophisticated argumentation'
    explanation: 'At C2, write essays by: presenting original arguments with sophistication, using complex rhetorical structures, synthesizing diverse sources with critical evaluation, and drawing nuanced conclusions that demonstrate intellectual depth.'
    examples:
      - 'Meine These ist, dass die Bildung zwar wichtig ist, wobei jedoch die Methode der Vermittlung weitaus entscheidender ist als bislang angenommen.'
      - 'Abschließend lässt sich sagen, dass die Argumentation nicht nur überzeugend, sondern auch innovativ ist.'
culturalNotes: 'German essay writing at C2 level ("Essayistik") values original thought, sophisticated argumentation, and stylistic elegance.'
