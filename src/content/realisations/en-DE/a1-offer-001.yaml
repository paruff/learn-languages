nodeId: A1-OFFER-001
lang: en-DE
vocabulary:
  - id: en-DE-A1-OFFER-001-001
    term: 'Would you like...?'
    translation: 'Möchten Sie...?'
    partOfSpeech: phrase
    example: 'Would you like a coffee?'
    exampleTranslation: 'Möchten Sie einen Kaffee?'
  - id: en-DE-A1-OFFER-001-002
    term: 'Shall we...?'
    translation: 'Sollen wir...?'
    partOfSpeech: phrase
    example: 'Shall we go to the cinema?'
    exampleTranslation: 'Sollen wir ins Kino gehen?'
  - id: en-DE-A1-OFFER-001-003
    term: 'Do you want...?'
    translation: 'Willst du...?'
    partOfSpeech: phrase
    example: 'Do you want to come along?'
    exampleTranslation: 'Willst du mitkommen?'
  - id: en-DE-A1-OFFER-001-004
    term: 'invitation'
    translation: 'Einladung'
    partOfSpeech: noun
    gender: feminine
    example: 'Thank you very much for the invitation.'
    exampleTranslation: 'Vielen Dank für die Einladung.'
  - id: en-DE-A1-OFFER-001-005
    term: 'to offer'
    translation: 'anbieten'
    partOfSpeech: verb
    example: 'Can I offer you something?'
    exampleTranslation: 'Kann ich Ihnen etwas anbieten?'
  - id: en-DE-A1-OFFER-001-006
    term: 'gladly'
    translation: 'gerne'
    partOfSpeech: adverb
    example: 'Yes, with pleasure!'
    exampleTranslation: 'Ja, gerne!'
grammar: []
culturalNotes: '"Möchten Sie" is the polite form; "Willst du" is informal. Germans distinguish clearly between "Sie" (formal you) and "du" (informal you).'
