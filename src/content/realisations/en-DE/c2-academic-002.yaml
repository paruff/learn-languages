    exampleTranslation: 'The context between the facts was clear.'
  - id: en-DE-C2-ACADEMIC-002-005
    term: 'primary source'
    translation: 'Primärquelle'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Primärquelle war eine alte Handschrift.'
    exampleTranslation: 'The primary source was an old manuscript.'
  - id: en-DE-C2-ACADEMIC-002-006
