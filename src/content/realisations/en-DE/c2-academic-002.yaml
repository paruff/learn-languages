vocabulary:
  - id: en-DE-C2-ACADEMIC-002-001
    term: 'discourse'
    translation: 'Diskurs'
    partOfSpeech: noun
    gender: masculine
    example: 'Der wissenschaftliche Diskurs ist komplex.'
    exampleTranslation: 'The academic discourse is complex.'
  - id: en-DE-C2-ACADEMIC-002-002
    term: 'thesis'
    translation: 'These'
    partOfSpeech: noun
    gender: feminine
    example: 'Die These ist gut begründet.'
    exampleTranslation: 'The thesis is well-founded.'
  - id: en-DE-C2-ACADEMIC-002-003
    term: 'argumentation'
    translation: 'Argumentation'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Argumentation war systematisch und überzeugend.'
    exampleTranslation: 'The argumentation was systematic and convincing.'
  - id: en-DE-C2-ACADEMIC-002-004
    term: 'context / coherence'
    translation: 'Zusammenhang'
    partOfSpeech: noun
    gender: masculine
