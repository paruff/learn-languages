grammar:
  - id: C2-PROFESSIONAL-001-GR01
    point: 'Making formal presentations with rhetorical mastery'
    explanation: 'At C2, make formal presentations by: structuring content with sophisticated logic, using specialist terminology with precision, engaging the audience with rhetorical devices, and handling questions with diplomacy and expertise.'
    examples:
      - 'Im Folgenden werde ich die Ergebnisse der Studie vorstellen, wobei ich besonderen Wert auf die methodischen Aspekte legen werde.'
      - 'Wie Sie in Abbildung 1 sehen können, zeigt der Trend eine deutliche Zunahme, wobei die kausalen Zusammenhänge noch weiterer Forschung bedürfen.'
culturalNotes: 'German professional presentations at C2 level expect "Fachkompetenz" (specialist competence), "Struktur" (clear structure), and "Rhetorik" (rhetorical skill).'
