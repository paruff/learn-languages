grammar:
  - id: B1-OPINION-004-GR01
    point: 'Writing opinions about current events'
    explanation: 'Written opinions at B1 use: clear topic sentence, supporting evidence/examples, logical connectors (deshalb, außerdem), and a conclusion. "Meiner Meinung nach" is appropriate for formal writing.'
    examples:
      - 'Meiner Meinung nach ist dieses Thema sehr wichtig, weil...'
      - 'Ich finde, dass die Regierung mehr tun sollte.'
culturalNotes: 'German newspaper opinion pieces ("Kommentar") follow a structured format: factual introduction, balanced analysis, clear conclusion — reflecting the cultural value of "Sachlichkeit".'
