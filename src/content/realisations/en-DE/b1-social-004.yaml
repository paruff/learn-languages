grammar:
  - id: B1-SOCIAL-004-GR01
    point: 'Keeping conversations going'
    explanation: 'Sustain conversation by: inviting opinions (Was meinst du?), reacting to statements (Das finde ich gut/interessant), asking follow-up questions, and sharing your own experience. Use "Und du?" to redirect.'
    examples:
      - 'Was meinst du dazu? Ich finde das sehr gut.'
      - 'Und wie sieht es bei dir aus?'
culturalNotes: 'Germans value "aktives Zuhören" (active listening); showing genuine interest through follow-up questions is essential for maintaining conversation.'
