vocabulary:
  - id: en-DE-B2-SOCIAL-003-001
    term: 'to justify'
    translation: 'begründen'
    partOfSpeech: verb
    gender: n/a
    example: 'Können Sie Ihre Meinung begründen?'
    exampleTranslation: 'Can you justify your opinion?'
  - id: en-DE-B2-SOCIAL-003-002
    term: 'to maintain / to sustain'
    translation: 'aufrechterhalten'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich halte meine Meinung aufrecht.'
    exampleTranslation: 'I maintain my opinion.'
  - id: en-DE-B2-SOCIAL-003-003
    term: 'explanation'
    translation: 'Erklärung'
    partOfSpeech: noun
    gender: n/a
    example: 'Die Erklärung war überzeugend.'
    exampleTranslation: 'The explanation was convincing.'
  - id: en-DE-B2-SOCIAL-003-004
    term: 'argument'
    translation: 'Argument'
    partOfSpeech: noun
    gender: n/a
    example: 'Das ist ein starkes Argument.'
    exampleTranslation: 'That is a strong argument.'
  - id: en-DE-B2-SOCIAL-003-005
    term: 'to convince'
    translation: 'überzeugen'
    partOfSpeech: verb
    gender: n/a
    example: 'Das überzeugt mich nicht.'
    exampleTranslation: 'That does not convince me.'
  - id: en-DE-B2-SOCIAL-003-006
    term: 'to communicate / to come to an understanding'
    translation: 'sich verständigen'
    partOfSpeech: phrase
    gender: n/a
    example: 'Wir haben uns gut verständigt.'
    exampleTranslation: 'We communicated well.'
grammar:
  - id: B2-SOCIAL-003-GR01
    point: 'Accounting for and sustaining views'
    explanation: 'At B2, sustain views by: providing explanations (Die Erklärung dafür ist...), defending positions (Ich halte meine Meinung aufrecht, weil...), and using persuasive language (Das überzeugt mich, weil...).'
    examples:
      - 'Ich halte meine Meinung aufrecht, weil die Fakten dafür sprechen.'
      - 'Die Erklärung dafür ist, dass die Wirtschaft stagniert.'
culturalNotes: 'Germans value "Standhaftigkeit" (steadfastness) in argumentation; changing one''s position without good reason is seen as weakness.'
