nodeId: A1-CLARIFY-001
lang: en-DE
vocabulary:
  - id: en-DE-A1-CLARIFY-001-001
    term: 'Can you repeat that, please?'
    translation: 'Können Sie das bitte wiederholen?'
    partOfSpeech: phrase
    example: 'Sorry, can you repeat that, please?'
    exampleTranslation: 'Entschuldigung, können Sie das bitte wiederholen?'
  - id: en-DE-A1-CLARIFY-001-002
    term: 'How do you say...?'
    translation: 'Wie sagt man...?'
    partOfSpeech: phrase
    example: 'How do you say "library" in German?'
    exampleTranslation: 'Wie sagt man "Bibliothek" auf Deutsch?'
  - id: en-DE-A1-CLARIFY-001-003
    term: "I don't understand"
    translation: 'Ich verstehe nicht'
    partOfSpeech: phrase
    example: "Sorry, I don't understand."
    exampleTranslation: 'Entschuldigung, ich verstehe nicht.'
  - id: en-DE-A1-CLARIFY-001-004
    term: 'Please speak more slowly'
    translation: 'Sprechen Sie bitte langsamer'
    partOfSpeech: phrase
    example: 'Can you speak more slowly, please?'
    exampleTranslation: 'Können Sie bitte langsamer sprechen?'
  - id: en-DE-A1-CLARIFY-001-005
    term: 'What does... mean?'
    translation: 'Was bedeutet...?'
    partOfSpeech: phrase
    example: 'What does "Fahrrad" mean?'
    exampleTranslation: 'Was bedeutet "Fahrrad"?'
  - id: en-DE-A1-CLARIFY-001-006
    term: 'Can you spell that?'
    translation: 'Können Sie das buchstabieren?'
    partOfSpeech: phrase
    example: 'Can you spell your name, please?'
    exampleTranslation: 'Können Sie Ihren Namen bitte buchstabieren?'
grammar: []
culturalNotes: 'Germans generally appreciate it when learners ask for clarification rather than pretending to understand; it shows respect for the language.'
