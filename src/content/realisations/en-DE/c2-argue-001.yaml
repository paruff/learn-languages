grammar:
  - id: C2-ARGUE-001-GR01
    point: 'Constructing sophisticated arguments with rhetorical mastery'
    explanation: 'At C2, construct arguments by: layering evidence with sophistication (Nicht nur..., sondern auch...), using concessive structures (Zwar gibt es..., dennoch...), deploying rhetorical questions, and using ironic or satirical elements to enhance persuasion.'
    examples:
      - 'Zwar gibt es Gegenargumente, dennoch überwiegen die Fakten bei weitem.'
      - 'Ist es nicht vielmehr so, dass die antagonistische Position ignoriert, was die Forschung eindeutig zeigt?'
culturalNotes: 'German academic argumentation at C2 level expects "Rhetorik" (rhetoric) combined with "Sachlichkeit" (objectivity); sophisticated rhetorical devices are appreciated.'
