nodeId: B1-SOCIAL-001
lang: en-DE
vocabulary:
  - id: en-DE-B1-SOCIAL-001-001
    term: 'trip / journey'
    translation: 'Reise'
    partOfSpeech: noun
    gender: n/a
    example: 'Ich plane eine Reise nach Deutschland.'
    exampleTranslation: 'I am planning a trip to Germany.'
  - id: en-DE-B1-SOCIAL-001-002
    term: 'to order'
    translation: 'bestellen'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich möchte bitte einen Kaffee bestellen.'
    exampleTranslation: 'I would like to order a coffee, please.'
  - id: en-DE-B1-SOCIAL-001-003
    term: 'complaint'
    translation: 'Beschwerde'
    partOfSpeech: noun
    gender: n/a
    example: 'Ich möchte eine Beschwerde einreichen.'
    exampleTranslation: 'I would like to file a complaint.'
  - id: en-DE-B1-SOCIAL-001-004
    term: 'to book'
    translation: 'buchen'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich möchte ein Zimmer buchen.'
    exampleTranslation: 'I would like to book a room.'
  - id: en-DE-B1-SOCIAL-001-005
    term: 'excuse me / apology'
    translation: 'Entschuldigung'
    partOfSpeech: noun
    gender: n/a
    example: 'Entschuldigung, können Sie mir helfen?'
    exampleTranslation: 'Excuse me, can you help me?'
  - id: en-DE-B1-SOCIAL-001-006
    term: 'help'
    translation: 'Hilfe'
    partOfSpeech: noun
    gender: n/a
    example: 'Ich brauche Hilfe.'
    exampleTranslation: 'I need help.'
grammar:
  - id: B1-SOCIAL-001-GR01
    point: 'Handling social situations while travelling'
    explanation: 'At B1, handle: ordering (Ich möchte... bestellen), asking for help (Können Sie mir helfen?), filing complaints (Ich möchte mich beschweren), and navigating transport (Wo ist der Bahnhof?). Use Konjunktiv II for politeness.'
    examples:
      - 'Könnten Sie mir bitte helfen?'
      - 'Ich möchte einen Tisch für zwei Personen reservieren.'
culturalNotes: 'Germans appreciate politeness formulas ("Entschuldigung", "Könnten Sie..."); the formal "Sie" is expected in all travel interactions with strangers.'
