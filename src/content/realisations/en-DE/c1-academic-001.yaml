nodeId: C1-ACADEMIC-001
lang: en-DE
vocabulary:
  - id: en-DE-C1-ACADEMIC-001-001
    term: 'dissertation'
    translation: 'Dissertation'
    partOfSpeech: noun
    gender: feminine
    example: 'Sie schreibt ihre Dissertation über quantitative Analyse.'
    exampleTranslation: 'She is writing her dissertation on quantitative analysis.'
  - id: en-DE-C1-ACADEMIC-001-002
    term: 'report'
    translation: 'Bericht'
    partOfSpeech: noun
    gender: masculine
    example: 'Der Bericht präsentiert die Ergebnisse der Studie.'
    exampleTranslation: 'The report presents the results of the study.'
  - id: en-DE-C1-ACADEMIC-001-003
    term: 'synthesis'
    translation: 'Synthese'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Synthese der Quellen war überzeugend.'
    exampleTranslation: 'The synthesis of the sources was convincing.'
  - id: en-DE-C1-ACADEMIC-001-004
    term: 'conclusion'
    translation: 'Schlussfolgerung'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Schlussfolgerung war logisch und gut begründet.'
    exampleTranslation: 'The conclusion was logical and well-founded.'
  - id: en-DE-C1-ACADEMIC-001-005
    term: 'sources'
    translation: 'Quellen'
    partOfSpeech: noun
    gender: n/a
    example: 'Er hat seine Quellen sorgfältig ausgewählt.'
    exampleTranslation: 'He has carefully selected his sources.'
  - id: en-DE-C1-ACADEMIC-001-006
    term: 'to justify / to substantiate'
    translation: 'begründen'
    partOfSpeech: verb
    gender: n/a
    example: 'Sie kann ihre Schlussfolgerungen gut begründen.'
    exampleTranslation: 'She can well justify her conclusions.'
grammar:
  - id: C1-ACADEMIC-001-GR01
    point: 'Presenting reasoned conclusions in academic writing'
    explanation: 'At C1, present conclusions by: using complex connectors (Aus der vorliegenden Analyse ergibt sich, dass...), referencing sources (Laut [Author]...), and expressing nuanced positions (Obwohl die Daten... sprechen, lässt sich festhalten, dass...).'
    examples:
      - 'Aus der vorliegenden Analyse ergibt sich, dass die Hypothese bestätigt wird.'
      - 'Obwohl die Daten für eine Tendenz sprechen, lässt sich kein kausaler Zusammenhang nachweisen.'
culturalNotes: 'German academic writing ("wissenschaftliches Arbeiten") follows strict conventions: "Masterplan" structure, clear thesis, systematic argumentation, and explicit engagement with sources ("Quellenarbeit").'
