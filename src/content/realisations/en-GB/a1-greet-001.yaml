    term: 'Hello'
    translation: 'Hallo'
    partOfSpeech: 'interjection'
    example: 'Hello, how are you?'
    exampleTranslation: 'Hallo, wie geht es dir?'
  - id: 'en-GB-A1-GREET-001-002'
    term: 'Good morning'
    translation: 'Guten Morgen'
    partOfSpeech: 'phrase'
    example: 'Good morning, Mr. Schmidt.'
    exampleTranslation: 'Guten Morgen, Herr Schmidt.'
  - id: 'en-GB-A1-GREET-001-003'
    term: 'Good evening'
    translation: 'Guten Abend'
    partOfSpeech: 'phrase'
    example: 'Good evening, ladies and gentlemen.'
    exampleTranslation: 'Guten Abend, meine Damen und Herren.'
  - id: 'en-GB-A1-GREET-001-004'
    term: 'How are you?'
    translation: 'Wie geht es Ihnen?'
    partOfSpeech: 'phrase'
