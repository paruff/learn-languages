nodeId: 'A1-INTRO-001'
lang: 'en-GB'
vocabulary:
  - id: 'en-GB-A1-INTRO-001-001'
    concept: 'my-name-is'
    term: 'My name is'
    translation: 'Ich heiße'
    partOfSpeech: 'phrase'
    example: 'My name is Thomas.'
    exampleTranslation: 'Ich heiße Thomas.'
  - id: 'en-GB-A1-INTRO-001-002'
    concept: 'nice-to-meet-you'
    term: 'Nice to meet you'
    translation: 'Freut mich'
    partOfSpeech: 'phrase'
    example: "I'm Anna. Nice to meet you."
    exampleTranslation: 'Ich bin Anna. Freut mich.'
  - id: 'en-GB-A1-INTRO-001-003'
    concept: 'i-am-from'
    term: 'I am from'
    translation: 'Ich komme aus'
    partOfSpeech: 'phrase'
    example: 'I am from England.'
    exampleTranslation: 'Ich komme aus England.'
  - id: 'en-GB-A1-INTRO-001-004'
    concept: 'i-live-in'
    term: 'I live in'
    translation: 'Ich wohne in'
    partOfSpeech: 'phrase'
    example: 'I live in Berlin.'
    exampleTranslation: 'Ich wohne in Berlin.'
  - id: 'en-GB-A1-INTRO-001-005'
    concept: 'i-am-years-old'
    term: 'I am ... years old'
    translation: 'Ich bin ... Jahre alt'
    partOfSpeech: 'phrase'
    example: 'I am 25 years old.'
    exampleTranslation: 'Ich bin fünfundzwanzig Jahre alt.'
  - id: 'en-GB-A1-INTRO-001-006'
    concept: 'i-speak'
    term: 'I speak'
    translation: 'Ich spreche'
    partOfSpeech: 'phrase'
    example: 'I speak English and a little German.'
    exampleTranslation: 'Ich spreche Englisch und ein bisschen Deutsch.'
grammar: []
culturalNotes: 'Germans typically introduce themselves with "Ich heiße" (My name
  is) or "Ich bin" (I am); first names are used once the "du" form is agreed upon.'
