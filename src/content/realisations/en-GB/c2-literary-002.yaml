nodeId: C2-LITERARY-002
lang: en-GB
vocabulary:
  - id: en-GB-C2-LITERARY-002-001
    term: 'elegant style'
    translation: 'estilo elegante'
    partOfSpeech: phrase
    gender: masculine
    example: 'I write with an elegant and precise style.'
    exampleTranslation: 'Escrevo com um estilo elegante e preciso.'
  - id: en-GB-C2-LITERARY-002-002
    term: 'intended effect'
    translation: 'efeito pretendido'
    partOfSpeech: phrase
    gender: masculine
    example: 'I always achieve the intended effect on the reader.'
    exampleTranslation: 'Consigno sempre o efeito pretendido no leitor.'
  - id: en-GB-C2-LITERARY-002-003
    term: 'appropriate register'
    translation: 'registo adequado'
    partOfSpeech: phrase
    gender: masculine
    example: 'I always select the appropriate register for the text.'
    exampleTranslation: 'Selecione sempre o registo adequado ao texto.'
  - id: en-GB-C2-LITERARY-002-004
    term: 'adapted style'
    translation: 'estilo adaptado'
    partOfSpeech: phrase
    gender: masculine
    example: 'I adapt the style to the literary genre and audience.'
    exampleTranslation: 'Adapto o estilo ao género literário e ao público.'
  - id: en-GB-C2-LITERARY-002-005
    term: 'precision and subtlety'
    translation: 'precisão e subtileza'
    partOfSpeech: phrase
    gender: feminine
    example: 'My writing has incomparable precision and subtlety.'
    exampleTranslation: 'A minha escrita tem precisão e subtileza incomparáveis.'
  - id: en-GB-C2-LITERARY-002-006
    term: 'cultured expression'
    translation: 'expressão culta'
    partOfSpeech: phrase
    gender: feminine
    example: 'I use a cultured and well-founded expression.'
    exampleTranslation: 'Utilizo uma expressão culta e bem fundamentada.'
grammar:
  - id: C2-GRAMMAR-013
    point: 'Advanced purpose clauses for stylistic precision'
    explanation: "Use purpose clauses for stylistic precision: 'I write in such a way that the reader feels the intended emotion' (Escrevo de forma a que o leitor sinta a emoção pretendida)."
    examples:
      - 'I develop the text so that it achieves the desired stylistic effect.'
      - 'I choose the words so that the message is penetrating.'
    cefrNotes: 'C2 writers use purpose clauses to achieve stylistic precision'
culturalNotes: 'At C2 level, English writers can write with precision and subtlety, conveying intended effects on the reader using appropriate register and adapting style to text and audience.'
