grammar:
  - id: C2-GRAMMAR-017
    point: 'Advanced participial clauses for reading comprehension at C2 level'
    explanation: "Use participial clauses for advanced reading comprehension: 'Having read the text in full, I understand all its layers of meaning' (Tendo lido o texto na íntegra, compreendo todas as suas camadas de significado)."
    examples:
      - 'Having analysed the work, I recognise all the cultural allusions.'
      - 'After examining the text, I interpret its implicit meaning.'
    cefrNotes: 'C2 readers use participial clauses to demonstrate sophisticated comprehension of complex texts'
culturalNotes: 'At C2 level, English readers can understand all forms of written language, including abstract, technically and linguistically complex texts, grasping the finer points of style and implicit meaning.'
