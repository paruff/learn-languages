grammar:
  - id: C1-GRAMMAR-003
    point: 'Cleft sentences in English'
    explanation: "Using structures like 'It was X that...' to highlight and focus the element the speaker considers most significant"
    examples:
      - 'It was the lack of investment that held the project back.'
      - 'It is precisely this point that I want to develop further.'
    cefrNotes: 'C1 learners use cleft sentences to manage emphasis deliberately in extended discourse'
culturalNotes: 'British English cleft constructions carry strong contrastive focus, so they are reserved for genuine disagreement or emphasis. Over-use can sound argumentative; neutral information is normally carried by intonation instead.'
