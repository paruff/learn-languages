nodeId: 'A1-GREET-002'
lang: 'en-GB'
vocabulary:
  - id: 'en-GB-A1-GREET-002-001'
    term: 'Goodbye'
    translation: 'Auf Wiedersehen'
    partOfSpeech: 'interjection'
    example: 'Goodbye, see you tomorrow.'
    exampleTranslation: 'Auf Wiedersehen, bis morgen.'
  - id: 'en-GB-A1-GREET-002-002'
    term: 'Bye'
    translation: 'Tschüss'
    partOfSpeech: 'interjection'
    example: 'Bye, take care!'
    exampleTranslation: 'Tschüss, pass auf dich auf!'
  - id: 'en-GB-A1-GREET-002-003'
    term: 'See you later'
    translation: 'Bis später'
    partOfSpeech: 'phrase'
    example: 'See you later at the office.'
    exampleTranslation: 'Bis später im Büro.'
  - id: 'en-GB-A1-GREET-002-004'
    term: 'See you tomorrow'
    translation: 'Bis morgen'
    partOfSpeech: 'phrase'
    example: 'Have a good evening! See you tomorrow.'
    exampleTranslation: 'Einen schönen Abend! Bis morgen.'
  - id: 'en-GB-A1-GREET-002-005'
    term: 'Good night'
    translation: 'Gute Nacht'
    partOfSpeech: 'phrase'
    example: 'Good night, sleep well.'
    exampleTranslation: 'Gute Nacht, schlaf gut.'
  - id: 'en-GB-A1-GREET-002-006'
    term: 'Take care'
    translation: 'Pass auf dich auf'
    partOfSpeech: 'phrase'
    example: 'It was nice meeting you. Take care!'
    exampleTranslation: 'Es war schön, dich kennenzulernen. Pass auf dich auf!'
grammar: []
culturalNotes: '"Auf Wiedersehen" is formal; "Tschüss" is informal. Germans switch
  naturally between them depending on the relationship.'
