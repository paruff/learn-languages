nodeId: C1-TEXT-004
lang: en-GB
vocabulary:
  - id: en-GB-C1-TEXT-004-001
    term: 'line of argumentation'
    translation: 'linha de argumentação'
    partOfSpeech: noun
    gender: feminine
    example: 'The line of argumentation of the text rests on recent data.'
    exampleTranslation: 'A linha de argumentação do texto apoia-se em dados recentes.'
  - id: en-GB-C1-TEXT-004-002
    term: 'theses and antitheses'
    translation: 'teses e antíteses'
    partOfSpeech: noun
    gender: feminine
    example: 'The author confronts theses and antitheses before concluding.'
    exampleTranslation: 'O autor confronta teses e antíteses antes de concluir.'
  - id: en-GB-C1-TEXT-004-003
    term: 'circumstantial evidence'
    translation: 'evidência circunstancial'
    partOfSpeech: noun
    gender: feminine
    example: 'The circumstantial evidence suggests, but does not prove, the thesis.'
    exampleTranslation: 'A evidência circunstancial sugere, mas não prova, a tese.'
  - id: en-GB-C1-TEXT-004-004
    term: 'turning point'
    translation: 'momento de viragem'
    partOfSpeech: noun
    gender: masculine
    example: 'The turning point of the text is the refutation of the central objection.'
    exampleTranslation: 'O momento de viragem do texto é a refutação da objeção central.'
  - id: en-GB-C1-TEXT-004-005
    term: 'convergence of factors'
    translation: 'convergência de fatores'
    partOfSpeech: noun
    gender: feminine
    example: 'The author shows the convergence of factors that explains the phenomenon.'
    exampleTranslation: 'O autor mostra a convergência de fatores que explica o fenómeno.'
  - id: en-GB-C1-TEXT-004-006
    term: 'to follow the reasoning'
    translation: 'travar o raciocínio'
    partOfSpeech: phrase
    gender: n/a
    example: "The attentive reader follows the author's reasoning paragraph by paragraph."
    exampleTranslation: 'O leitor atento trava o raciocínio do autor parágrafo a parágrafo.'
grammar:
  - id: C1-GRAMMAR-010
    point: 'Advanced connectors for text architecture'
    explanation: "Using connectors such as 'by contrast', 'granted that' and 'on the strength of' to signal concession, contrast, hypothesis and evidential weight across paragraphs"
    examples:
      - 'By contrast, production costs continue to rise.'
      - 'Granted that the evidence is limited, the hypothesis remains plausible.'
    cefrNotes: 'C1 readers use connective systems to reconstruct the logical skeleton of demanding texts'
culturalNotes: 'British academic prose mixes explicit connectives with cohesive devices such as substitution and ellipsis; the logical relations are often signalled at the start of the paragraph in the theme position.'
