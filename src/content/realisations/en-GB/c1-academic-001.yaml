grammar:
  - id: C1-GRAMMAR-017
    point: 'Impersonal constructions and fronting in academic prose'
    explanation: "Foregrounding the argument with impersonal and passive constructions such as 'it should be stressed' and 'it is found that' and fronting for emphasis"
    examples:
      - 'It should be stressed that the results confirm the initial hypothesis.'
      - 'Not only is the hypothesis confirmed, but a new line of study opens up.'
    cefrNotes: "C1 academic writers use impersonal constructions to distance the argument from the author's person"
culturalNotes: 'British academic writing strictly separates authorial voice from evidence, using impersonal constructions and careful self-reference; overuse of the first person is discouraged in traditional disciplines. Hedging is institutionalised in epistemics.'
