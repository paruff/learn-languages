    exampleTranslation: 'A dissertação académica articula teoria e dados empíricos.'
  - id: en-GB-C1-ACADEMIC-001-002
    term: 'body of sources'
    translation: 'bateria de fontes'
    partOfSpeech: noun
    gender: feminine
    example: 'The body of sources consulted is broad and credible.'
    exampleTranslation: 'A bateria de fontes consultadas é vasta e credível.'
  - id: en-GB-C1-ACADEMIC-001-003
    term: 'theoretical framework'
    translation: 'quadro teórico'
