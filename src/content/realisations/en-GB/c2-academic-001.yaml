grammar:
  - id: C2-GRAMMAR-014
    point: 'Advanced impersonal constructions for academic prose'
    explanation: "Use advanced impersonal constructions for academic prose: 'It is demonstrated that the results are consistent with the hypothesis' (Demonstra-se que os resultados são consistentes com a hipótese)."
    examples:
      - 'It should be stressed that the analysis reveals significant patterns.'
      - 'It cannot be ignored that the evidence is robust.'
    cefrNotes: 'C2 academic writers use advanced impersonal constructions for sophisticated argumentation'
culturalNotes: 'At C2 level, English academic writers can express themselves clearly and fluently on complex subjects, presenting well-structured, coherent and convincing texts with effective use of a wide range of language.'
