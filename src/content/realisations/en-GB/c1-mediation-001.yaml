grammar:
  - id: C1-GRAMMAR-023
    point: 'Reformulation connectors for mediation'
    explanation: "Using reformulation and simplification connectors such as 'in other words', 'put another way' and 'in plain terms' to make technical content accessible"
    examples:
      - 'In other words, the system works like a network of channels.'
      - 'Put another way, less investment calls for more efficiency.'
    cefrNotes: 'C1 speakers control the whole reformulation toolbox to mediate across registers'
culturalNotes: 'Plain English is a cultural and legislative ideal in the UK: public documents are legally required to be intelligible. Skilled speakers mark the shift with explicit connectives, letting the audience place the simplified statement.'
