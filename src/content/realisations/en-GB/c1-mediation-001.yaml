    exampleTranslation: 'O professor soube traduzir para leigos o debate técnico.'
  - id: en-GB-C1-MEDIATION-001-002
    term: 'to simplify without losing rigour'
    translation: 'simplificar sem perder rigor'
    partOfSpeech: phrase
