nodeId: 'A1-TIME-001'
lang: 'en-GB'
vocabulary:
  - id: 'en-GB-A1-TIME-001-001'
    concept: 'what-time-is-it'
    term: 'What time is it?'
    translation: 'Wie spät ist es?'
    partOfSpeech: 'phrase'
    example: 'Excuse me, what time is it?'
    exampleTranslation: 'Entschuldigung, wie spät ist es?'
  - id: 'en-GB-A1-TIME-001-002'
    concept: 'today'
    term: 'today'
    translation: 'heute'
    partOfSpeech: 'adverb'
    example: 'Today is Monday.'
    exampleTranslation: 'Heute ist Montag.'
  - id: 'en-GB-A1-TIME-001-003'
    concept: 'tomorrow'
    term: 'tomorrow'
    translation: 'morgen'
    partOfSpeech: 'adverb'
    example: 'Tomorrow I will come again.'
    exampleTranslation: 'Morgen komme ich wieder.'
  - id: 'en-GB-A1-TIME-001-004'
    concept: 'yesterday'
    term: 'yesterday'
    translation: 'gestern'
    partOfSpeech: 'adverb'
    example: 'Yesterday I was at the cinema.'
    exampleTranslation: 'Gestern war ich im Kino.'
  - id: 'en-GB-A1-TIME-001-005'
    concept: 'o-clock'
    term: "o'clock"
    translation: 'Uhr'
    partOfSpeech: 'noun'
    gender: 'feminine'
    example: "It's three o'clock."
    exampleTranslation: 'Es ist drei Uhr.'
  - id: 'en-GB-A1-TIME-001-006'
    concept: 'day-of-the-week'
    term: 'day of the week'
    translation: 'Wochentag'
    partOfSpeech: 'noun'
    gender: 'masculine'
    example: 'What day of the week is it today?'
    exampleTranslation: 'Welcher Wochentag ist heute?'
grammar: []
culturalNotes: 'Germans are known for punctuality; being late is considered disrespectful.
  "Pünktlichkeit ist die Höflichkeit der Könige" (Punctuality is the politeness of
  kings).'
