grammar:
  - id: B2-GRAMMAR-004
    point: 'Complex conditionals with mixed time references'
    explanation: 'Using mixed conditionals to connect past and present hypotheticals'
    examples:
      - 'If I had studied, I would have passed the exam.'
      - 'If I were rich, I would have bought that house.'
    cefrNotes: 'B2 learners handle mixed conditionals for nuanced hypothetical reasoning'
culturalNotes: "British clarification often uses 'What I mean is...' or 'To put it another way...'. Asking 'Does that make sense?' checks understanding without being patronising."
