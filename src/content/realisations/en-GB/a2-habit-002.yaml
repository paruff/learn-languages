grammar:
  - id: en-GB-A2-HABIT-002-G01
    point: 'recent past activities'
    explanation: 'Describing what happened recently'
    examples:
      - 'Yesterday I went to the supermarket.'
      - 'This week I read two books.'
culturalNotes: 'Portuguese people enjoy outdoor activities, especially in summer. Common activities include walking, cycling, and going to the beach.'
