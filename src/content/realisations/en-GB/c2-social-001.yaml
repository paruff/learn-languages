grammar:
  - id: C2-GRAMMAR-018
    point: 'Advanced hypothetical constructions for social interaction'
    explanation: "Use hypothetical clauses for social interaction: 'If I were asked, I would explain the subject with total clarity' (Se me fosse pedido, explicaria o assunto com total clareza)."
    examples:
      - 'You can talk to me about any subject, and I will understand.'
      - 'No matter the topic, I can communicate effectively.'
    cefrNotes: 'C2 speakers use hypothetical constructions to demonstrate near-native social interaction'
culturalNotes: 'At C2 level, English speakers can interact with native speakers with a degree of fluency, spontaneity, confidence and precision that enables effective communication in all social contexts.'
