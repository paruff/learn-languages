vocabulary:
  - id: en-GB-B2-TEXT-001-001
    term: 'to read with independence'
    translation: 'ler com autonomia'
    partOfSpeech: phrase
    gender: n/a
    example: 'I can read with independence on familiar topics.'
    exampleTranslation: 'Consigo ler com autonomia sobre temas familiares.'
  - id: en-GB-B2-TEXT-001-002
    term: 'to understand texts of medium difficulty'
    translation: 'compreender textos de dificuldade média'
    partOfSpeech: phrase
    gender: n/a
    example: 'I will understand texts of medium difficulty.'
    exampleTranslation: 'Vou compreender textos de dificuldade média.'
  - id: en-GB-B2-TEXT-001-003
    term: 'to identify main ideas'
    translation: 'identificar ideias principais'
    partOfSpeech: phrase
    gender: n/a
    example: 'It is important to identify the main ideas of the text.'
    exampleTranslation: 'É importante identificar as ideias principais do texto.'
  - id: en-GB-B2-TEXT-001-004
