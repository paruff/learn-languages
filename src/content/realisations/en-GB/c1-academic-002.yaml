grammar:
  - id: C1-GRAMMAR-018
    point: 'Connectors and hedging for spoken academic argument'
    explanation: "Backing up assertive sequences with concessive connectors and hedged modals, e.g. 'although' and 'even had the sample been larger'"
    examples:
      - 'Although the data are partial, the trend is clear.'
      - 'Even had the sample been enlarged, the conclusion would stand.'
    cefrNotes: 'C1 speakers of academic discourse combine concession with hedging for impartial tone'
culturalNotes: "British academic talks place the concession after the claim, using discourse markers such as 'that said' to signal a nuanced turn; questions are answered with hedged confidence, and self-deprecation is the standard opener."
