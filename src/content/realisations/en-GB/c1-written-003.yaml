grammar:
  - id: C1-GRAMMAR-016
    point: 'Hedging devices for personal narrative'
    explanation: "Managing the distance between memory and certainty with epistemic verbs and modals such as 'as I recall', 'it seems to me' and 'on the evidence'"
    examples:
      - 'As I recall, the party went on until the small hours.'
      - 'Everything points to the decision having been taken the day before.'
    cefrNotes: 'C1 writers grade reliability of memory and interpretation in first-person narrative'
culturalNotes: 'British memoir writing treats memory as settled fact laced with wry tolerance for its gaps; hedges are used sparingly precisely so that the rare honest caveat carries weight.'
