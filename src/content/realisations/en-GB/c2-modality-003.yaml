grammar:
  - id: C2-GRAMMAR-003
    point: 'Advanced conditional for hypothetical listening scenarios'
    explanation: "Use conditional for hypothetical scenarios in listening: 'Even if they spoke quickly, I would understand everything' (Mesmo que falassem rapidamente, eu compreenderia tudo)."
    examples:
      - 'Even if the speaker is fast, I can follow the reasoning.'
      - 'With different accents, I understand perfectly.'
    cefrNotes: 'C2 listeners use hypothetical constructions to express their capacity with any spoken language'
culturalNotes: 'Understanding any kind of spoken English at fast native speed, including varied accents and registers, demonstrates the highest level of listening comprehension.'
