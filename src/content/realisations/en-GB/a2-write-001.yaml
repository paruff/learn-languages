    partOfSpeech: conjunction
    example: 'I bought bread and milk.'
    exampleTranslation: 'J’ai acheté du pain et du lait.'
  - id: en-GB-A2-WRITE-001-002
    term: 'but'
    translation: 'mais'
    partOfSpeech: conjunction
    example: 'I wanted to go out, but it rained.'
    exampleTranslation: 'Je voulais sortir, mais il a plu.'
  - id: en-GB-A2-WRITE-001-003
    term: 'because'
    translation: 'parce que'
    partOfSpeech: conjunction
    example: 'I stayed home because I was tired.'
    exampleTranslation: 'Je suis resté à la maison parce que j’étais fatigué.'
