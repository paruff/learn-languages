    example: 'I got up, then I had breakfast.'
    exampleTranslation: 'Je me suis levé, ensuite j’ai pris le petit-déjeuner.'
  - id: en-GB-A2-WRITE-001-005
    term: 'sentence'
    translation: 'phrase'
