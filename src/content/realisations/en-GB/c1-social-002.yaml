grammar:
  - id: C1-GRAMMAR-002
    point: 'Register switching in British English'
    explanation: 'Managing social distance through first names vs titles, informal phrasal verbs vs formal equivalents, and hedged requests'
    examples:
      - 'Please call me John — everyone does.'
      - 'We would ask that you kindly refrain from addressing the client by first name.'
    cefrNotes: 'C1 learners consciously manage register alternation for social effect, not from uncertainty'
culturalNotes: "British English lacks a tu/você distinction, so social distance is managed through names, titles, and politeness strategies. 'Mr/Mrs/Ms + surname' marks formality; slipping into first names signals acceptance. Over-hedging can sound insincere."
