nodeId: B2-SOCIAL-002
lang: en-GB
vocabulary:
  - id: en-GB-B2-SOCIAL-002-001
    term: 'to debate topics'
    translation: 'debater temas'
    partOfSpeech: phrase
    gender: n/a
    example: 'I like to debate current topics with my friends.'
    exampleTranslation: 'Gosto de debater temas de actualidade com os meus amigos.'
  - id: en-GB-B2-SOCIAL-002-002
    term: 'to participate in discussions'
    translation: 'participar em discussões'
    partOfSpeech: phrase
    gender: n/a
    example: 'It is important to participate actively in discussions.'
    exampleTranslation: 'É importante participar ativamente em discussões.'
  - id: en-GB-B2-SOCIAL-002-003
    term: 'to express points of view'
    translation: 'expressar pontos de vista'
    partOfSpeech: phrase
    gender: n/a
    example: 'I can express my points of view clearly.'
    exampleTranslation: 'Consigo expressar os meus pontos de vista com clareza.'
  - id: en-GB-B2-SOCIAL-002-004
    term: 'to argue in favour'
    translation: 'argumentar a favor'
    partOfSpeech: phrase
    gender: n/a
    example: 'I will argue in favour of my position.'
    exampleTranslation: 'Vou argumentar a favor da minha posição.'
  - id: en-GB-B2-SOCIAL-002-005
    term: 'to counter arguments'
    translation: 'contrapor argumentos'
    partOfSpeech: phrase
    gender: n/a
    example: 'It is useful to counter arguments to enrich the discussion.'
    exampleTranslation: 'É útil contrapor argumentos para enriquecer a discussão.'
  - id: en-GB-B2-SOCIAL-002-006
    term: 'to reach consensus'
    translation: 'chegar a consensos'
    partOfSpeech: phrase
    gender: n/a
    example: 'The goal is to reach consensus, not conflict.'
    exampleTranslation: 'O objetivo é chegar a consensos, não a conflitos.'
grammar:
  - id: B2-GRAMMAR-002
    point: 'Future subjunctive in conditional clauses'
    explanation: 'Using future subjunctive with when, if, so that in less common contexts'
    examples:
      - 'When I am older, I will travel more.'
      - 'If he comes, let me know.'
    cefrNotes: 'B2 learners encounter future subjunctive in formal and literary contexts'
culturalNotes: "British discussion culture values measured contribution. Taking turns and not interrupting is preferred. 'I take your point, but...' introduces disagreement politely."
