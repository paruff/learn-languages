vocabulary:
  - id: en-GB-B2-WRITTEN-002-001
    term: 'to write an essay'
    translation: 'escrever um ensaio'
    partOfSpeech: phrase
    gender: n/a
    example: 'I will write an essay that develops an argument.'
    exampleTranslation: 'Vou escrever um ensaio que desenvolva um argumento.'
  - id: en-GB-B2-WRITTEN-002-002
    term: 'to elaborate a report'
    translation: 'elaborar um relatório'
    partOfSpeech: phrase
    gender: n/a
    example: 'I need to elaborate a detailed report.'
    exampleTranslation: 'Preciso de elaborar um relatório detalhado.'
  - id: en-GB-B2-WRITTEN-002-003
    term: 'to develop the thesis'
    translation: 'desenvolver a tese'
    partOfSpeech: phrase
    gender: n/a
    example: 'It is important to develop the thesis with arguments.'
    exampleTranslation: 'É importante desenvolver a tese com argumentos.'
  - id: en-GB-B2-WRITTEN-002-004
    term: 'to present supporting data'
    translation: 'apresentar dados de suporte'
    partOfSpeech: phrase
    gender: n/a
