  - id: en-GB-B2-WRITTEN-002-005
    term: 'to use academic vocabulary'
    translation: 'usar vocabulário académico'
    partOfSpeech: phrase
    gender: n/a
    example: 'It is useful to use academic vocabulary in the report.'
    exampleTranslation: 'É útil usar vocabulário académico no relatório.'
  - id: en-GB-B2-WRITTEN-002-006
    term: 'to structure the written argumentation'
    translation: 'estruturar a argumentação escrita'
    partOfSpeech: phrase
    gender: n/a
    example: 'I need to structure the written argumentation clearly.'
    exampleTranslation: 'Preciso de estruturar a argumentação escrita de forma clara.'
grammar:
  - id: B2-GRAMMAR-017
    point: 'Advanced connectors for written argumentation'
    explanation: 'Using sophisticated connectors for structured written expression'
    examples:
      - 'Despite the difficulties, the project progressed.'
      - 'In contrast, the results were positive.'
    cefrNotes: 'B2 learners use advanced connectors for formal written argumentation'
culturalNotes: "British essay writing values clear thesis and systematic development. Using 'my thesis is that' or 'I argue that' introduces your argument."
