vocabulary:
  - id: en-GB-C1-WRITTEN-001-001
    term: 'to adapt the register to the reader'
    translation: 'adaptar o registo ao leitor'
    partOfSpeech: phrase
    gender: n/a
    example: 'The columnist knows how to adapt the register to the newspaper reader.'
    exampleTranslation: 'O cronista sabe adaptar o registo ao leitor do jornal.'
  - id: en-GB-C1-WRITTEN-001-002
    term: 'opinion piece'
    translation: 'texto de opinião'
    partOfSpeech: noun
    gender: masculine
    example: 'The opinion piece prompted an immediate response from readers.'
    exampleTranslation: 'O texto de opinião provocou uma resposta imediata dos leitores.'
  - id: en-GB-C1-WRITTEN-001-003
    term: 'argumentative coherence'
    translation: 'coerência argumentativa'
