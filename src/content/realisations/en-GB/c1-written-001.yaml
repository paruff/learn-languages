grammar:
  - id: C1-GRAMMAR-014
    point: 'Register switching and connectors in formal writing'
    explanation: "Switching between impersonal and personal constructions and layering connectors such as 'notwithstanding' and 'in the light of' to control distance and tone"
    examples:
      - 'Notwithstanding the progress made, structural inequalities persist.'
      - 'In the light of the available data, the conclusion calls for caution.'
    cefrNotes: 'C1 writers fine-tune register to the intended audience in opinion prose'
culturalNotes: 'British broadsheet prose favours short paragraphs and a direct personal voice; the reader is addressed with civil but plain argumentation. Connectors are lighter than in Romance prose, with tone carried by word choice and rhythm.'
