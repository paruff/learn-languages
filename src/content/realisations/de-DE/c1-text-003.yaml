    term: 'Argumentationslinie'
    translation: 'line of argument'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Argumentationslinie war klar.'
    exampleTranslation: 'The line of argument was clear.'
  - id: de-DE-C1-TEXT-003-002
    term: 'erkennen'
    translation: 'to recognize'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich kann die Argumentationslinie erkennen.'
    exampleTranslation: 'I can recognize the line of argument.'
  - id: de-DE-C1-TEXT-003-003
    term: 'Thema'
    translation: 'topic / issue'
    partOfSpeech: noun
    gender: neuter
    example: 'Das Thema wurde klar dargestellt.'
    exampleTranslation: 'The issue was clearly presented.'
  - id: de-DE-C1-TEXT-003-004
    term: 'Darstellung'
    translation: 'presentation / representation'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Darstellung war überzeugend.'
    exampleTranslation: 'The presentation was convincing.'
  - id: de-DE-C1-TEXT-003-005
    term: 'Struktur'
    translation: 'structure'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Struktur des Textes war klar.'
    exampleTranslation: 'The structure of the text was clear.'
  - id: de-DE-C1-TEXT-003-006
    term: 'Hauptgedanke'
    translation: 'main idea'
    partOfSpeech: noun
    gender: masculine
