vocabulary:
  - id: de-DE-C1-TEXT-003-007
    concept: 'to-grasp-the-beauty-of-the-text'
    term: 'die Schönheit des Textes erfassen'
    translation: 'to grasp the beauty of the text'
    partOfSpeech: phrase
    gender: n/a
    example: 'Der geduldige Leser erfasst die Schönheit des Textes im Rhythmus der Sätze.'
    exampleTranslation: 'The patient reader grasps the beauty of the text in the cadence of the sentences.'
  - id: de-DE-C1-TEXT-003-008
    concept: 'cultural-allusions'
    term: 'die kulturellen Anspielungen'
    translation: 'cultural allusions'
    partOfSpeech: noun
    gender: feminine
    example: 'Die lebendige Prosa ist gespickt mit kulturellen Anspielungen, die dem Touristen entgehen.'
    exampleTranslation: 'The lively prose is peppered with cultural allusions that escape the tourist.'
  - id: de-DE-C1-TEXT-003-009
    concept: 'to-go-beyond-the-literal-meaning'
    term: 'über den Wortsinn hinausgehen'
    translation: 'to go beyond the literal meaning'
    partOfSpeech: phrase
    gender: n/a
    example: 'Man sollte über den Wortsinn hinausgehen, um die Metapher auszukosten.'
    exampleTranslation: 'One should go beyond the literal meaning to savour the metaphor.'
  - id: de-DE-C1-TEXT-003-010
    concept: 'figurative-language'
    term: 'die bildhafte Sprache'
    translation: 'figurative language'
    partOfSpeech: noun
    gender: feminine
    example: 'Bildhafte Sprache bereichert das Gedicht, ohne es hermetisch zu machen.'
    exampleTranslation: 'Figurative language enriches the poem without making it hermetic.'
  - id: de-DE-C1-TEXT-003-011
    concept: 'aesthetic-stance'
    term: 'die ästhetische Haltung'
    translation: 'aesthetic stance'
    partOfSpeech: noun
    gender: feminine
    example: 'Die ästhetische Haltung des Autors spaltet die Kritiker.'
    exampleTranslation: "The author's aesthetic stance divides the critics."
  - id: de-DE-C1-TEXT-003-012
    concept: 'lusophone-flavour'
    term: 'das lusophone Kolorit'
    translation: 'Lusophone flavour'
    partOfSpeech: noun
    gender: neuter
    example: 'Der Roman hat ein unverkennbar lusophones Kolorit.'
    exampleTranslation: 'The novel has an unmistakable Lusophone flavour.'
grammar: []
culturalNotes: 'German argumentative texts follow "Rhetorik" (rhetoric) principles; identifying the "These" (thesis), "Argumente" (arguments), and "Schlussfolgerung" (conclusion) is essential for C1 reading.'
