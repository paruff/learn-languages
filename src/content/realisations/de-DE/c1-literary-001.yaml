  - id: de-DE-C1-LITERARY-001-007
    concept: 'layers-of-meaning'
    term: 'die Bedeutungsebenen'
    translation: 'layers of meaning'
    partOfSpeech: noun
    gender: feminine
    example: 'Das Gedicht offenbart bei jeder erneuten Lektüre neue Bedeutungsebenen.'
    exampleTranslation: 'The poem reveals layers of meaning with every re-reading.'
  - id: de-DE-C1-LITERARY-001-008
    concept: 'extended-metaphor'
    term: 'die ausgeführte Metapher'
    translation: 'extended metaphor'
    partOfSpeech: noun
    gender: feminine
    example: 'Die ausgeführte Metapher zieht sich durch den ganzen Roman.'
    exampleTranslation: 'The extended metaphor runs through the whole novel.'
  - id: de-DE-C1-LITERARY-001-009
    concept: 'cultural-resonance'
    term: 'der kulturelle Nachhall'
    translation: 'cultural resonance'
    partOfSpeech: noun
    gender: masculine
    example: 'Der kulturelle Nachhall der Erzählung entgeht ausländischen Lesern.'
    exampleTranslation: 'The cultural resonance of the tale escapes foreign readers.'
  - id: de-DE-C1-LITERARY-001-010
    concept: 'narrative-voice'
    term: 'die Erzählstimme'
    translation: 'narrative voice'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Erzählstimme distanziert sich vom klassischen allwissenden Erzähler.'
    exampleTranslation: 'The narrative voice distances itself from the classic omniscient narrator.'
  - id: de-DE-C1-LITERARY-001-011
    concept: 'to-weave-the-references-together'
    term: 'die Anspielungen verweben'
    translation: 'to weave the references together'
    partOfSpeech: phrase
    gender: n/a
    example: 'Der Autor verwebt die biblischen und maritimen Anspielungen mit Talent.'
    exampleTranslation: 'The author weaves the biblical and maritime references together with talent.'
  - id: de-DE-C1-LITERARY-001-012
    concept: 'flavour-of-the-era'
    term: 'das Zeitkolorit'
    translation: 'flavour of the era'
    partOfSpeech: noun
    gender: neuter
    example: 'Der Roman gibt das Zeitkolorit mit Strenge und Fantasie wieder.'
    exampleTranslation: 'The novel recreates the flavour of the era with rigour and imagination.'
