    translation: 'to develop sub-topics'
    partOfSpeech: phrase
    gender: n/a
    example: 'Der Redner arbeitete die Unterthemen mit beneidenswerter Stimmigkeit aus.'
    exampleTranslation: 'The speaker developed the sub-topics with enviable coherence.'
  - id: de-DE-C1-ARGUE-001-008
