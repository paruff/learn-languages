grammar:
  - id: C1-ARGUE-001-GR01
    point: 'Constructing sophisticated arguments strategically'
    explanation: 'At C1, construct arguments by: layering evidence (Nicht nur..., sondern auch...), using concessive structures (Zwar gibt es..., dennoch...), and deploying rhetorical questions (Ist es nicht vielmehr so, dass...?).'
    examples:
      - 'Zwar gibt es Gegenargumente, dennoch überwiegen die Fakten.'
      - 'Nicht nur die Daten, sondern auch die Praxis zeigen, dass...'
culturalNotes: 'German academic argumentation at C1 level expects "Rhetorik" (rhetoric) combined with "Sachlichkeit" (objectivity); emotional appeals are less valued than logical evidence.'
