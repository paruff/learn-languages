grammar:
  - id: B2-ARGUE-001-GR01
    point: 'Constructing chains of reasoning'
    explanation: 'At B2, construct arguments by: stating a premise (Ausgehend von der Annahme, dass...), providing evidence (Zum einen... zum anderen...), and drawing a conclusion (Daraus folgt, dass...). Use Konjunktiv II for hypothetical reasoning.'
    examples:
      - 'Ausgehend von der Annahme, dass die Wirtschaft wächst, kann man folgern, dass...'
      - 'Daraus folgt, dass wir mehr investieren müssen.'
culturalNotes: 'German academic and professional argumentation follows the "These-Antithese-Synthese" pattern; constructing logical chains ("Argumentationskette") is valued in debates and written discourse.'
