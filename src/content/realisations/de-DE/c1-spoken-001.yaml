vocabulary:
  - id: de-DE-C1-SPOKEN-001-007
    concept: 'detailed-narrative'
    term: 'die ausführliche Erzählung'
    translation: 'detailed narrative'
    partOfSpeech: noun
    gender: feminine
    example: 'Die ausführliche Erzählung von der Reise begeisterte die Gäste.'
    exampleTranslation: 'The detailed narrative of the journey delighted the guests.'
  - id: de-DE-C1-SPOKEN-001-008
    concept: 'background'
    term: 'der Hintergrund'
    translation: 'background'
    partOfSpeech: noun
    gender: masculine
    example: 'Der Hintergrund der Erzählung ist die Wirtschaftskrise der Neunzigerjahre.'
    exampleTranslation: 'The background of the account is the economic crisis of the nineties.'
  - id: de-DE-C1-SPOKEN-001-009
    concept: 'to-develop-a-sub-theme'
    term: 'ein Nebenthema ausführen'
    translation: 'to develop a sub-theme'
    partOfSpeech: phrase
    gender: n/a
    example: 'Er führte ein Nebenthema aus, mit dem niemand gerechnet hatte, und fesselte alle.'
    exampleTranslation: "He developed a sub-theme nobody expected and captured everyone's attention."
  - id: de-DE-C1-SPOKEN-001-010
    concept: 'to-round-off-the-story'
    term: 'die Geschichte abrunden'
    translation: 'to round off the story'
    partOfSpeech: phrase
    gender: n/a
    example: 'Er rundete die Geschichte mit einer überraschenden Überlegung ab.'
    exampleTranslation: 'He rounded off the story with a surprising reflection.'
  - id: de-DE-C1-SPOKEN-001-011
    concept: 'to-offer-reflections'
    term: 'Überlegungen beisteuern'
    translation: 'to offer reflections'
    partOfSpeech: phrase
    gender: n/a
    example: 'Im Verlauf des Gesprächs steuerte er treffende Überlegungen zum Thema bei.'
    exampleTranslation: 'Throughout the conversation, he offered pertinent reflections on the matter.'
  - id: de-DE-C1-SPOKEN-001-012
    concept: 'vivid-description'
    term: 'die lebhafte Beschreibung'
    translation: 'vivid description'
    partOfSpeech: noun
    gender: feminine
    example: 'Seine lebhafte Beschreibung des Wochenmarkts ließ uns glauben, wir seien dort.'
    exampleTranslation: 'His vivid description of the local market made us feel we were there.'
