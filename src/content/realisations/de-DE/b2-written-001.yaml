grammar:
  - id: B2-WRITTEN-001-GR01
    point: 'Writing clear, detailed text on a wide range of subjects'
    explanation: 'At B2, write clear texts by: using topic sentences, logical connectors (deshalb, außerdem, jedoch), varied vocabulary, complex sentence structures, and clear paragraph organization. Maintain consistent register throughout.'
    examples:
      - 'Ich interessiere mich für Politik. Deshalb schreibe ich über aktuelle Themen.'
      - 'Außerdem möchte ich meine Meinung klar ausdrücken.'
culturalNotes: 'German written texts at B2 level should demonstrate "Textkompetenz" (text competence): clear structure, appropriate register, and well-developed arguments.'
