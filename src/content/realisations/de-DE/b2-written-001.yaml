vocabulary:
  - id: de-DE-B2-WRITTEN-001-007
    concept: 'to-write-clear-and-detailed-texts'
    term: 'klare und detaillierte Texte schreiben'
    translation: 'to write clear and detailed texts'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich kann klare und detaillierte Texte zu verschiedenen Themen schreiben.'
    exampleTranslation: 'I can write clear and detailed texts on various topics.'
  - id: de-DE-B2-WRITTEN-001-008
    concept: 'to-develop-the-writing'
    term: 'den Text ausbauen'
    translation: 'to develop the writing'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich baue den Text mit mehr Einzelheiten aus.'
    exampleTranslation: 'I will develop the writing with more details.'
  - id: de-DE-B2-WRITTEN-001-009
    concept: 'to-use-varied-vocabulary'
    term: 'abwechslungsreichen Wortschatz verwenden'
    translation: 'to use varied vocabulary'
    partOfSpeech: phrase
    gender: n/a
    example: 'Es ist wichtig, beim Schreiben einen abwechslungsreichen Wortschatz zu verwenden.'
    exampleTranslation: 'It is important to use varied vocabulary in writing.'
  - id: de-DE-B2-WRITTEN-001-010
    concept: 'to-structure-paragraphs'
