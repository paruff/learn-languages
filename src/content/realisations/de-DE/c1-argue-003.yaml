nodeId: C1-ARGUE-003
lang: de-DE
vocabulary:
  - id: de-DE-C1-ARGUE-003-007
    concept: 'to-soften-a-statement'
    term: 'eine Aussage abschwächen'
    translation: 'to soften a statement'
    partOfSpeech: phrase
    gender: n/a
    example: 'Um nicht überheblich zu wirken, schwächte er die Aussage mit einer vorsichtigen Bemerkung ab.'
    exampleTranslation: 'In order not to seem arrogant, he softened the statement with a cautious comment.'
  - id: de-DE-C1-ARGUE-003-008
    concept: 'to-qualify-one-s-opinion'
    term: 'die eigene Meinung relativieren'
    translation: "to qualify one's opinion"
    partOfSpeech: phrase
    gender: n/a
    example: 'Die eigene Meinung mit konkreten Beispielen zu relativieren ist ein Zeichen von Reife.'
    exampleTranslation: "Qualifying one's opinion with concrete examples is a sign of maturity."
  - id: de-DE-C1-ARGUE-003-009
    concept: 'rhetorical-modesty'
    term: 'die rhetorische Bescheidenheit'
    translation: 'rhetorical modesty'
    partOfSpeech: noun
    gender: feminine
    example: 'Rhetorische Bescheidenheit erlaubt es, starke Ideen ohne Feindseligkeit vorzutragen.'
    exampleTranslation: 'Rhetorical modesty allows presenting strong ideas without hostility.'
  - id: de-DE-C1-ARGUE-003-010
    concept: 'to-show-reserve'
    term: 'Zurückhaltung zeigen'
    translation: 'to show reserve'
    partOfSpeech: phrase
    gender: n/a
    example: 'Er zeigte Zurückhaltung gegenüber den optimistischsten Prognosen.'
    exampleTranslation: 'He showed reserve regarding the most optimistic forecasts.'
  - id: de-DE-C1-ARGUE-003-011
    concept: 'to-guard-one-s-opinion'
    term: 'die eigene Meinung absichern'
    translation: "to guard one's opinion"
    partOfSpeech: phrase
    gender: n/a
    example: 'Er sicherte seine Meinung mit einem letzten Vorbehalt ab.'
    exampleTranslation: 'He guarded his opinion with a final caveat.'
  - id: de-DE-C1-ARGUE-003-012
    concept: 'to-express-prudent-doubt'
    term: 'vorsichtige Zweifel äußern'
    translation: 'to express prudent doubt'
    partOfSpeech: phrase
    gender: n/a
    example: 'In lockeren Gesprächen ist es üblich, vorsichtige Zweifel zu äußern, bevor man zustimmt.'
    exampleTranslation: 'Expressing prudent doubt before agreeing is common in informal conversations.'
grammar:
  - id: C1-ARGUE-003-GR01
    point: 'Constructing logical arguments using facts and structure'
    explanation: 'At C1, construct logical arguments by: stating facts (Die Tatsachen zeigen...), building logical chains (Daraus folgt, dass...), and using clear structure markers (Zunächst..., Anschließend..., Abschließend...).'
    examples:
      - 'Die Tatsachen zeigen einen klaren Trend. Daraus folgt, dass wir handeln müssen.'
      - 'Zunächst werden die Fakten dargestellt, anschließend erfolgt die Analyse.'
culturalNotes: 'German logical argumentation values "Logik" and "Struktur"; jumping between points without clear connections is considered weak at C1 level.'
