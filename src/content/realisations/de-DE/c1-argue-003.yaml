    gender: masculine
    example: 'Der Zusammenhang war klar erkennbar.'
    exampleTranslation: 'The context was clearly recognizable.'
grammar:
  - id: C1-ARGUE-003-GR01
    point: 'Constructing logical arguments using facts and structure'
    explanation: 'At C1, construct logical arguments by: stating facts (Die Tatsachen zeigen...), building logical chains (Daraus folgt, dass...), and using clear structure markers (Zunächst..., Anschließend..., Abschließend...).'
    examples:
      - 'Die Tatsachen zeigen einen klaren Trend. Daraus folgt, dass wir handeln müssen.'
      - 'Zunächst werden die Fakten dargestellt, anschließend erfolgt die Analyse.'
culturalNotes: 'German logical argumentation values "Logik" and "Struktur"; jumping between points without clear connections is considered weak at C1 level.'
