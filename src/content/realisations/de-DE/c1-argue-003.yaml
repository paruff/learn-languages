nodeId: C1-ARGUE-003
lang: de-DE
vocabulary:
  - id: de-DE-C1-ARGUE-003-001
    term: 'Sachverhalte'
    translation: 'facts / circumstances'
    partOfSpeech: noun
    gender: n/a
    example: 'Die Sachverhalte wurden klar dargestellt.'
    exampleTranslation: 'The facts were clearly presented.'
  - id: de-DE-C1-ARGUE-003-002
    term: 'Tatsachen'
    translation: 'facts'
    partOfSpeech: noun
    gender: n/a
    example: 'Die Tatsachen sprechen für sich.'
    exampleTranslation: 'The facts speak for themselves.'
  - id: de-DE-C1-ARGUE-003-003
    term: 'Logik'
    translation: 'logic'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Logik der Argumentation war einwandfrei.'
    exampleTranslation: 'The logic of the argumentation was flawless.'
  - id: de-DE-C1-ARGUE-003-004
    term: 'Struktur'
    translation: 'structure'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Struktur war klar und nachvollziehbar.'
    exampleTranslation: 'The structure was clear and comprehensible.'
  - id: de-DE-C1-ARGUE-003-005
    term: 'nachvollziehbar'
    translation: 'comprehensible / traceable'
    partOfSpeech: adjective
    gender: n/a
    example: 'Die Argumentation war nachvollziehbar.'
    exampleTranslation: 'The argumentation was comprehensible.'
  - id: de-DE-C1-ARGUE-003-006
    term: 'Zusammenhang'
    translation: 'context / coherence'
