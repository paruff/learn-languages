grammar:
  - id: B2-ARGUE-003-GR01
    point: 'Developing arguments systematically'
    explanation: 'At B2, develop arguments by: introducing the main point (Der Schwerpunkt liegt auf...), supporting with evidence (Zum einen... zum anderen...), highlighting key points (Besonders wichtig ist...), and concluding (Zusammenfassend lässt sich sagen...).'
    examples:
      - 'Der Schwerpunkt liegt auf der Wirtschaft. Besonders wichtig ist...'
      - 'Zusammenfassend lässt sich sagen, dass die Argumentation überzeugend war.'
culturalNotes: 'German argumentation values systematic structure ("systematische Argumentation"); jumping between points without clear connections is considered weak.'
