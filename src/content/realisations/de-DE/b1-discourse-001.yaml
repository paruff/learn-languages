nodeId: B1-DISCOURSE-001
lang: de-DE
vocabulary:
  - id: de-DE-B1-DISCOURSE-001-001
    term: 'außerdem'
    translation: 'furthermore / besides'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Es war teuer. Außerdem war es schlecht.'
    exampleTranslation: 'It was expensive. Furthermore, it was bad.'
  - id: de-DE-B1-DISCOURSE-001-002
    term: 'deshalb'
    translation: 'therefore'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Es regnete. Deshalb blieb ich zu Hause.'
    exampleTranslation: 'It was raining. Therefore, I stayed home.'
  - id: de-DE-B1-DISCOURSE-001-003
    term: 'trotzdem'
    translation: 'nevertheless'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Es war kalt. Trotzdem ging ich spazieren.'
    exampleTranslation: 'It was cold. Nevertheless, I went for a walk.'
  - id: de-DE-B1-DISCOURSE-001-004
    term: 'allerdings'
    translation: 'however / though'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Das ist gut. Allerdings gibt es Probleme.'
    exampleTranslation: 'That is good. However, there are problems.'
  - id: de-DE-B1-DISCOURSE-001-005
    term: 'zwar'
    translation: 'admittedly'
    partOfSpeech: adverb
    gender: n/a
    example: 'Es war zwar teurable, aber gut.'
    exampleTranslation: 'It was admittedly expensive, but good.'
  - id: de-DE-B1-DISCOURSE-001-006
    term: 'dagegen'
    translation: 'on the other hand'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Hier ist es warm. Dagegen ist es dort kalt.'
    exampleTranslation: 'Here it is warm. On the other hand, it is cold there.'
grammar:
  - id: B1-DISCOURSE-001-GR01
    point: 'Connectors: coordinated clauses'
    explanation: 'German uses a wide range of connectors (außerdem, deshalb, trotzdem, allerdings, dagegen) to link ideas in extended speech. Placement: after the verb in main clauses, or at the beginning for emphasis.'
    examples:
      - 'Es war teure. Außerdem war es nicht gut.'
      - 'Deshalb bin ich gegangen.'
culturalNotes: 'German discourse relies heavily on connectors ("Gliederungswörter") for logical structure; mastering these is essential for natural-sounding speech at B1 and above.'
