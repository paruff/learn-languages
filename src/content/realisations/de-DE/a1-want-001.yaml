nodeId: A1-WANT-001
lang: de-DE
vocabulary:
  - id: de-DE-A1-WANT-001-001
    term: 'Ich will...'
    translation: 'I want...'
    partOfSpeech: phrase
    example: 'Ich will nach Hause gehen.'
    exampleTranslation: 'I want to go home.'
  - id: de-DE-A1-WANT-001-002
    term: 'Ich möchte...'
    translation: 'I would like...'
    partOfSpeech: phrase
    example: 'Ich möchte einen Tee trinken.'
    exampleTranslation: 'I would like to drink a tea.'
  - id: de-DE-A1-WANT-001-003
    term: 'Ich habe vor...'
    translation: "I'm going to..."
    partOfSpeech: phrase
    example: 'Ich habe vor, morgen zu reisen.'
    exampleTranslation: "I'm going to travel tomorrow."
  - id: de-DE-A1-WANT-001-004
    term: 'hoffen'
    translation: 'to hope'
    partOfSpeech: verb
    example: 'Ich hoffe, es geht Ihnen gut.'
    exampleTranslation: 'I hope you are doing well.'
  - id: de-DE-A1-WANT-001-005
    term: 'wünschen'
    translation: 'to wish'
    partOfSpeech: verb
    example: 'Ich wünsche Ihnen einen schönen Tag.'
    exampleTranslation: 'I wish you a nice day.'
  - id: de-DE-A1-WANT-001-006
    term: 'Wunsch'
    translation: 'wish'
    partOfSpeech: noun
    gender: masculine
    example: 'Das ist mein größter Wunsch.'
    exampleTranslation: 'That is my greatest wish.'
grammar: []
culturalNotes: '"Möchte" (would like) is more polite than "will" (want) in German; using "möchte" shows good manners in everyday interactions.'
