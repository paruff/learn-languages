nodeId: C2-MODALITY-001
lang: de-DE
vocabulary:
  - id: de-DE-C2-MODALITY-001-001
    term: 'Konjunktiv II'
    translation: 'subjunctive II'
    partOfSpeech: noun
    gender: masculine
    example: 'Der Konjunktiv II wird für hypothetische Aussagen verwendet.'
    exampleTranslation: 'The subjunctive II is used for hypothetical statements.'
  - id: de-DE-C2-MODALITY-001-002
    term: 'hypothisch'
    translation: 'hypothetical'
    partOfSpeech: adjective
    gender: n/a
    example: 'Das ist eine hypothetische Aussage.'
    exampleTranslation: 'That is a hypothetical statement.'
  - id: de-DE-C2-MODALITY-001-003
    term: 'Wunschform'
    translation: 'wish form'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Wunschform wird oft verwendet.'
    exampleTranslation: 'The wish form is often used.'
  - id: de-DE-C2-MODALITY-001-004
    term: 'irreal'
    translation: 'unreal / counterfactual'
    partOfSpeech: adjective
    gender: n/a
    example: 'Das ist eine irrealistische Vorstellung.'
    exampleTranslation: 'That is an unrealistic idea.'
  - id: de-DE-C2-MODALITY-001-005
    term: 'Vergangenheit'
    translation: 'past'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Vergangenheit ist unveränderlich.'
    exampleTranslation: 'The past is unchangeable.'
  - id: de-DE-C2-MODALITY-001-006
    term: 'bedingen'
    translation: 'to condition / to require'
    partOfSpeech: verb
    gender: n/a
    example: 'Die Situation bedingt eine Änderung.'
    exampleTranslation: 'The situation requires a change.'
grammar:
  - id: C2-MODALITY-001-GR01
    point: 'Using advanced subjunctive and hypothetical structures'
    explanation: 'At C2, use advanced modal structures by: employing Konjunktiv II for counterfactuals (Wenn ich reich wäre, würde ich...), expressing wishes (Hätte ich doch...), and using past hypotheticals (Wenn ich das gewusst hätte, hätte ich...).'
    examples:
      - 'Wenn ich reich wäre, würde ich um die Welt reisen.'
      - 'Hätte ich doch früher angefangen!'
culturalNotes: 'German Konjunktiv II at C2 level is used for politeness, hypotheticals, and counterfactuals; mastering this mood is essential for sophisticated expression.'
