grammar:
  - id: C1-PROFESSIONAL-001-GR01
    point: 'Making formal presentations to specialist audiences'
    explanation: 'At C1, make formal presentations by: structuring content logically (Einleitung, Hauptteil, Schluss), using specialist terminology, engaging the audience (Wie Sie sehen können...), and handling questions professionally.'
    examples:
      - 'Im Folgenden werde ich die Ergebnisse der Studie vorstellen.'
      - 'Wie Sie in Abbildung 1 sehen können, zeigt der Trend eine deutliche Zunahme.'
culturalNotes: 'German professional presentations ("Präsentationen") at C1 level expect "Fachkompetenz" (specialist competence) and "Struktur" (clear structure); rambling or digressions are considered unprofessional.'
