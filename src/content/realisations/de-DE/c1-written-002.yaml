vocabulary:
  - id: de-DE-C1-WRITTEN-002-007
    concept: 'critical-review'
    term: 'die Kritik'
    translation: 'critical review'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Kritik des Films erschien in der Sonntagsausgabe.'
    exampleTranslation: 'The critical review of the film came out in the Sunday edition.'
  - id: de-DE-C1-WRITTEN-002-008
    concept: 'reference-works'
    term: 'die Standardwerke'
    translation: 'reference works'
    partOfSpeech: noun
    gender: neuter
    example: 'Der Artikel stützt sich auf unverzichtbare Standardwerke.'
    exampleTranslation: 'The article draws on indispensable reference works.'
  - id: de-DE-C1-WRITTEN-002-009
    concept: 'aesthetic-judgement'
    term: 'das ästhetische Urteil'
    translation: 'aesthetic judgement'
    partOfSpeech: noun
    gender: neuter
    example: 'Der Kritiker untermauert sein ästhetisches Urteil mit genauen Beispielen.'
    exampleTranslation: 'The critic backs his aesthetic judgement with precise examples.'
  - id: de-DE-C1-WRITTEN-002-010
    concept: 'to-put-into-perspective'
    term: 'relativieren'
    translation: 'to put into perspective'
    partOfSpeech: phrase
    gender: n/a
    example: 'Die Kritikpunkte des ersten Essays sollte man relativieren.'
    exampleTranslation: 'One should put the criticisms of the first essay into perspective.'
  - id: de-DE-C1-WRITTEN-002-011
    concept: 'close-reading'
    term: 'die genaue Lektüre'
    translation: 'close reading'
    partOfSpeech: noun
    gender: feminine
    example: 'Seine genaue Lektüre der Schlussszene ist bewundernswert.'
    exampleTranslation: 'His close reading of the final scene is admirable.'
  - id: de-DE-C1-WRITTEN-002-012
    concept: 'final-assessment'
    term: 'das abschließende Urteil'
    translation: 'final assessment'
    partOfSpeech: noun
    gender: neuter
    example: 'Das abschließende Urteil fällt positiv aus, mit gelegentlichen Vorbehalten.'
    exampleTranslation: 'The final assessment is positive, with occasional reservations.'
grammar:
  - id: C1-WRITTEN-002-GR01
    point: 'Writing essays or reports developing arguments'
    explanation: 'At C1, develop arguments in writing by: stating a clear thesis (Meine These ist...), providing supporting evidence, addressing counterarguments (Einige würden sagen, dass...), and drawing conclusions with complex connectors.'
    examples:
      - 'Meine These ist, dass die Bildung wichtig ist. Ein Beispiel dafür ist...'
      - 'Abschließend lässt sich sagen, dass die Argumentation überzeugend war.'
culturalNotes: 'German essay writing ("Essayistik") values clear thesis development; the "These-Antithese-Synthese" pattern is standard for argumentative texts.'
