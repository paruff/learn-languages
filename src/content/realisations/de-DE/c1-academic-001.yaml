grammar:
  - id: C1-ACADEMIC-001-GR01
    point: 'Presenting reasoned conclusions in academic writing'
    explanation: 'At C1, present conclusions by: using complex connectors (Aus der vorliegenden Analyse ergibt sich, dass...), referencing sources (Laut [Author]...), and expressing nuanced positions (Obwohl die Daten... sprechen, lässt sich festhalten, dass...).'
    examples:
      - 'Aus der vorliegenden Analyse ergibt sich, dass die Hypothese bestätigt wird.'
      - 'Obwohl die Daten für eine Tendenz sprechen, lässt sich kein kausaler Zusammenhang nachweisen.'
culturalNotes: 'German academic writing ("wissenschaftliches Arbeiten") follows strict conventions: "Masterplan" structure, clear thesis, systematic argumentation, and explicit engagement with sources ("Quellenarbeit").'
