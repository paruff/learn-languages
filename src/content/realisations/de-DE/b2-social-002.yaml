vocabulary:
  - id: de-DE-B2-SOCIAL-002-001
    term: 'Diskussion'
    translation: 'discussion'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Diskussion war sehr konstruktiv.'
    exampleTranslation: 'The discussion was very constructive.'
  - id: de-DE-B2-SOCIAL-002-002
    term: 'kontextbezogen'
    translation: 'context-related'
    partOfSpeech: adjective
    gender: n/a
    example: 'Die Diskussion war kontextbezogen.'
    exampleTranslation: 'The discussion was context-related.'
  - id: de-DE-B2-SOCIAL-002-003
    term: 'aktiv teilnehmen'
    translation: 'to participate actively'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich nehme aktiv an der Diskussion teil.'
    exampleTranslation: 'I actively participate in the discussion.'
  - id: de-DE-B2-SOCIAL-002-004
    term: 'Meinung äußern'
    translation: 'to express an opinion'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich möchte meine Meinung äußern.'
    exampleTranslation: 'I would like to express my opinion.'
  - id: de-DE-B2-SOCIAL-002-005
    term: 'zustimmen'
    translation: 'to agree'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich stimme Ihnen zu.'
    exampleTranslation: 'I agree with you.'
  - id: de-DE-B2-SOCIAL-002-006
    term: 'ablehnen'
    translation: 'to reject / to decline'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich lehne Ihren Vorschlag ab.'
    exampleTranslation: 'I reject your proposal.'
grammar:
  - id: B2-SOCIAL-002-GR01
    point: 'Taking active part in discussions'
    explanation: 'At B2, participate actively by: contributing opinions (Ich möchte einen Kommentar abgeben), asking for clarification (Können Sie das genauer erklären?), responding to others (Das finde ich interessant, weil...), and managing turn-taking.'
    examples:
      - 'Ich möchte einen Kommentar abgeben. Meiner Meinung nach...'
      - 'Das finde ich interessant. Können Sie das genauer erklären?'
culturalNotes: 'German discussions value "Sachlichkeit" (objectivity) and "Fairness"; interrupting others is considered rude, and well-structured contributions are appreciated.'
