nodeId: C2-ACADEMIC-001
lang: de-DE
vocabulary:
  - id: de-DE-C2-ACADEMIC-001-001
    term: 'Dissertation'
    translation: 'dissertation'
    partOfSpeech: noun
    gender: feminine
    example: 'Sie schreibt ihre Dissertation über quantitative Analyse.'
    exampleTranslation: 'She is writing her dissertation on quantitative analysis.'
  - id: de-DE-C2-ACADEMIC-001-002
    term: 'Bericht'
    translation: 'report'
    partOfSpeech: noun
    gender: masculine
    example: 'Der Bericht präsentiert die Ergebnisse der Studie.'
    exampleTranslation: 'The report presents the results of the study.'
  - id: de-DE-C2-ACADEMIC-001-003
    term: 'Synthese'
    translation: 'synthesis'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Synthese der Quellen war überzeugend.'
    exampleTranslation: 'The synthesis of the sources was convincing.'
  - id: de-DE-C2-ACADEMIC-001-004
    term: 'Schlussfolgerung'
    translation: 'conclusion'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Schlussfolgerung war logisch und gut begründet.'
    exampleTranslation: 'The conclusion was logical and well-founded.'
  - id: de-DE-C2-ACADEMIC-001-005
    term: 'Quellen'
    translation: 'sources'
    partOfSpeech: noun
    gender: n/a
    example: 'Er hat seine Quellen sorgfältig ausgewählt.'
    exampleTranslation: 'He has carefully selected his sources.'
  - id: de-DE-C2-ACADEMIC-001-006
    term: 'begründen'
    translation: 'to justify / to substantiate'
    partOfSpeech: verb
    gender: n/a
    example: 'Sie kann ihre Schlussfolgerungen gut begründen.'
    exampleTranslation: 'She can well justify her conclusions.'
grammar:
  - id: C2-ACADEMIC-001-GR01
    point: 'Presenting reasoned conclusions with sophisticated nuance'
    explanation: 'At C2, present conclusions by: using complex connectors with nuance (Aus der vorliegenden Analyse ergibt sich, dass...), referencing sources with critical evaluation (Laut [Author], wobei...), and expressing positions with deliberate hedging (Obwohl die Daten... sprechen, lässt sich festhalten, dass...).'
    examples:
      - 'Aus der vorliegenden Analyse ergibt sich, dass die Hypothese虽被证实, 但需限定范围.'
      - 'Obwohl die Daten für eine Tendenz sprechen, lässt sich kein kausaler Zusammenhang nachweisen.'
culturalNotes: 'German academic writing ("wissenschaftliches Arbeiten") at C2 follows strict conventions: "Masterplan" structure, clear thesis, systematic argumentation, and explicit engagement with sources ("Quellenarbeit") with critical evaluation.'
