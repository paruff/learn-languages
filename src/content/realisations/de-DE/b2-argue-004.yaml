grammar:
  - id: B2-ARGUE-004-GR01
    point: 'Sustaining viewpoints with supporting detail'
    explanation: 'At B2, sustain viewpoints by: stating the position (Meine Sichtweise ist...), providing evidence (Ich kann das belegen durch...), giving details (Einzelheiten dazu sind...), and reinforcing (Das untermauert meine Position).'
    examples:
      - 'Meine Sichtweise ist, dass die Wirtschaft wächst. Das kann ich belegen durch...'
      - 'Einzelheiten dazu finden Sie in meinem Bericht.'
culturalNotes: 'German academic writing values detailed evidence ("belegte Aussagen"); unsupported claims are immediately challenged in professional and academic discourse.'
