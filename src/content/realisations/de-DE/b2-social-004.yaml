vocabulary:
  - id: de-DE-B2-SOCIAL-004-001
    term: 'Standpunkt'
    translation: 'point of view'
    partOfSpeech: noun
    gender: masculine
    example: 'Ich möchte meinen Standpunkt klarstellen.'
    exampleTranslation: 'I would like to clarify my point of view.'
  - id: de-DE-B2-SOCIAL-004-002
    term: 'darlegen'
    translation: 'to explain / to present'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich lege meinen Standpunkt dar.'
    exampleTranslation: 'I explain my point of view.'
  - id: de-DE-B2-SOCIAL-004-003
    term: 'nachvollziehbar'
    translation: 'comprehensible / understandable'
    partOfSpeech: adjective
    gender: n/a
    example: 'Ihre Erklärung war nachvollziehbar.'
    exampleTranslation: 'Your explanation was comprehensible.'
  - id: de-DE-B2-SOCIAL-004-004
    term: 'klarstellen'
    translation: 'to clarify'
    partOfSpeech: verb
    gender: n/a
    example: 'Ich möchte das klarstellen.'
