grammar:
  - id: B2-SOCIAL-004-GR01
    point: 'Clarifying detailed points of view'
    explanation: 'At B2, clarify positions by: restating in simpler terms (Ich möchte das anders ausdrücken), providing examples (Ein konkretes Beispiel ist...), addressing misunderstandings (Das habe ich nicht so gemeint), and confirming understanding (Haben Sie das verstanden?).'
    examples:
      - 'Ich möchte das klarstellen. Gemeint ist, dass...'
      - 'Ein konkretes Beispiel ist die steigende Arbeitslosigkeit.'
culturalNotes: 'Germans value "Klarheit" (clarity) in communication; ambiguous statements are often challenged, and precise expression is expected.'
