nodeId: A1-REQUEST-001
lang: de-DE
vocabulary:
  - id: de-DE-A1-REQUEST-001-001
    concept: 'can-you-help-me'
    term: 'Können Sie mir helfen?'
    translation: 'Can you help me?'
    partOfSpeech: phrase
    example: 'Entschuldigung, können Sie mir helfen?'
    exampleTranslation: 'Excuse me, can you help me?'
  - id: de-DE-A1-REQUEST-001-002
    concept: 'i-would-like'
    term: 'Ich möchte...'
    translation: 'I would like...'
    partOfSpeech: phrase
    example: 'Ich möchte einen Kaffee bestellen.'
    exampleTranslation: 'I would like to order a coffee.'
  - id: de-DE-A1-REQUEST-001-003
    concept: 'please'
    term: 'Bitte'
    translation: 'Please'
    partOfSpeech: adverb
    example: 'Ein Wasser, bitte.'
    exampleTranslation: 'A water, please.'
  - id: de-DE-A1-REQUEST-001-004
    concept: 'thank-you'
    term: 'Danke'
    translation: 'Thank you'
    partOfSpeech: interjection
    example: 'Danke für Ihre Hilfe.'
    exampleTranslation: 'Thank you for your help.'
  - id: de-DE-A1-REQUEST-001-005
    concept: 'may-i'
    term: 'Darf ich...?'
    translation: 'May I...?'
    partOfSpeech: phrase
    example: 'Darf ich vorbei?'
    exampleTranslation: 'May I pass?'
  - id: de-DE-A1-REQUEST-001-006
    concept: 'can-you-repeat-that-please'
    term: 'Können Sie das bitte wiederholen?'
    translation: 'Can you repeat that, please?'
    partOfSpeech: phrase
    example: 'Können Sie das bitte langsamer sagen?'
    exampleTranslation: 'Can you say that more slowly, please?'
grammar: []
culturalNotes: 'Politeness is important in German; always use "Bitte" (please) and "Danke" (thank you). "Können Sie" is the polite form for requests.'
