grammar:
  - id: B1-TEXT-004-GR01
    point: 'Writing connected text on familiar topics'
    explanation: 'At B1, write coherent texts by: using topic sentences, logical connectors (deshalb, außerdem, aber), Präteritum for narration, and clear paragraph structure. Maintain focus on the topic throughout.'
    examples:
      - 'Ich interessiere mich für Sport. Deshalb mache ich jeden Tag Sport.'
      - 'Außerdem lese ich gerne Bücher über das Thema.'
culturalNotes: 'German written communication values "Klarheit" (clarity) and "Struktur" (structure); even informal emails follow a clear beginning-middle-end pattern.'
