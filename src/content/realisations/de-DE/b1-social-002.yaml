    partOfSpeech: phrase
    gender: n/a
    example: 'Bevor wir weitermachen, möchte ich mich vergewissern, dass ich alles verstanden habe.'
    exampleTranslation: 'Before we continue, I want to make sure that I have understood everything.'
grammar:
  - id: B1-SOCIAL-002-GR01
    point: 'Extended conversation on familiar topics'
    explanation: 'At B1, sustain conversation by: asking follow-up questions (Können Sie das genauer erklären?), expressing interest (Das klingt spannend!), sharing personal experiences, and using connectors (Außerdem, Deshalb).'
    examples:
      - 'Das klingt sehr interessant! Können Sie mir mehr erzählen?'
      - 'Ich habe auch eine ähnliche Erfahrung gemacht.'
culturalNotes: 'Germans appreciate conversational depth ("Tiefe des Gesprächs"); surface-level small talk is less common than in Anglo-Saxon cultures.'
