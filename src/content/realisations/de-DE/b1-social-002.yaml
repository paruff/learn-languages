    partOfSpeech: phrase
    gender: n/a
    example: 'Darf ich das Gehörte umformulieren, um zu prüfen, ob ich es verstanden habe?'
    exampleTranslation: 'May I rephrase what I heard to check that I understood it?'
  - id: de-DE-B1-SOCIAL-002-012
    concept: 'to-confirm-understanding'
    term: 'sich vergewissern, dass man verstanden hat'
