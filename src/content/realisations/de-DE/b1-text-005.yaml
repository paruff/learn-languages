grammar:
  - id: B1-TEXT-005-GR01
    point: 'Writing letters and emails describing experiences'
    explanation: 'At B1, write personal emails/letters with: greeting (Liebe/r...), body with experiences/impressions, and closing (Liebe Grüße). Use Perfekt for experiences, Präteritum for descriptions. Maintain informal/formal register as appropriate.'
    examples:
      - 'Liebe Maria, ich möchte dir von meiner Reise erzählen...'
      - 'Liebe Grüße, [Name]'
culturalNotes: 'German letter-writing follows formal conventions: "Sehr geehrte Damen und Herren" (formal), "Liebe/r..." (informal); the closing "Mit freundlichen Grüßen" is standard for business correspondence.'
