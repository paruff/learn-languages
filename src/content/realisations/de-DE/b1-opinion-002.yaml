    term: 'ich stimme voll und ganz zu'
    translation: 'I fully agree'
    partOfSpeech: phrase
    gender: n/a
    example: 'Dem, was du gesagt hast, stimme ich voll und ganz zu.'
    exampleTranslation: 'I fully agree with what you said.'
  - id: de-DE-B1-OPINION-002-008
    concept: 'i-disagree-with-your-point-of-view'
    term: 'ich teile Ihren Standpunkt nicht'
    translation: 'I disagree with your point of view'
