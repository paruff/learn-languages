vocabulary:
  - id: de-DE-B1-OPINION-002-001
    concept: 'i-agree'
    term: 'Dem stimme ich zu'
    translation: 'I agree'
    partOfSpeech: phrase
    gender: n/a
    example: 'Dem stimme ich völlig zu.'
    exampleTranslation: 'I completely agree.'
  - id: de-DE-B1-OPINION-002-002
