grammar:
  - id: B1-DISCOURSE-004-GR01
    point: 'Writing narratives with temporal markers'
    explanation: 'Written narratives use Präteritum (hatte, war, ging) with connectors like danach, anschließend, schließlich. Perfekt is acceptable in informal writing but Präteritum is standard for formal reports.'
    examples:
      - 'Es war ein sonniger Tag. Ich fuhr zum Strand.'
      - 'Danach ging ich ins Restaurant.'
culturalNotes: 'German writing at B1 level uses clear paragraph structure; each paragraph typically covers one time period or aspect of the narrative.'
