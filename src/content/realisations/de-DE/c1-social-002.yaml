    example: 'In förmlicher Umgebung wechselt er mit erstaunlicher Natürlichkeit das Register.'
    exampleTranslation: 'In a formal environment, he switches register with surprising naturalness.'
  - id: de-DE-C1-SOCIAL-002-008
