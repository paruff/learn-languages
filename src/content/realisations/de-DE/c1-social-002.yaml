grammar:
  - id: C1-SOCIAL-002-GR01
    point: 'Taking active part in discussions with nuanced expression'
    explanation: 'At C1, participate actively by: contributing nuanced opinions (Ich möchte einen Kommentar abgeben), asking for clarification (Können Sie das genauer erklären?), responding to others with complex structures, and managing turn-taking diplomatically.'
    examples:
      - 'Ich möchte einen Kommentar abgeben. Meiner Meinung nach...'
      - 'Das finde ich interessant. Können Sie das genauer erklären?'
culturalNotes: 'German discussions at C1 level value "Sachlichkeit" (objectivity) and "Fairness"; well-structured contributions with evidence are highly appreciated.'
