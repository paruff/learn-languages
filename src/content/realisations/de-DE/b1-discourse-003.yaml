nodeId: B1-DISCOURSE-003
lang: de-DE
vocabulary:
  - id: de-DE-B1-DISCOURSE-003-001
    concept: 'because'
    term: 'weil'
    translation: 'because'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Ich blieb zu Hause, weil es regnete.'
    exampleTranslation: 'I stayed home because it was raining.'
  - id: de-DE-B1-DISCOURSE-003-002
    concept: 'therefore'
    term: 'deshalb'
    translation: 'therefore'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Es regnete. Deshalb blieb ich zu Hause.'
    exampleTranslation: 'It was raining. Therefore, I stayed home.'
  - id: de-DE-B1-DISCOURSE-003-003
    concept: 'consequently'
    term: 'folglich'
    translation: 'consequently'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Er war krank. Folglich konnte er nicht kommen.'
    exampleTranslation: 'He was sick. Consequently, he could not come.'
  - id: de-DE-B1-DISCOURSE-003-004
    concept: 'to-lead-to'
    term: 'führen zu'
    translation: 'to lead to / to cause'
    partOfSpeech: verb
    gender: n/a
    example: 'Der Regen hat den Verkehr verursacht.'
    exampleTranslation: 'The rain caused the traffic.'
  - id: de-DE-B1-DISCOURSE-003-005
    concept: 'consequence'
    term: 'Folge'
    translation: 'consequence'
    partOfSpeech: noun
    gender: feminine
    example: 'Die Folgen waren ernst.'
    exampleTranslation: 'The consequences were serious.'
  - id: de-DE-B1-DISCOURSE-003-006
    concept: 'because-of'
    term: 'wegen'
    translation: 'because of'
    partOfSpeech: preposition
    gender: n/a
    example: 'Wegen des Regens blieb ich zu Hause.'
    exampleTranslation: 'Because of the rain, I stayed home.'
  - id: de-DE-B1-DISCOURSE-003-007
    concept: 'due-to'
    term: 'aufgrund'
    translation: 'due to'
    partOfSpeech: preposition
    gender: n/a
    example: 'Aufgrund des Regens wurde die Veranstaltung verschoben.'
    exampleTranslation: 'Due to the rain, the event was postponed.'
  - id: de-DE-B1-DISCOURSE-003-008
    concept: 'as-a-result'
    term: 'infolgedessen'
    translation: 'as a result'
    partOfSpeech: adverb
    gender: n/a
    example: 'Infolgedessen ist die Wirtschaft gewachsen.'
    exampleTranslation: 'As a result, the economy grew.'
  - id: de-DE-B1-DISCOURSE-003-009
    concept: 'this-led-to'
    term: 'das führte dazu, dass'
    translation: 'this led to'
    partOfSpeech: phrase
    gender: n/a
    example: 'Das führte dazu, dass wir neue Entdeckungen gemacht haben.'
    exampleTranslation: 'This led to us making new discoveries.'
  - id: de-DE-B1-DISCOURSE-003-010
    concept: 'the-cause-was'
    term: 'die Ursache war'
    translation: 'the cause was'
    partOfSpeech: phrase
    gender: n/a
    example: 'Die Ursache war die fehlende Kommunikation.'
    exampleTranslation: 'The cause was the lack of communication.'
grammar:
  - id: B1-DISCOURSE-003-GR01
    point: 'Cause and effect connectors'
    explanation: 'German expresses cause/effect with: weil + verb-final clause (spoken: verb-second), deshalb/folglich in main clauses, and wegen + dative for noun phrases. "Daraus folgt" introduces logical conclusions.'
    examples:
      - 'Weil es regnete, blieb ich zu Hause.'
      - 'Es regnete. Deshalb blieb ich zu Hause.'
culturalNotes: 'Germans value logical argumentation ("logisches Denken"); clearly articulating cause and effect is important in both academic and professional settings.'
