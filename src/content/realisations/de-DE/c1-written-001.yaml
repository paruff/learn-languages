vocabulary:
  - id: de-DE-C1-WRITTEN-001-007
    concept: 'to-adapt-the-register-to-the-reader'
    term: 'das Register dem Leser anpassen'
    translation: 'to adapt the register to the reader'
    partOfSpeech: phrase
    gender: n/a
    example: 'Der Kolumnist versteht es, das Register dem Zeitungsleser anzupassen.'
    exampleTranslation: 'The columnist knows how to adapt the register to the newspaper reader.'
  - id: de-DE-C1-WRITTEN-001-008
    concept: 'opinion-piece'
    term: 'der Meinungsbeitrag'
    translation: 'opinion piece'
    partOfSpeech: noun
    gender: masculine
    example: 'Der Meinungsbeitrag löste sofort eine Reaktion der Leser aus.'
    exampleTranslation: 'The opinion piece prompted an immediate response from readers.'
  - id: de-DE-C1-WRITTEN-001-009
