grammar:
  - id: B2-WRITTEN-002-GR01
    point: 'Writing essays or reports developing arguments'
    explanation: 'At B2, develop arguments in writing by: stating a clear thesis (Meine These ist...), providing supporting evidence (Ein Beispiel dafür ist...), addressing counterarguments (Einige würden sagen, dass... Abschließend...), and drawing conclusions.'
    examples:
      - 'Meine These ist, dass die Bildung wichtig ist. Ein Beispiel dafür ist...'
      - 'Abschließend lässt sich sagen, dass die Argumentation überzeugend war.'
culturalNotes: 'German essay writing ("Essayistik") values clear thesis development; the " These-Antithese-Synthese" pattern is a standard structure for argumentative texts.'
