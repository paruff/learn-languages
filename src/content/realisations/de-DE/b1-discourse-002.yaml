grammar:
  - id: B1-DISCOURSE-002-GR01
    point: 'Past tense narrative sequencing'
    explanation: 'When narrating events, German uses Perfekt (for spoken narratives) and Präteritum (for written). Time markers (zuerst, dann, schließlich) establish the sequence. The Perfekt with "haben" + past participle is dominant in spoken German.'
    examples:
      - 'Zuerst bin ich gegangen, dann habe ich gegessen.'
      - 'Schließlich bin ich nach Hause gefahren.'
culturalNotes: 'German narratives often follow a strict temporal order; "zuerst... dann... schließlich" is the standard structure for recounting events.'
