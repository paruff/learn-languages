grammar:
  - id: B2-SOCIAL-001-GR01
    point: 'Interacting with fluency and spontaneity'
    explanation: 'At B2, interact with fluency by: using natural connectors (Übrigens, Was meinst du dazu?), reacting spontaneously (Das finde ich spannend!), managing topic changes (Kommen wir zum nächsten Thema), and expressing nuanced views.'
    examples:
      - 'Übrigens, was meinst du dazu? Ich finde das sehr spannend.'
      - 'Kommen wir zum nächsten Thema. Wie siehst du die Situation?'
culturalNotes: 'Germans appreciate "flüssiges Gespräch" (fluid conversation); at B2 level, the ability to switch between formal and informal registers is valued.'
