grammar:
  - id: C2-WRITTEN-001-GR01
    point: 'Writing with stylistic sophistication and precision'
    explanation: 'At C2, write with: varied sentence structures for effect, sophisticated vocabulary choices, precise register control, and rhetorical devices like parallelism, antithesis, and chiasmus for emphasis.'
    examples:
      - 'Nicht die Menge, sondern die Qualität der Worte bestimmt den Wert eines Textes.'
      - 'Die Struktur des Textes folgt einer Logik, die den Leser Schritt für Schritt überzeugt.'
culturalNotes: 'German written texts at C2 level should demonstrate "Stilistik" (stylistic mastery): varied sentence structures, sophisticated vocabulary, and rhetorical elegance.'
