grammar:
  - id: C2-ACADEMIC-002-GR01
    point: 'Writing academic texts with nuanced critique and synthesis'
    explanation: 'At C2, write academic texts by: critiquing methodologies (Die Methodik weist Schwächen auf, weil...), synthesizing diverse sources (Die Synthese der Literatur zeigt...), and proposing original contributions (Dieser Beitrag leistet einen neuen Ansatz...).'
    examples:
      - 'Die Methodik weist Schwächen auf, weil sie nur quantitative Daten berücksichtigt.'
      - 'Dieser Beitrag leistet einen neuen Ansatz zur Erforschung von...'
culturalNotes: 'German academic discourse at C2 distinguishes between "These" (thesis), "Antithese" (antithesis), and "Synthese" (synthesis) — a triadic structure deeply rooted in Hegelian philosophy, requiring original contribution.'
