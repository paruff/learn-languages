vocabulary:
  - id: de-DE-B1-OPINION-001-001
    concept: 'in-my-opinion'
    term: 'meiner Meinung nach'
    translation: 'in my opinion'
    partOfSpeech: phrase
    gender: n/a
    example: 'Meiner Meinung nach ist das richtig.'
    exampleTranslation: 'In my opinion, that is correct.'
  - id: de-DE-B1-OPINION-001-002
    concept: 'i-believe'
    term: 'ich glaube'
    translation: 'I believe'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich glaube, dass das besser ist.'
    exampleTranslation: 'I believe that is better.'
  - id: de-DE-B1-OPINION-001-003
    concept: 'i-find'
    term: 'Ich finde'
    translation: 'I find'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich finde das sehr gut.'
    exampleTranslation: 'I find that very good.'
  - id: de-DE-B1-OPINION-001-004
    concept: 'because'
    term: 'denn'
    translation: 'because'
    partOfSpeech: conjunction
    gender: n/a
    example: 'Das ist gut, denn es hilft mir.'
    exampleTranslation: 'That is good, because it helps me.'
  - id: de-DE-B1-OPINION-001-005
    concept: 'i-think'
    term: 'Ich denke'
    translation: 'I think'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich denke, das ist eine gute Idee.'
    exampleTranslation: 'I think that is a good idea.'
  - id: de-DE-B1-OPINION-001-006
    concept: 'reasoning'
    term: 'Begründung'
    translation: 'reasoning / justification'
    partOfSpeech: noun
    gender: feminine
    example: 'Können Sie Ihre Begründung erklären?'
    exampleTranslation: 'Can you explain your reasoning?'
  - id: de-DE-B1-OPINION-001-007
    concept: 'i-think-that'
    term: 'ich denke, dass'
    translation: 'I think that'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich denke, dass wir mehr in Bildung investieren sollten.'
    exampleTranslation: 'I think that we should invest more in education.'
  - id: de-DE-B1-OPINION-001-008
    concept: 'it-seems-to-me-that'
    term: 'mir scheint, dass'
    translation: 'it seems to me that'
    partOfSpeech: phrase
    gender: n/a
    example: 'Mir scheint, dass diese Lösung die beste ist.'
    exampleTranslation: 'It seems to me that this solution is the best.'
  - id: de-DE-B1-OPINION-001-009
