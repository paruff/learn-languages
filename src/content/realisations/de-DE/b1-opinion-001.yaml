    gender: n/a
    example: 'Ich vertrete die Auffassung, dass alle Zugang zur Gesundheitsversorgung haben sollten.'
    exampleTranslation: 'I defend the idea that everyone should have access to healthcare.'
  - id: de-DE-B1-OPINION-001-010
