grammar:
  - id: C2-MODALITY-002-GR01
    point: 'Mastering indirect speech with Konjunktiv I'
    explanation: 'At C2, master indirect speech by: using Konjunktiv I for reported statements (Er sagte, er sei krank), handling complex reported speech with multiple clauses, and distinguishing between Konjunktiv I and II in reported speech.'
    examples:
      - 'Er sagte, er sei krank und könne nicht kommen.'
      - 'Sie berichtete, dass das Projekt abgeschlossen sei.'
culturalNotes: 'German Konjunktiv I at C2 level is essential for academic and journalistic writing; mastering indirect speech ("indirekte Rede") is a mark of linguistic sophistication.'
