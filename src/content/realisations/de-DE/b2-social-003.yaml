    translation: 'to defend my position'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich kann meine Position mit stichhaltigen Argumenten verteidigen.'
    exampleTranslation: 'I can defend my position with solid arguments.'
  - id: de-DE-B2-SOCIAL-003-008
