    term: 'die Entscheidung begründen'
    translation: 'to justify the decision'
    partOfSpeech: phrase
    gender: n/a
    example: 'Ich muss meine Entscheidung mit Fakten begründen.'
    exampleTranslation: 'I need to justify my decision with facts.'
  - id: de-DE-B2-SOCIAL-003-009
    concept: 'to-sustain-the-opinion'
    term: 'die Meinung untermauern'
    translation: 'to sustain the opinion'
    partOfSpeech: phrase
    gender: n/a
    example: 'Es ist wichtig, die Meinung mit Beispielen zu untermauern.'
    exampleTranslation: 'It is important to sustain the opinion with examples.'
  - id: de-DE-B2-SOCIAL-003-010
