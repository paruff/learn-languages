nodeId: A1-INTRO-001
lang: de-DE
vocabulary:
  - id: de-DE-A1-INTRO-001-001
    term: 'Ich heiße'
    translation: 'My name is'
    partOfSpeech: phrase
    example: 'Ich heiße Anna.'
    exampleTranslation: 'My name is Anna.'
  - id: de-DE-A1-INTRO-001-002
    term: 'Freut mich'
    translation: 'Nice to meet you'
    partOfSpeech: interjection
    example: 'Freut mich, Sie kennenzulernen.'
    exampleTranslation: 'Nice to meet you (literally: pleases me to get to know you).'
grammar:
  - id: de-DE-A1-INTRO-001-G1
    point: 'Formal vs. informal address (du/Sie)'
    explanation: "German distinguishes informal 'du' from formal 'Sie'. Use 'Sie' with strangers, elders, and professional contexts."
    examples:
      - 'Wie heißt du? (informal)'
      - 'Wie heißen Sie? (formal)'
