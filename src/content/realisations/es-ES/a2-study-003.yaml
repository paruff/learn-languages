    partOfSpeech: phrase
    gender: masculine
    example: 'El texto académico es difícil de entender.'
    exampleTranslation: 'The academic text is difficult to understand.'
  - id: es-ES-A2-STUDY-003-002
    term: 'manual'
    translation: 'textbook'
    partOfSpeech: noun
    gender: masculine
    example: 'Necesito comprar el manual de matemáticas.'
    exampleTranslation: 'I need to buy the maths textbook.'
  - id: es-ES-A2-STUDY-003-003
    term: 'resumen'
    translation: 'summary'
