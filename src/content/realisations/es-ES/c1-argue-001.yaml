    translation: 'complex subject'
    partOfSpeech: phrase
    gender: masculine
    example: 'Puedo describir temas complejos con claridad.'
    exampleTranslation: 'I can describe complex subjects clearly.'
  - id: es-ES-C1-ARGUE-001-002
    concept: 'sub-themes'
    term: 'subtemas'
    translation: 'sub-themes'
    partOfSpeech: noun
    gender: masculine
    example: 'Integro subtemas de forma natural en mis exposiciones.'
    exampleTranslation: 'I integrate sub-themes naturally in my presentations.'
  - id: es-ES-C1-ARGUE-001-003
    concept: 'to-develop-particular-aspects'
    term: 'desarrollar aspectos concretos'
    translation: 'to develop particular aspects'
    partOfSpeech: phrase
    example: 'Es importante desarrollar aspectos concretos del tema.'
    exampleTranslation: 'It is important to develop particular aspects of the topic.'
  - id: es-ES-C1-ARGUE-001-004
    concept: 'detailed-description'
    term: 'descripción detallada'
    translation: 'detailed description'
    partOfSpeech: phrase
    gender: feminine
    example: 'Ofrezco descripciones detalladas y bien estructuradas.'
    exampleTranslation: 'I offer detailed and well-structured descriptions.'
  - id: es-ES-C1-ARGUE-001-005
    concept: 'to-integrate'
    term: 'integrar'
    translation: 'to integrate'
    partOfSpeech: verb
    example: 'Integro diferentes perspectivas en mi análisis.'
    exampleTranslation: 'I integrate different perspectives in my analysis.'
  - id: es-ES-C1-ARGUE-001-006
    concept: 'appropriate-conclusion'
    term: 'conclusión apropiada'
    translation: 'appropriate conclusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Cierro con una conclusión apropiada y bien fundamentada.'
    exampleTranslation: 'I close with an appropriate and well-founded conclusion.'
  - id: es-ES-C1-ARGUE-001-007
    concept: 'to-develop-sub-topics'
    term: 'desarrollar subtemas'
    translation: 'to develop sub-topics'
    partOfSpeech: phrase
    example: 'El orador desarrolló los subtemas con una coherencia envidiable.'
    exampleTranslation: 'The speaker developed the sub-topics with enviable coherence.'
  - id: es-ES-C1-ARGUE-001-008
    concept: 'to-structure-the-presentation'
    term: 'estructurar la exposición'
    translation: 'to structure the presentation'
    partOfSpeech: phrase
    example: 'Saber estructurar la exposición es esencial para mantener la atención.'
    exampleTranslation: 'Knowing how to structure the presentation is essential for keeping attention.'
  - id: es-ES-C1-ARGUE-001-009
    concept: 'to-elaborate-the-points'
    term: 'ahondar en los puntos'
    translation: 'to elaborate the points'
    partOfSpeech: phrase
    example: 'Tras la introducción, ahondó en los puntos más polémicos del asunto.'
    exampleTranslation: 'After the introduction, he went into depth on the most controversial points of the issue.'
  - id: es-ES-C1-ARGUE-001-010
    concept: 'to-establish-connections'
    term: 'establecer conexiones'
    translation: 'to establish connections'
    partOfSpeech: phrase
    example: 'Destacó la manera en que estableció conexiones entre los distintos temas.'
    exampleTranslation: 'The way he established connections between the various topics stood out.'
  - id: es-ES-C1-ARGUE-001-011
    concept: 'to-present-an-overview'
    term: 'presentar una visión de conjunto'
    translation: 'to present an overview'
    partOfSpeech: phrase
    example: 'Al principio presentó una visión de conjunto del problema.'
    exampleTranslation: 'At the start, he presented an overview of the problem.'
  - id: es-ES-C1-ARGUE-001-012
    concept: 'to-give-depth'
    term: 'dar profundidad'
    translation: 'to give depth'
    partOfSpeech: phrase
    example: 'Los ejemplos históricos dieron profundidad a la exposición.'
    exampleTranslation: 'The historical examples gave depth to the exposition.'
grammar:
  - id: es-ES-C1-ARGUE-001-G1
    point: 'Relative clauses with "donde" for abstract reference'
    explanation: "Use 'donde' for abstract reference: 'Es justo donde radica el problema' (That is precisely where the problem lies)."
    examples:
      - 'El argumento central reside en donde más se contradicen.'
      - 'La clave está donde menos se espera.'
    cefrNotes: 'C1 learners use abstract relative clauses for nuanced argumentation'
culturalNotes: 'Describing complex subjects at C1 level requires the ability to structure detailed descriptions with sub-themes, develop particular aspects, and conclude appropriately while maintaining coherence.'
