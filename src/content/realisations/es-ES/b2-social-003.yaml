nodeId: B2-SOCIAL-003
lang: es-ES
vocabulary:
  - id: es-ES-B2-SOCIAL-003-007
    concept: to-defend-my-position
    term: argumentar
    translation: to defend my position
    partOfSpeech: verb
    example: Puedo argumentar mi punto de vista con claridad.
    exampleTranslation: I can argue my point of view clearly.
    gender: n/a
  - id: es-ES-B2-SOCIAL-003-008
    concept: to-justify-the-decision
    term: explicación detallada
    translation: to justify the decision
    partOfSpeech: phrase
    gender: feminine
    example: Doy explicaciones detalladas para sostener mis opiniones.
    exampleTranslation: I give detailed explanations to sustain my opinions.
  - id: es-ES-B2-SOCIAL-003-009
    concept: to-sustain-the-opinion
    term: persuadir
    translation: to sustain the opinion
    partOfSpeech: verb
    example: Intento persuadir con argumentos, no con emociones.
    exampleTranslation: I try to persuade with arguments, not emotions.
    gender: n/a
  - id: es-ES-B2-SOCIAL-003-010
    concept: to-present-reasons
    term: convencer
    translation: to present reasons
    partOfSpeech: verb
    example: Es difícil convencer a alguien que no quiere escuchar.
    exampleTranslation: It is difficult to convince someone who doesn't want to listen.
    gender: n/a
  - id: es-ES-B2-SOCIAL-003-011
    concept: to-explain-the-reasoning
    term: postura
    translation: to explain the reasoning
    partOfSpeech: noun
    gender: feminine
    example: Mi postura sobre el tema está bien definida.
    exampleTranslation: My position on the topic is well defined.
  - id: es-ES-B2-SOCIAL-003-012
    concept: to-partially-agree
    term: reafirmar
    translation: to partially agree
    partOfSpeech: verb
    example: Reafirmo mi opinión con nuevos datos.
    exampleTranslation: I reaffirm my opinion with new data.
    gender: n/a
grammar:
  - id: es-ES-B2-SOCIAL-003-G1
    point: Purpose clauses with "para que" + subjunctive
    explanation: "Use 'para que' + subjunctive to express purpose: 'Argumento para que se entienda mi posición' (I argue so that my position is understood)."
    examples:
      - Explico detalladamente para que quede claro.
      - Doy ejemplos para que el argumento sea convincente.
    cefrNotes: B2 learners use purpose clauses with subjunctive to explain reasoning
culturalNotes: Sustaining views with explanations and arguments is a key B2 skill. Spanish speakers at this level can participate in extended discussions with well-reasoned positions.
