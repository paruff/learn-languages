nodeId: C1-ACADEMIC-001
lang: es-ES
vocabulary:
  # REVIEW #185 (B): Pre-existing item. "disertación" glossed "dissertation": false friend (see B2-SPOKEN-001-004). Consider: tesina / trabajo de fin de máster.
  - id: es-ES-C1-ACADEMIC-001-001
    concept: 'dissertation'
    term: 'disertación'
    translation: 'dissertation'
    partOfSpeech: noun
    gender: feminine
    example: 'Escribí una disertación sobre la historia de España.'
    exampleTranslation: 'I wrote a dissertation on the history of Spain.'
  - id: es-ES-C1-ACADEMIC-001-002
    concept: 'sources-consulted'
    term: 'fuentes consultadas'
    translation: 'sources consulted'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las fuentes consultadas son variadas y fiables.'
    exampleTranslation: 'The sources consulted are varied and reliable.'
  - id: es-ES-C1-ACADEMIC-001-003
    concept: 'reasoned-conclusion'
    term: 'conclusión razonada'
    translation: 'reasoned conclusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'La conclusión razonada del informe es convincente.'
    exampleTranslation: "The report's reasoned conclusion is convincing."
  - id: es-ES-C1-ACADEMIC-001-004
    concept: 'solid-argumentation'
    term: 'argumentación sólida'
    translation: 'solid argumentation'
    partOfSpeech: phrase
    gender: feminine
    example: 'Su argumentación sólida respalda toda la tesis.'
    exampleTranslation: 'His solid argumentation supports the entire thesis.'
  - id: es-ES-C1-ACADEMIC-001-005
    concept: 'exhaustive'
    term: 'exhaustivo'
    translation: 'exhaustive'
    partOfSpeech: adjective
    gender: masculine
    example: 'El análisis exhaustivo cubre todos los aspectos.'
    exampleTranslation: 'The exhaustive analysis covers all aspects.'
  - id: es-ES-C1-ACADEMIC-001-006
    concept: 'academic-rigour'
    term: 'rigor académico'
    translation: 'academic rigour'
    partOfSpeech: phrase
    gender: masculine
    example: 'El rigor académico es esencial en una disertación.'
    exampleTranslation: 'Academic rigour is essential in a dissertation.'
  # REVIEW #185 (B): "tesis académica" for "academic dissertation": Spain distinguishes tesina, trabajo de fin de grado or máster, and tesis doctoral. Consider: tesina.
  - id: es-ES-C1-ACADEMIC-001-007
    concept: 'academic-dissertation'
    term: 'tesis académica'
    translation: 'academic dissertation'
    partOfSpeech: phrase
    gender: feminine
    example: 'La tesis académica articula teoría y datos empíricos.'
    exampleTranslation: 'The academic dissertation articulates theory and empirical data.'
  - id: es-ES-C1-ACADEMIC-001-008
    concept: 'body-of-sources'
    term: 'corpus de fuentes'
    translation: 'body of sources'
    partOfSpeech: phrase
    gender: masculine
    example: 'El corpus de fuentes consultadas es amplio y fiable.'
    exampleTranslation: 'The body of sources consulted is broad and reliable.'
  - id: es-ES-C1-ACADEMIC-001-009
    concept: 'theoretical-framework'
    term: 'marco teórico'
    translation: 'theoretical framework'
    partOfSpeech: phrase
    gender: masculine
    example: 'El marco teórico sustenta todo el análisis posterior.'
    exampleTranslation: 'The theoretical framework underpins all subsequent analysis.'
  # REVIEW #185 (C): "recabar pruebas" with a chapter as subject. Consider: reunir pruebas.
  - id: es-ES-C1-ACADEMIC-001-010
    concept: 'to-gather-evidence'
    term: 'recabar pruebas'
    translation: 'to gather evidence'
    partOfSpeech: phrase
    example: 'El segundo capítulo recaba pruebas decisivas para la hipótesis.'
    exampleTranslation: 'Chapter two gathers decisive evidence for the hypothesis.'
  - id: es-ES-C1-ACADEMIC-001-011
    concept: 'to-synthesise-the-findings'
    term: 'sintetizar los hallazgos'
    translation: 'to synthesise the findings'
    partOfSpeech: phrase
    example: 'La conclusión sintetiza los hallazgos de los autores estudiados.'
    exampleTranslation: 'The conclusion synthesises the findings of the authors studied.'
  - id: es-ES-C1-ACADEMIC-001-012
    concept: 'original-contribution'
    term: 'aportación original'
    translation: 'original contribution'
    partOfSpeech: phrase
    gender: feminine
    example: 'La aportación original del trabajo reside en la comparación inédita.'
    exampleTranslation: 'The original contribution of the work lies in the unprecedented comparison.'
grammar:
  - id: es-ES-C1-ACADEMIC-001-G1
    point: 'Complex conditional structures with "de haber + past participle"'
    explanation: "Use perfect subjunctive in conditional structures: 'De haber consultado más fuentes, la conclusión sería diferente' (Had more sources been consulted, the conclusion would be different)."
    examples:
      - 'De haber profundizado más, el resultado habría sido más completo.'
      - 'De no haber sido tan exhaustivo, habría omitido detalles clave.'
    cefrNotes: 'C1 learners use perfect subjunctive in formal academic writing'
culturalNotes: 'Spanish academic writing at C1 level demonstrates mastery of formal register, complex sentence structures, and the ability to engage critically with sources while presenting a reasoned conclusion.'
