    concept: overall-comprehension
    term: reconstruir argumentos
    translation: overall comprehension
    partOfSpeech: phrase
    example: Sé reconstruir argumentos complejos de forma coherente.
    exampleTranslation: I know how to reconstruct complex arguments coherently.
    gender: n/a
  - id: es-ES-C2-MODALITY-004-008
    concept: synthesis-of-information
    term: resumir
    translation: synthesis of information
    partOfSpeech: verb
    example: Puedo resumir información compleja de forma precisa.
    exampleTranslation: I can summarise complex information precisely.
    gender: n/a
  - id: es-ES-C2-MODALITY-004-001
    concept: diverse-sources
    term: fuentes diversas
    translation: diverse sources
    partOfSpeech: phrase
    gender: feminine
    example: Puedo sintetizar información de fuentes diversas.
    exampleTranslation: I can synthesise information from diverse sources.
  - id: es-ES-C2-MODALITY-004-009
    concept: reconstruct-arguments
    term: síntesis
