grammar:
  - id: es-ES-C2-MODALITY-004-G1
    point: Participial clauses for synthesis in reading
    explanation: "Use participial clauses for synthesis: 'Habiendo analizado todas las fuentes, puedo presentar una síntesis completa' (Having analysed all the sources, I can present a complete synthesis)."
    examples:
      - Habiendo leído el texto completo, reconstruyo la línea argumentativa.
      - Habiendo analizado los datos, presento una síntesis coherente.
    cefrNotes: C2 learners use participial clauses for advanced synthesis in reading
culturalNotes: Summarising and synthesising information from different sources at C2 level demonstrates the highest level of reading comprehension and the ability to reconstruct arguments in a coherent presentation.
