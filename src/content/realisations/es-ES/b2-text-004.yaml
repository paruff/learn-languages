vocabulary:
  - id: es-ES-B2-TEXT-004-007
    concept: to-understand-conclusions-of-argumentative-texts
    term: texto argumentativo
    translation: to understand conclusions of argumentative texts
    partOfSpeech: phrase
    gender: masculine
    example: El texto argumentativo presenta una tesis clara.
    exampleTranslation: The argumentative text presents a clear thesis.
  - id: es-ES-B2-TEXT-004-008
    concept: to-identify-conclusion-markers
    term: conclusión
    translation: to identify conclusion markers
    partOfSpeech: noun
    gender: feminine
    example: Las conclusiones del texto están bien fundamentadas.
    exampleTranslation: The conclusions of the text are well founded.
  - id: es-ES-B2-TEXT-004-009
    concept: to-synthesise-the-main-ideas
    term: señalización
    translation: to synthesise the main ideas
    partOfSpeech: noun
    gender: feminine
    example: La buena señalización del texto facilita la lectura.
    exampleTranslation: Good signposting in the text facilitates reading.
  - id: es-ES-B2-TEXT-004-010
    concept: to-evaluate-the-conclusion
    term: desarrollo argumentativo
    translation: to evaluate the conclusion
    partOfSpeech: phrase
    gender: masculine
    example: El desarrollo argumentativo es claro y lógico.
    exampleTranslation: The argumentative development is clear and logical.
  - id: es-ES-B2-TEXT-004-011
    concept: to-relate-conclusion-with-premises
    term: identificar conclusiones
    translation: to relate conclusion with premises
    partOfSpeech: phrase
    example: Puedo identificar conclusiones en textos argumentativos.
    exampleTranslation: I can identify conclusions in argumentative texts.
    gender: n/a
  - id: es-ES-B2-TEXT-004-012
