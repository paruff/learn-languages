vocabulary:
  - id: es-ES-B1-OPINION-003-001
    concept: 'advantage'
    term: 'ventaja'
    translation: 'advantage'
    partOfSpeech: noun
    gender: feminine
    example: 'Las ventajas de este método son evidentes.'
    exampleTranslation: 'The advantages of this method are clear.'
  - id: es-ES-B1-OPINION-003-002
    concept: 'disadvantage'
    term: 'desventaja'
    translation: 'disadvantage'
    partOfSpeech: noun
    gender: feminine
    example: 'La principal desventaja es el coste.'
    exampleTranslation: 'The main disadvantage is the cost.'
  - id: es-ES-B1-OPINION-003-003
    concept: 'to-compare'
    term: 'comparar'
    translation: 'to compare'
    partOfSpeech: verb
    example: 'Vamos a comparar las opciones disponibles.'
    exampleTranslation: "Let's compare the available options."
  - id: es-ES-B1-OPINION-003-004
    concept: 'on-one-hand'
    term: 'por una parte'
    translation: 'on one hand'
    partOfSpeech: phrase
    example: 'Por una parte es barato; por otra, de baja calidad.'
    exampleTranslation: 'On one hand it is cheap; on the other, low quality.'
  - id: es-ES-B1-OPINION-003-005
    concept: 'on-the-other-hand'
    term: 'por otra parte'
    translation: 'on the other hand'
    partOfSpeech: phrase
    example: 'Por otra parte, también hay aspectos positivos.'
    exampleTranslation: 'On the other hand, there are also positive aspects.'
  - id: es-ES-B1-OPINION-003-006
    concept: 'to-assess'
    term: 'valorar'
    translation: 'to assess / to value'
    partOfSpeech: verb
    example: 'Hay que valorar tanto ventajas como desventajas.'
    exampleTranslation: 'We must assess both advantages and disadvantages.'
  - id: es-ES-B1-OPINION-003-007
    concept: 'the-advantages-are'
    term: 'las ventajas son'
    translation: 'the advantages are'
    partOfSpeech: phrase
    example: 'Las ventajas son económicas y medioambientales.'
    exampleTranslation: 'The advantages are economic and environmental.'
  - id: es-ES-B1-OPINION-003-008
    concept: 'the-disadvantages-are'
    term: 'las desventajas son'
    translation: 'the disadvantages are'
    partOfSpeech: phrase
    example: 'Las desventajas son el coste y el tiempo.'
    exampleTranslation: 'The disadvantages are the cost and the time.'
  - id: es-ES-B1-OPINION-003-009
    concept: 'on-the-one-hand-on-the-other-hand'
    term: 'por un lado... por otro'
    translation: 'on the one hand... on the other hand'
    partOfSpeech: phrase
    example: 'Por un lado es bueno; por otro, hay riesgos.'
    exampleTranslation: 'On the one hand it is good, on the other hand there are risks.'
  - id: es-ES-B1-OPINION-003-010
    concept: 'a-positive-aspect'
    term: 'un aspecto positivo'
    translation: 'a positive aspect'
    partOfSpeech: phrase
    gender: masculine
    example: 'Un aspecto positivo es la sostenibilidad.'
    exampleTranslation: 'A positive aspect is sustainability.'
  - id: es-ES-B1-OPINION-003-011
    concept: 'a-negative-aspect'
    term: 'un aspecto negativo'
    translation: 'a negative aspect'
    partOfSpeech: phrase
    gender: masculine
    example: 'Un aspecto negativo es el alto coste.'
    exampleTranslation: 'A negative aspect is the high cost.'
  - id: es-ES-B1-OPINION-003-012
    concept: 'overall'
    term: 'en general'
    translation: 'overall'
    partOfSpeech: phrase
    example: 'En general, creo que es una buena idea.'
    exampleTranslation: 'Overall, I think it is a good idea.'
grammar:
  - id: es-ES-B1-OPINION-003-G1
    point: 'Comparative structures for advantages and disadvantages'
    explanation: "Use 'más...que' (more...than), 'menos...que' (less...than), 'tan...como' (as...as) for comparisons. Use 'por una parte...por otra' to present contrasting points."
    examples:
      - 'La vida en la ciudad es más conveniente que en el campo.'
      - 'Esta opción tiene tantas ventajas como desventajas.'
    cefrNotes: 'B1 learners use comparative structures and contrastive connectors'
culturalNotes: 'Spanish argumentative writing often uses a balanced structure: presenting advantages first, then disadvantages, before reaching a conclusion. This mirrors academic conventions in Spanish-speaking countries.'
