vocabulary:
  - id: es-ES-B1-DISCOURSE-005-007
    concept: brief-report
    term: informe
    translation: brief report
    partOfSpeech: noun
    gender: masculine
    example: Escribí un informe sobre mi experiencia laboral.
    exampleTranslation: I wrote a report about my work experience.
  - id: es-ES-B1-DISCOURSE-005-008
    concept: to-summarise-the-facts
    term: experiencia
    translation: to summarise the facts
    partOfSpeech: noun
    gender: feminine
    example: Compartí mi experiencia en el proyecto.
    exampleTranslation: I shared my experience in the project.
  - id: es-ES-B1-DISCOURSE-005-009
    concept: to-describe-the-situation
    term: describir
    translation: to describe the situation
    partOfSpeech: verb
    example: Puedo describir experiencias de forma detallada.
    exampleTranslation: I can describe experiences in detail.
    gender: n/a
  - id: es-ES-B1-DISCOURSE-005-010
    concept: to-do-an-analysis
    term: resultado
    translation: to do an analysis
    partOfSpeech: noun
    gender: masculine
    example: Los resultados del informe fueron positivos.
    exampleTranslation: The results of the report were positive.
  - id: es-ES-B1-DISCOURSE-005-011
    concept: to-draw-conclusions
    term: redactar
    translation: to draw conclusions
    partOfSpeech: verb
    example: Necesito redactar el informe para el lunes.
    exampleTranslation: I need to draft the report for Monday.
    gender: n/a
  - id: es-ES-B1-DISCOURSE-005-012
