grammar:
  - id: es-ES-B1-DISCOURSE-005-G1
    point: 'Report structures with "poner en" + noun'
    explanation: "Use formal report structures: 'poner en práctica' (to put into practice), 'poner de manifiesto' (to highlight), 'poner en evidencia' (to demonstrate)."
    examples:
      - 'El informe pone de manifiesto la necesidad de cambios.'
      - 'Los datos ponen en evidencia una tendencia positiva.'
    cefrNotes: 'B1 learners use formal report structures for written expression'
culturalNotes: 'Spanish professional reports follow a structured format: introduction, development, conclusions, and recommendations. The register should be formal and objective.'
