    term: 'me parece que'
    translation: 'it seems to me that'
    partOfSpeech: phrase
    example: 'Me parece que esta solución es la mejor.'
    exampleTranslation: 'It seems to me that this solution is the best.'
  - id: es-ES-B1-OPINION-001-010
