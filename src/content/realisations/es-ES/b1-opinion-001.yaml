    translation: 'in my opinion'
    partOfSpeech: phrase
    example: 'En mi opinión, el cine español es muy interesante.'
    exampleTranslation: 'In my opinion, Spanish cinema is very interesting.'
  - id: es-ES-B1-OPINION-001-008
