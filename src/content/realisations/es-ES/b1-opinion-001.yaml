    exampleTranslation: 'I am of the opinion that we need changes.'
grammar:
  - id: es-ES-B1-OPINION-001-G1
    point: 'Expressing opinions with "creo que" + indicative vs. subjunctive'
    explanation: "Use 'creo que' + indicative for beliefs: 'Creo que es importante.' Use 'no creo que' + subjunctive for doubt: 'No creo que sea correcto.'"
    examples:
      - 'Creo que la educación es fundamental.'
      - 'No creo que sea la mejor opción.'
    cefrNotes: 'B1 learners distinguish indicative after positive opinion verbs, subjunctive after negatives'
culturalNotes: 'In Spanish culture, expressing opinions directly is common and expected. The subjunctive after opinion verbs is a key B1 grammar point that distinguishes intermediate from beginner learners.'
