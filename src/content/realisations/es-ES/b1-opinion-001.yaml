  - id: es-ES-B1-OPINION-001-004
    concept: 'to-justify'
    term: 'justificar'
    translation: 'to justify'
    partOfSpeech: verb
    example: 'Debes justificar tu respuesta con ejemplos.'
    exampleTranslation: 'You must justify your answer with examples.'
  - id: es-ES-B1-OPINION-001-005
