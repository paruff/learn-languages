nodeId: B1-OPINION-001
lang: es-ES
vocabulary:
  - id: es-ES-B1-OPINION-001-007
    concept: in-my-opinion
    term: opinión
    translation: in my opinion
    partOfSpeech: noun
    gender: feminine
    example: Mi opinión es que debemos seguir adelante.
    exampleTranslation: My opinion is that we should move forward.
  - id: es-ES-B1-OPINION-001-008
    concept: i-think-that
    term: razón
    translation: I think that
    partOfSpeech: noun
    gender: feminine
    example: Tengo mis razones para pensar así.
    exampleTranslation: I have my reasons for thinking that way.
  - id: es-ES-B1-OPINION-001-009
    concept: it-seems-to-me-that
    term: defender
    translation: it seems to me that
    partOfSpeech: verb
    example: Es importante defender tus ideas con respeto.
    exampleTranslation: It is important to defend your ideas with respect.
    gender: n/a
  - id: es-ES-B1-OPINION-001-010
    concept: i-defend-the-idea-that
    term: justificar
    translation: I defend the idea that
    partOfSpeech: verb
    example: Debes justificar tu respuesta con ejemplos.
    exampleTranslation: You must justify your answer with examples.
    gender: n/a
  - id: es-ES-B1-OPINION-001-011
    concept: i-am-sure-that
    term: argumento
    translation: I am sure that
    partOfSpeech: noun
    gender: masculine
    example: Presentó un argumento muy convincente.
    exampleTranslation: He presented a very convincing argument.
  - id: es-ES-B1-OPINION-001-012
    concept: i-am-of-the-opinion-that
    term: persuadir
    translation: I am of the opinion that
    partOfSpeech: verb
    example: Intenté persuadir a los demás con datos.
