grammar:
  - id: es-ES-C1-PROFESSIONAL-002-G1
    point: 'Passive with "se" in formal professional documents'
    explanation: "Use 'se' passive in formal professional documents: 'Se recomienda revisar el documento' (It is recommended to review the document), 'Se sugiere implementar cambios' (It is suggested to implement changes)."
    examples:
      - 'Se recomienda una revisión exhaustiva del informe.'
      - 'Se sugiere que los participantes preparen sus intervenciones.'
    cefrNotes: 'C1 learners use passive constructions in formal professional writing'
culturalNotes: 'Writing formal professional documents at C1 level requires mastery of formal register, clear structure, and the ability to highlight decisive points while maintaining a professional tone.'
