    term: documento formal
    translation: formal document / detailed report
    partOfSpeech: phrase
    gender: masculine
    example: Redacto documentos formales con registro profesional.
    exampleTranslation: I draft formal documents with professional register.
  - id: es-ES-C1-PROFESSIONAL-002-008
