grammar:
  - id: es-ES-C1-SPOKEN-005-G1
    point: Periphrastic future in media comprehension
    explanation: "Use periphrastic future for media comprehension: 'Va a salir un nuevo documental' (A new documentary is going to air), 'Van a transmitir el partido' (They are going to broadcast the match)."
    examples:
      - Van a estrenar una nueva serie en la tele.
      - Mañana va a haber un documental interesante.
    cefrNotes: C1 learners use periphrastic future for media-related comprehension
culturalNotes: Understanding television and films at C1 level without too much effort demonstrates advanced listening comprehension, including the ability to follow different registers, accents, and cultural references in media content.
