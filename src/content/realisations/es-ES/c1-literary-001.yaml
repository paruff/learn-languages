nodeId: C1-LITERARY-001
lang: es-ES
vocabulary:
  - id: es-ES-C1-LITERARY-001-001
    concept: 'implicit-layer'
    term: 'capa implícita'
    translation: 'implicit layer'
    partOfSpeech: phrase
    gender: feminine
    example: 'El texto tiene capas implícitas de significado.'
    exampleTranslation: 'The text has implicit layers of meaning.'
  - id: es-ES-C1-LITERARY-001-002
    concept: 'allusion'
    term: 'alusión'
    translation: 'allusion'
    partOfSpeech: noun
    gender: feminine
    example: 'La alusión histórica enriquece el texto.'
    exampleTranslation: 'The historical allusion enriches the text.'
  - id: es-ES-C1-LITERARY-001-003
    concept: 'irony'
    term: 'ironía'
    translation: 'irony'
    partOfSpeech: noun
    gender: feminine
    example: 'La ironía del autor es sutil pero efectiva.'
    exampleTranslation: "The author's irony is subtle but effective."
  - id: es-ES-C1-LITERARY-001-004
    concept: 'cultural-reference'
    term: 'referencia cultural'
    translation: 'cultural reference'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las referencias culturales son abundantes en la literatura.'
    exampleTranslation: 'Cultural references are abundant in literature.'
  - id: es-ES-C1-LITERARY-001-005
    concept: 'subtext'
    term: 'subtexto'
    translation: 'subtext'
    partOfSpeech: noun
    gender: masculine
    example: 'El subtexto de la novela es más rico que la trama.'
    exampleTranslation: 'The subtext of the novel is richer than the plot.'
  - id: es-ES-C1-LITERARY-001-006
    concept: 'to-interpret'
    term: 'interpretar'
    translation: 'to interpret'
    partOfSpeech: verb
    example: 'Sé interpretar las capas implícitas de un texto.'
    exampleTranslation: 'I know how to interpret the implicit layers of a text.'
  - id: es-ES-C1-LITERARY-001-007
    concept: 'layers-of-meaning'
    term: 'capas de significado'
    translation: 'layers of meaning'
    partOfSpeech: phrase
    gender: feminine
    example: 'El poema revela capas de significado con cada relectura.'
    exampleTranslation: 'The poem reveals layers of meaning with every re-reading.'
  # REVIEW #185 (C): "metáfora continuada" exists as a term; "metáfora extendida" is also used.
  - id: es-ES-C1-LITERARY-001-008
    concept: 'extended-metaphor'
    term: 'metáfora continuada'
    translation: 'extended metaphor'
    partOfSpeech: phrase
    gender: feminine
    example: 'La metáfora continuada recorre toda la novela.'
    exampleTranslation: 'The extended metaphor runs through the whole novel.'
  - id: es-ES-C1-LITERARY-001-009
    concept: 'cultural-resonance'
    term: 'resonancia cultural'
    translation: 'cultural resonance'
    partOfSpeech: phrase
    gender: feminine
    example: 'La resonancia cultural del cuento se les escapa a los lectores extranjeros.'
    exampleTranslation: 'The cultural resonance of the tale escapes foreign readers.'
  - id: es-ES-C1-LITERARY-001-010
    concept: 'narrative-voice'
    term: 'voz narrativa'
    translation: 'narrative voice'
    partOfSpeech: phrase
    gender: feminine
    example: 'La voz narrativa se aparta del clásico narrador omnisciente.'
    exampleTranslation: 'The narrative voice distances itself from the classic omniscient narrator.'
  - id: es-ES-C1-LITERARY-001-011
    concept: 'to-weave-the-references-together'
    term: 'entretejer las referencias'
    translation: 'to weave the references together'
    partOfSpeech: phrase
    example: 'La autora entreteje con talento las referencias bíblicas y marineras.'
    exampleTranslation: 'The author weaves the biblical and nautical references together with talent.'
  - id: es-ES-C1-LITERARY-001-012
    concept: 'flavour-of-the-era'
    term: 'sabor de la época'
    translation: 'flavour of the era'
    partOfSpeech: phrase
    gender: masculine
    example: 'La novela recrea el sabor de la época con rigor e imaginación.'
    exampleTranslation: 'The novel recreates the flavour of the era with rigour and imagination.'
grammar:
  - id: es-ES-C1-LITERARY-001-G1
    point: 'Literary subjunctive in aesthetic evaluation'
    explanation: "Use subjunctive for aesthetic evaluation of literary texts: 'El autor Utiliza un lenguaje que haga evocador el paisaje' (The author uses language that makes the landscape evocative)."
    examples:
      - 'Es una obra que trascienda los límites del género.'
      - 'Es un texto que invite a la reflexión profunda.'
    cefrNotes: 'C1 learners use subjunctive for literary-aesthetic evaluation'
culturalNotes: 'Appreciating literary texts at C1 level requires understanding of allusion, irony, and cultural references that form the implicit layers of meaning. This is a key cultural competence in Spanish-speaking literary tradition.'
