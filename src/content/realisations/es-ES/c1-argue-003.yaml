grammar:
  - id: es-ES-C1-ARGUE-003-G1
    point: 'Subjunctive in relative clauses for qualification'
    explanation: "Use subjunctive in relative clauses to qualify or limit: 'Busco argumentos que sustenten mi tesis' (I seek arguments that support my thesis — specific requirement)."
    examples:
      - 'Utilizo expresiones que transmitan precisión.'
      - 'Necesito adjetivos que matizen correctamente.'
    cefrNotes: 'C1 learners use subjunctive in qualifying relative clauses for precise expression'
culturalNotes: 'Expressing subtle shades of meaning at C1 level requires mastery of register, vocabulary precision, and the ability to use qualifying devices such as hedging, intensifying, and modulating language.'
