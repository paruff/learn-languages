nodeId: C1-TEXT-003
lang: es-ES
vocabulary:
  - id: es-ES-C1-TEXT-003-001
    term: 'texto literario contemporáneo'
    translation: 'contemporary literary text'
    partOfSpeech: phrase
    gender: masculine
    example: 'Leo textos literarios contemporáneos con agrado.'
    exampleTranslation: 'I read contemporary literary texts with pleasure.'
  - id: es-ES-C1-TEXT-003-002
    term: 'alusión cultural'
    translation: 'cultural allusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Reconozco alusiones culturales en la literatura.'
    exampleTranslation: 'I recognise cultural allusions in literature.'
  - id: es-ES-C1-TEXT-003-003
    term: 'alusión histórica'
    translation: 'historical allusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las alusiones históricas enriquecen la lectura.'
    exampleTranslation: 'Historical allusions enrich the reading.'
  - id: es-ES-C1-TEXT-003-004
    term: 'expresiones idiomáticas'
    translation: 'idiomatic expressions'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las expresiones idiomáticas son frecuentes en la literatura.'
    exampleTranslation: 'Idiomatic expressions are frequent in literature.'
  - id: es-ES-C1-TEXT-003-005
    term: 'capas de significado'
    translation: 'layers of meaning'
    partOfSpeech: phrase
    gender: feminine
    example: 'La literatura tiene múltiples capas de significado.'
    exampleTranslation: 'Literature has multiple layers of meaning.'
  - id: es-ES-C1-TEXT-003-006
    term: 'apreciar'
    translation: 'to appreciate'
    partOfSpeech: verb
    example: 'Sé apreciar la calidad de un texto literario.'
    exampleTranslation: 'I know how to appreciate the quality of a literary text.'
grammar:
  - id: es-ES-C1-TEXT-003-G1
    point: 'Subjunctive in aesthetic appreciation clauses'
    explanation: "Use subjunctive in aesthetic appreciation clauses: 'Es una obra que refleje la realidad social' (It is a work that reflects social reality — evaluative)."
    examples:
      - 'Es un texto que capture la esencia de la época.'
      - 'Es una novela que trascienda el género policiaco.'
    cefrNotes: 'C1 learners use subjunctive in aesthetic-evaluative clauses for literary appreciation'
culturalNotes: 'Appreciating contemporary literary texts at C1 level requires understanding of idiomatic, cultural, and historical allusions that form the rich tapestry of Spanish-language literature.'
