nodeId: C1-TEXT-003
lang: es-ES
vocabulary:
  - id: es-ES-C1-TEXT-003-001
    concept: 'contemporary-literary-text'
    term: 'texto literario contemporáneo'
    translation: 'contemporary literary text'
    partOfSpeech: phrase
    gender: masculine
    example: 'Leo textos literarios contemporáneos con agrado.'
    exampleTranslation: 'I read contemporary literary texts with pleasure.'
  - id: es-ES-C1-TEXT-003-002
    concept: 'cultural-allusion'
    term: 'alusión cultural'
    translation: 'cultural allusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Reconozco alusiones culturales en la literatura.'
    exampleTranslation: 'I recognise cultural allusions in literature.'
  - id: es-ES-C1-TEXT-003-003
    concept: 'historical-allusion'
    term: 'alusión histórica'
    translation: 'historical allusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las alusiones históricas enriquecen la lectura.'
    exampleTranslation: 'Historical allusions enrich the reading.'
  - id: es-ES-C1-TEXT-003-004
    concept: 'idiomatic-expressions'
    term: 'expresiones idiomáticas'
    translation: 'idiomatic expressions'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las expresiones idiomáticas son frecuentes en la literatura.'
    exampleTranslation: 'Idiomatic expressions are frequent in literature.'
  - id: es-ES-C1-TEXT-003-005
    concept: 'layers-of-meaning'
    term: 'capas de significado'
    translation: 'layers of meaning'
    partOfSpeech: phrase
    gender: feminine
    example: 'La literatura tiene múltiples capas de significado.'
    exampleTranslation: 'Literature has multiple layers of meaning.'
  - id: es-ES-C1-TEXT-003-006
    concept: 'to-appreciate'
    term: 'apreciar'
    translation: 'to appreciate'
    partOfSpeech: verb
    example: 'Sé apreciar la calidad de un texto literario.'
    exampleTranslation: 'I know how to appreciate the quality of a literary text.'
  - id: es-ES-C1-TEXT-003-007
    concept: 'to-grasp-the-beauty-of-the-text'
    term: 'apreciar la belleza del texto'
    translation: 'to grasp the beauty of the text'
    partOfSpeech: phrase
    example: 'El lector paciente aprecia la belleza del texto en la cadencia de las frases.'
    exampleTranslation: 'The patient reader grasps the beauty of the text in the cadence of the sentences.'
  - id: es-ES-C1-TEXT-003-008
    concept: 'cultural-allusions'
    term: 'alusiones culturales'
    translation: 'cultural allusions'
    partOfSpeech: phrase
    gender: feminine
    example: 'La prosa viva está salpicada de alusiones culturales que se le escapan al turista.'
    exampleTranslation: 'The lively prose is peppered with cultural allusions that escape the tourist.'
  - id: es-ES-C1-TEXT-003-009
    concept: 'to-go-beyond-the-literal-meaning'
    term: 'ir más allá del sentido literal'
    translation: 'to go beyond the literal meaning'
    partOfSpeech: phrase
    example: 'Hay que ir más allá del sentido literal para saborear la metáfora.'
    exampleTranslation: 'One should go beyond the literal meaning to savour the metaphor.'
  - id: es-ES-C1-TEXT-003-010
    concept: 'figurative-language'
    term: 'lenguaje figurado'
    translation: 'figurative language'
    partOfSpeech: phrase
    gender: masculine
    example: 'El lenguaje figurado enriquece el poema sin volverlo hermético.'
    exampleTranslation: 'Figurative language enriches the poem without making it hermetic.'
  - id: es-ES-C1-TEXT-003-011
    concept: 'aesthetic-stance'
    term: 'postura estética'
    translation: 'aesthetic stance'
    partOfSpeech: phrase
    gender: feminine
    example: 'La postura estética del autor divide a la crítica.'
    exampleTranslation: "The author's aesthetic stance divides the critics."
  # REVIEW #185 (A): Concept "Lusophone flavour" is specific to Portuguese. The card would show the gloss "Lusophone flavour" for "sabor hispánico". The concept needs a language-neutral name, or es-ES should not carry it.
  - id: es-ES-C1-TEXT-003-012
    concept: 'lusophone-flavour'
    term: 'sabor hispánico'
    translation: 'Lusophone flavour'
    partOfSpeech: phrase
    gender: masculine
    example: 'La novela tiene un inconfundible sabor hispánico.'
    exampleTranslation: 'The novel has an unmistakable Hispanic flavour.'
grammar:
  - id: es-ES-C1-TEXT-003-G1
    point: 'Subjunctive in aesthetic appreciation clauses'
    explanation: "Use subjunctive in aesthetic appreciation clauses: 'Es una obra que refleje la realidad social' (It is a work that reflects social reality — evaluative)."
    examples:
      - 'Es un texto que capture la esencia de la época.'
      - 'Es una novela que trascienda el género policiaco.'
    cefrNotes: 'C1 learners use subjunctive in aesthetic-evaluative clauses for literary appreciation'
culturalNotes: 'Appreciating contemporary literary texts at C1 level requires understanding of idiomatic, cultural, and historical allusions that form the rich tapestry of Spanish-language literature.'
