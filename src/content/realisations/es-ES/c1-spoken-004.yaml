grammar:
  - id: es-ES-C1-SPOKEN-004-G1
    point: Concessive structures for understanding unstructured speech
    explanation: "Use concessive structures to express understanding despite difficulty: 'Aunque el discurso sea desordenado, puedo seguir la idea principal' (Even if the speech is disordered, I can follow the main idea)."
    examples:
      - Aunque no esté claramente estructurado, entiendo el mensaje.
      - Puedo seguir la argumentación aunque las relaciones sean implícitas.
    cefrNotes: C1 learners use concessive structures to express comprehension of complex, unstructured speech
culturalNotes: Understanding extended speech that is not clearly structured at C1 level requires the ability to infer implicit relationships and follow lines of argument that are suggested rather than stated explicitly.
