vocabulary:
  - id: es-ES-B2-SOCIAL-002-001
    concept: 'to-participate-in-a-debate'
    term: 'participar en un debate'
    translation: 'to participate in a debate'
    partOfSpeech: phrase
    example: 'Me gusta participar en debates sobre temas actuales.'
    exampleTranslation: 'I like to participate in debates on current topics.'
  - id: es-ES-B2-SOCIAL-002-002
    concept: 'to-present-ideas'
    term: 'exponer ideas'
    translation: 'to present ideas'
    partOfSpeech: phrase
    example: 'Puedo exponer ideas de forma clara y concisa.'
    exampleTranslation: 'I can present ideas clearly and concisely.'
  - id: es-ES-B2-SOCIAL-002-003
    concept: 'familiar-context'
    term: 'contexto familiar'
    translation: 'familiar context'
    partOfSpeech: phrase
    gender: masculine
    example: 'En contextos familiares, me siento más seguro.'
    exampleTranslation: 'In familiar contexts, I feel more confident.'
  - id: es-ES-B2-SOCIAL-002-004
    concept: 'intervention'
    term: 'intervención'
    translation: 'intervention / turn to speak'
    partOfSpeech: noun
    gender: feminine
    example: 'Mi intervención en el debate fue breve pero efectiva.'
    exampleTranslation: 'My intervention in the debate was brief but effective.'
  - id: es-ES-B2-SOCIAL-002-005
    concept: 'to-collaborate'
    term: 'colaborar'
    translation: 'to collaborate'
    partOfSpeech: verb
    example: 'Es importante colaborar en la discusión.'
    exampleTranslation: 'It is important to collaborate in the discussion.'
  - id: es-ES-B2-SOCIAL-002-006
    concept: 'constructive-debate'
    term: 'debate constructivo'
    translation: 'constructive debate'
    partOfSpeech: phrase
    gender: masculine
    example: 'Promovemos un debate constructivo y respetuoso.'
    exampleTranslation: 'We promote a constructive and respectful debate.'
  - id: es-ES-B2-SOCIAL-002-007
    concept: 'to-debate-topics'
    term: 'debatir temas'
    translation: 'to debate topics'
    partOfSpeech: phrase
    example: 'Me gusta debatir temas de actualidad con mis amigos.'
    exampleTranslation: 'I like to debate current topics with my friends.'
  - id: es-ES-B2-SOCIAL-002-008
    concept: 'to-participate-in-discussions'
    term: 'participar en debates'
    translation: 'to participate in discussions'
    partOfSpeech: phrase
    example: 'Es importante participar activamente en los debates.'
    exampleTranslation: 'It is important to participate actively in debates.'
  - id: es-ES-B2-SOCIAL-002-009
    concept: 'to-express-points-of-view'
    term: 'expresar puntos de vista'
    translation: 'to express points of view'
    partOfSpeech: phrase
    example: 'Puedo expresar mis puntos de vista con claridad.'
    exampleTranslation: 'I can express my points of view clearly.'
  - id: es-ES-B2-SOCIAL-002-010
    concept: 'to-argue-in-favour'
    term: 'argumentar a favor'
    translation: 'to argue in favour'
    partOfSpeech: phrase
    example: 'Voy a argumentar a favor de mi postura.'
    exampleTranslation: 'I will argue in favour of my position.'
  - id: es-ES-B2-SOCIAL-002-011
    concept: 'to-counter-arguments'
    term: 'rebatir argumentos'
    translation: 'to counter arguments'
    partOfSpeech: phrase
    example: 'Es útil rebatir argumentos para enriquecer el debate.'
    exampleTranslation: 'It is useful to counter arguments to enrich the debate.'
  - id: es-ES-B2-SOCIAL-002-012
    concept: 'to-reach-consensus'
    term: 'llegar a un consenso'
    translation: 'to reach consensus'
    partOfSpeech: phrase
    example: 'El objetivo es llegar a un consenso, no al conflicto.'
    exampleTranslation: 'The goal is to reach consensus, not conflict.'
grammar:
  - id: es-ES-B2-SOCIAL-002-G1
    point: 'Relative clauses with "quien" for discussion'
    explanation: "Use 'quien' (who/whom) in relative clauses: 'Yo, quien ha vivido allí, puedo confirmar' (I, who have lived there, can confirm)."
    examples:
      - 'El profesor, quien es experto en el tema, explicó bien.'
      - 'Mis amigos, quienes comparten mi opinión, estarán de acuerdo.'
    cefrNotes: 'B2 learners use non-restrictive relative clauses with "quien" in discussion'
culturalNotes: 'Active participation in discussion is valued in Spanish academic and professional settings. B2 learners should be able to take turns, respond to others, and contribute meaningfully.'
