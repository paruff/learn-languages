grammar:
  - id: es-ES-C2-WRITTEN-001-G1
    point: Advanced passive constructions for formal argumentation
    explanation: "Use advanced passive constructions for formal argumentation: 'Se ha demostrado empíricamente que' (It has been empirically demonstrated that), 'No se puede negar que' (It cannot be denied that)."
    examples:
      - Se ha demostrado empíricamente que el método es efectivo.
      - No se puede negar que la evidencia respalda la hipótesis.
    cefrNotes: C2 learners use advanced passive constructions for formal written argumentation
culturalNotes: Writing clear, detailed and well-structured texts at C2 level demonstrates the highest level of written production, with effective development and support of arguments and hypotheses in appropriate format and style.
