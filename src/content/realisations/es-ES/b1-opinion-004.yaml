    translation: 'to write about'
    partOfSpeech: phrase
    example: 'Voy a escribir sobre la importancia de la educación.'
    exampleTranslation: 'I am going to write about the importance of education.'
  - id: es-ES-B1-OPINION-004-009
    concept: 'to-express-my-position'
    term: 'expresar mi postura'
    translation: 'to express my position'
    partOfSpeech: phrase
    example: 'Es importante expresar mi postura con claridad.'
    exampleTranslation: 'It is important to express my position clearly.'
  - id: es-ES-B1-OPINION-004-010
    concept: 'to-support-my-opinion'
