    partOfSpeech: phrase
    example: 'Necesito respaldar mi opinión con datos.'
    exampleTranslation: 'I need to support my opinion with facts.'
  - id: es-ES-B1-OPINION-004-011
    concept: 'current-events'
    term: 'actualidad'
    translation: 'current events'
    partOfSpeech: noun
    gender: feminine
    example: 'Sigo la actualidad a diario.'
    exampleTranslation: 'I follow current events daily.'
  - id: es-ES-B1-OPINION-004-012
