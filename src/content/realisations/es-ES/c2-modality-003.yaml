grammar:
  - id: es-ES-C2-MODALITY-003-G1
    point: Concessive structures for native-speed comprehension
    explanation: "Use concessive structures to express comprehension of native-speed speech: 'Aunque hablen muy rápido, puedo seguir la conversación' (Even if they speak very fast, I can follow the conversation)."
    examples:
      - Aunque el acento sea muy fuerte, entiendo el mensaje.
      - Puedo seguir la conversación aunque sea a velocidad nativa.
    cefrNotes: C2 learners use concessive structures to express comprehension of native-speed speech
culturalNotes: Understanding any kind of spoken language at native speed at C2 level demonstrates the highest level of listening comprehension, including the ability to adapt to unfamiliar accents quickly.
