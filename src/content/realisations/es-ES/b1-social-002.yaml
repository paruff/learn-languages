lang: es-ES
vocabulary:
  - id: es-ES-B1-SOCIAL-002-001
    concept: 'extended-conversation'
    term: 'conversación extensa'
    translation: 'extended conversation'
    partOfSpeech: phrase
    gender: feminine
    example: 'Mantengo conversaciones extensas sobre temas familiares.'
    exampleTranslation: 'I sustain extended conversations on familiar topics.'
  - id: es-ES-B1-SOCIAL-002-002
    concept: 'to-go-deeper'
    term: 'profundizar'
    translation: 'to go deeper'
    partOfSpeech: verb
    example: 'Me gusta profundizar en los temas que me interesan.'
    exampleTranslation: 'I like to go deeper into topics that interest me.'
  - id: es-ES-B1-SOCIAL-002-003
    concept: 'to-develop-a-topic'
    term: 'desarrollar un tema'
    translation: 'to develop a topic'
    partOfSpeech: phrase
    example: 'Es fácil desarrollar un tema cuando te apasiona.'
    exampleTranslation: 'It is easy to develop a topic when you are passionate about it.'
  - id: es-ES-B1-SOCIAL-002-004
    concept: 'personal-opinion'
    term: 'opinión personal'
    translation: 'personal opinion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Es importante dar tu opinión personal en la conversación.'
    exampleTranslation: 'It is important to give your personal opinion in the conversation.'
  # REVIEW #185 (B): Pre-existing item. "tema familiar" can be read as "family topic"; it also duplicates the sense of 007 "temas conocidos". The same ambiguity is in the examples of B1-SOCIAL-002-001, B1-TEXT-004-001 and B2-SOCIAL-001-001 ("temas familiares"). Consider: tema conocido / tema cotidiano.
  - id: es-ES-B1-SOCIAL-002-005
    concept: 'familiar-topic'
    term: 'tema familiar'
    translation: 'familiar topic'
    partOfSpeech: phrase
    gender: masculine
    example: 'Puedo hablar de cualquier tema familiar con confianza.'
    exampleTranslation: 'I can talk about any familiar topic with confidence.'
  - id: es-ES-B1-SOCIAL-002-006
    concept: 'to-sustain'
    term: 'sostener'
    translation: 'to sustain'
    partOfSpeech: verb
    example: 'Es importante sostener una conversación sin que se detenga.'
    exampleTranslation: 'It is important to sustain a conversation without it stopping.'
  - id: es-ES-B1-SOCIAL-002-007
    concept: 'familiar-topics'
    term: 'temas conocidos'
    translation: 'familiar topics'
    partOfSpeech: phrase
    gender: masculine
    example: 'Me gusta hablar de temas conocidos como el trabajo y las aficiones.'
    exampleTranslation: 'I like to talk about familiar topics like work and hobbies.'
  - id: es-ES-B1-SOCIAL-002-008
    concept: 'to-deepen-the-conversation'
    term: 'profundizar en la conversación'
    translation: 'to deepen the conversation'
    partOfSpeech: phrase
    example: 'Podemos profundizar en la conversación sobre este tema.'
    exampleTranslation: 'We can deepen the conversation about this topic.'
  - id: es-ES-B1-SOCIAL-002-009
    concept: 'to-give-my-opinion'
    term: 'dar mi opinión'
    translation: 'to give my opinion'
    partOfSpeech: phrase
    example: '¿Puedo dar mi opinión sobre este tema?'
    exampleTranslation: 'Can I give my opinion on this topic?'
  # REVIEW #185 (B): "escuchar con atención" is "to listen attentively"; the other languages realise this concept as "actively". Consider: escuchar activamente.
  - id: es-ES-B1-SOCIAL-002-010
    concept: 'to-listen-actively'
    term: 'escuchar con atención'
    translation: 'to listen actively'
    partOfSpeech: phrase
    example: 'Es importante escuchar con atención cuando alguien habla.'
    exampleTranslation: 'It is important to listen actively when someone is speaking.'
  - id: es-ES-B1-SOCIAL-002-011
    concept: 'to-rephrase-what-was-heard'
    term: 'reformular lo que se ha oído'
    translation: 'to rephrase what was heard'
    partOfSpeech: phrase
    example: '¿Puedo reformular lo que he oído para confirmar que lo entendí?'
    exampleTranslation: 'Can I rephrase what I heard to confirm I understood?'
  - id: es-ES-B1-SOCIAL-002-012
    concept: 'to-confirm-understanding'
    term: 'confirmar que se ha entendido'
    translation: 'to confirm understanding'
    partOfSpeech: phrase
    example: 'Quiero confirmar que he entendido antes de continuar.'
    exampleTranslation: 'I want to confirm understanding before continuing.'
grammar: []
culturalNotes: 'Spanish conversation often involves animated discussion with overlapping speech. This is not considered rude but rather a sign of engagement and interest in the topic.'
