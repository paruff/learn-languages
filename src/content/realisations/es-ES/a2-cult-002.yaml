nodeId: A2-CULT-002
lang: es-ES
vocabulary:
  - id: es-ES-A2-CULT-002-001
    term: 'cultura'
    translation: 'culture'
    partOfSpeech: noun
    gender: feminine
    example: 'La cultura española es muy rica.'
    exampleTranslation: 'Spanish culture is very rich.'
  - id: es-ES-A2-CULT-002-002
    term: 'diferencia cultural'
    translation: 'cultural difference'
    partOfSpeech: phrase
    gender: feminine
    example: 'Las diferencias culturales son interesantes.'
    exampleTranslation: 'Cultural differences are interesting.'
  - id: es-ES-A2-CULT-002-003
    term: 'comparar'
    translation: 'to compare'
    partOfSpeech: verb
    example: 'Me gusta comparar las costumbres de otros países.'
    exampleTranslation: 'I like comparing the customs of other countries.'
  - id: es-ES-A2-CULT-002-004
    term: 'parecido'
    translation: 'similar'
    partOfSpeech: adjective
    example: 'Es parecido a lo que hacemos en mi país.'
    exampleTranslation: "It's similar to what we do in my country."
  - id: es-ES-A2-CULT-002-005
    term: 'distinto'
    translation: 'different'
    partOfSpeech: adjective
    example: 'Es distinto de lo que esperaba.'
    exampleTranslation: 'It is different from what I expected.'
  - id: es-ES-A2-CULT-002-006
    term: 'costumbre social'
    translation: 'social custom'
    partOfSpeech: phrase
    gender: feminine
    example: 'La siesta es una costumbre social en España.'
    exampleTranslation: 'The siesta is a social custom in Spain.'
grammar:
  - id: es-ES-A2-CULT-002-G1
    point: 'Comparatives with "más... que" and "tan... como"'
    explanation: "Use 'más... que' (more... than) and 'tan... como' (as... as) to compare cultural practices between countries."
    examples:
      - 'La comida española es más variada que la inglesa.'
      - 'Tan importante como la comida es la familia.'
    cefrNotes: 'Comparative structures are essential for A2 cultural discussions'
culturalNotes: 'Spain has 17 autonomous communities, each with distinct cultural traditions. Comparing regional cultures is a common topic of conversation, especially food, festivals, and dialects.'
