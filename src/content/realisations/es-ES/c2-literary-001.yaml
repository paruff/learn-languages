grammar:
  - id: es-ES-C2-LITERARY-001-G1
    point: Subjunctive in aesthetic-evaluative clauses for literary appreciation
    explanation: "Use subjunctive in aesthetic-evaluative clauses: 'Es una obra que trascienda los límites del género' (It is a work that transcends the limits of the genre)."
    examples:
      - Es una novela que capture la esencia de la época.
      - Es un poema que evoque emociones profundas.
    cefrNotes: C2 learners use subjunctive in aesthetic-evaluative clauses for literary appreciation
culturalNotes: Reading and appreciating a wide variety of complex literary texts at C2 level demonstrates the highest level of reading competence, including the ability to understand contemporary literature, poetry, song lyrics, and opinion pieces with ease.
