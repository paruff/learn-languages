vocabulary:
  - id: es-ES-C1-WRITTEN-002-007
    concept: critical-review
    term: crítica de cine
    translation: film review / critical review
    partOfSpeech: phrase
    gender: feminine
    example: Escribí una crítica de cine para una revista.
    exampleTranslation: I wrote a film review for a magazine.
  - id: es-ES-C1-WRITTEN-002-008
    concept: reference-works
    term: reseña de exposición
    translation: exhibition review / reference works
    partOfSpeech: phrase
    gender: feminine
    example: La reseña de exposición fue publicada en un periódico.
    exampleTranslation: The exhibition review was published in a newspaper.
  - id: es-ES-C1-WRITTEN-002-009
    concept: aesthetic-judgement
    term: estilo adecuado
    translation: appropriate style / aesthetic judgement
    partOfSpeech: phrase
    gender: masculine
    example: Selecciono el estilo adecuado según la publicación.
    exampleTranslation: I select the appropriate style according to the publication.
  - id: es-ES-C1-WRITTEN-002-010
    concept: to-put-into-perspective
    term: publicación objetivo
    translation: target publication / to put into perspective
    partOfSpeech: phrase
    gender: feminine
    example: Adapto mi escritura según la publicación objetivo.
    exampleTranslation: I adapt my writing according to the target publication.
  - id: es-ES-C1-WRITTEN-002-011
    concept: close-reading
    term: opinión crítica
    translation: critical opinion / close reading
    partOfSpeech: phrase
    gender: feminine
    example: Expreso mi opinión crítica de forma argumentada.
    exampleTranslation: I express my critical opinion in an argued way.
  - id: es-ES-C1-WRITTEN-002-012
    concept: final-assessment
    term: seleccionar el estilo
    translation: to select the style / final assessment
    partOfSpeech: phrase
