vocabulary:
  - id: es-ES-B2-SPOKEN-001-007
    concept: to-understand-extended-speech
    term: discurso extenso
    translation: to understand extended speech
    partOfSpeech: phrase
    gender: masculine
    example: Puedo seguir discurso extensos sobre temas académicos.
    exampleTranslation: I can follow extended speech on academic topics.
  - id: es-ES-B2-SPOKEN-001-008
    concept: to-follow-lines-of-argumentation
    term: conferencia
    translation: to follow lines of argumentation
    partOfSpeech: noun
    gender: feminine
    example: Asistí a una conferencia sobre inteligencia artificial.
    exampleTranslation: I attended a lecture on artificial intelligence.
  - id: es-ES-B2-SPOKEN-001-009
    concept: to-identify-discussion-topics
    term: línea de argumentación
    translation: to identify discussion topics
    partOfSpeech: phrase
    gender: feminine
    example: Puedo seguir una línea de argumentación compleja.
    exampleTranslation: I can follow a complex line of argument.
  - id: es-ES-B2-SPOKEN-001-010
    concept: to-understand-the-speech-structure
    term: disertación
    translation: to understand the speech structure
    partOfSpeech: noun
    gender: feminine
    example: La disertación del profesor fue muy ilustrativa.
    exampleTranslation: The professor's lecture was very informative.
  - id: es-ES-B2-SPOKEN-001-011
    concept: to-note-the-intonation
    term: seguir el hilo
    translation: to note the intonation
    partOfSpeech: phrase
    example: Es fácil seguir el hilo de su discurso.
