grammar:
  - id: es-ES-B2-SPOKEN-001-G1
    point: 'Past subjunctive for reported speech in lectures'
    explanation: "Use past subjunctive when reporting what was said in lectures: 'El profesor explicó que fuera importante estudiar' (The professor explained that it was important to study — formal literary register)."
    examples:
      - 'El conferenciante sugirió que consideráramos otras opciones.'
      - 'Dijo que el tema fuera de su interés.'
    cefrNotes: 'B2 learners understand past subjunctive in formal reported speech contexts'
culturalNotes: 'Spanish lectures at B2 level use formal academic register with complex sentence structures. Understanding extended speech requires familiarity with academic vocabulary and discourse markers.'
