grammar:
  - id: es-ES-C2-PROFESSIONAL-002-G1
    point: 'Subjunctive in purpose clauses for flexible language use'
    explanation: "Use subjunctive in purpose clauses to demonstrate flexible language use: 'Adapto mi registro para que la comunicación sea efectiva en cualquier contexto' (I adapt my register so that communication is effective in any context)."
    examples:
      - 'Utilizo el idioma de forma que la comunicación sea siempre precisa.'
      - 'Expreso mis ideas con fluidez para que el interlocutor las comprenda.'
    cefrNotes: 'C2 learners use purpose clauses to demonstrate near-native flexible language use'
culturalNotes: 'Expressing oneself with near-native command at C2 level across social, academic and professional purposes demonstrates the highest level of language proficiency, with flexible and effective use of vocabulary and syntax.'
