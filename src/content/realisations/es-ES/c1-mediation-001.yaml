grammar:
  - id: es-ES-C1-MEDIATION-001-G1
    point: 'Purpose clauses with "para que" + subjunctive in mediation'
    explanation: "Use 'para que' + subjunctive to express purpose in mediation: 'Lo reformulo para que sea más claro' (I reformulate it so that it is clearer)."
    examples:
      - 'Simplifico la explicación para que el público la entienda.'
      - 'Reformulo el concepto para que no se pierda la esencia.'
    cefrNotes: 'C1 learners use purpose clauses to demonstrate mediation competence'
culturalNotes: 'Mediation at C1 level requires the ability to explain complex issues to non-experts while maintaining accuracy. This is a key skill in professional and academic contexts where specialist knowledge must be communicated broadly.'
