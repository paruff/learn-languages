    concept: to-develop-systematically
    term: argumento sistemático
    translation: to develop systematically
    partOfSpeech: phrase
    gender: masculine
    example: Presentó un argumento sistemático y bien estructurado.
    exampleTranslation: He presented a systematic and well-structured argument.
  - id: es-ES-B2-ARGUE-003-008
    concept: to-highlight-important-points
