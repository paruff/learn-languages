grammar:
  - id: es-ES-B2-ARGUE-003-G1
    point: 'Subjunctive in argumentative clauses with "es importante que"'
    explanation: "Use subjunctive after expressions of importance: 'Es importante que se consideren' (It is important that they be considered), 'Es necesario que actúemos' (It is necessary that we act)."
    examples:
      - 'Es fundamental que se presenten datos concretos.'
      - 'Es crucial que la argumentación sea coherente.'
    cefrNotes: 'B2 learners use subjunctive in formal argumentative structures'
culturalNotes: 'Systematic argumentation at B2 level requires clear topic sentences, supporting evidence, and logical connectors. Spanish academic writing follows this structure closely.'
