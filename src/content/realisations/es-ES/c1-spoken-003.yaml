    exampleTranslation: Complex topics are not difficult for me.
  - id: es-ES-C1-SPOKEN-003-009
    concept: to-follow-the-thread-of-the-conversation
    term: estructurar el discurso
    translation: to follow the thread of the conversation
    partOfSpeech: phrase
    example: Sé estructurar el discurso de forma coherente.
    exampleTranslation: I know how to structure discourse coherently.
    gender: n/a
  - id: es-ES-C1-SPOKEN-003-010
    concept: beside-the-point
