    translation: to hit the nail on the head
    partOfSpeech: phrase
    gender: masculine
    example: Puedo mantener una conversación sobre temas abstractos.
    exampleTranslation: I can sustain a conversation on abstract topics.
  - id: es-ES-C1-SPOKEN-003-008
    concept: to-steer-the-discussion-to-a-good-conclusion
    term: tema complejo
    translation: to steer the discussion to a good conclusion
    partOfSpeech: phrase
    gender: masculine
