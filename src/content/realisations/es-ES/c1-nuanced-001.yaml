nodeId: C1-NUANCED-001
lang: es-ES
vocabulary:
  - id: es-ES-C1-NUANCED-001-007
    concept: delicate-disagreement
    term: desacuerdo
    translation: disagreement / delicate disagreement
    partOfSpeech: noun
    gender: masculine
    example: Puedo manejar un desacuerdo con sutileza.
    exampleTranslation: I can handle a disagreement with nuance.
  - id: es-ES-C1-NUANCED-001-008
    concept: to-fine-tune-one-s-language
    term: ajustar la expresión
    translation: to adjust the expression / to fine-tune one's language
    partOfSpeech: phrase
    example: Sé ajustar la expresión según el interlocutor.
    exampleTranslation: I know how to adjust the expression according to the interlocutor.
    gender: n/a
  - id: es-ES-C1-NUANCED-001-009
    concept: to-tread-carefully
    term: consecuencias
    translation: stakes / consequences / to tread carefully
    partOfSpeech: noun
    gender: feminine
    example: Adapto mi lenguaje según las consecuencias del tema.
    exampleTranslation: I adapt my language according to the stakes of the topic.
  - id: es-ES-C1-NUANCED-001-010
    concept: sensitive-matter
    term: delicadeza
    translation: delicacy / sensitive matter
    partOfSpeech: noun
    gender: feminine
    example: La delicadeza es necesaria en conversaciones difíciles.
    exampleTranslation: Delicacy is necessary in difficult conversations.
  - id: es-ES-C1-NUANCED-001-011
