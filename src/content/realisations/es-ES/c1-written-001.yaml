  - id: es-ES-C1-WRITTEN-001-007
    concept: to-adapt-the-register-to-the-reader
    term: texto persuasivo
    translation: to adapt the register to the reader
    partOfSpeech: phrase
    gender: masculine
    example: Puedo escribir textos persuasivos sobre temas abstractos.
    exampleTranslation: I can write persuasive texts on abstract topics.
  - id: es-ES-C1-WRITTEN-001-008
    concept: opinion-piece
    term: adaptar el registro
    translation: opinion piece
    partOfSpeech: phrase
    example: Sé adaptar el registro al lector objetivo.
    exampleTranslation: I know how to adapt the register to the target reader.
    gender: n/a
  - id: es-ES-C1-WRITTEN-001-009
    concept: argumentative-coherence
    term: tema de actualidad
    translation: argumentative coherence
    partOfSpeech: phrase
    gender: masculine
    example: Escribo sobre temas de actualidad con profundidad.
    exampleTranslation: I write about current topics with depth.
  - id: es-ES-C1-WRITTEN-001-010
    concept: to-dismantle-an-argument
    term: registro adecuado
    translation: to dismantle an argument
    partOfSpeech: phrase
    gender: masculine
    example: El registro adecuado es clave para un buen texto.
    exampleTranslation: The appropriate register is key for a good text.
  - id: es-ES-C1-WRITTEN-001-011
    concept: critical-eye
