    exampleTranslation: 'I will construct a chain of reasoning to explain.'
  - id: es-ES-B2-ARGUE-001-008
    concept: 'to-develop-the-argument'
    term: 'desarrollar el argumento'
    translation: 'to develop the argument'
    partOfSpeech: phrase
    example: 'Es importante desarrollar el argumento paso a paso.'
