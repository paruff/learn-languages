grammar:
  - id: es-ES-B2-ARGUE-001-G1
    point: 'Concessive clauses with "aunque" + subjunctive vs. indicative'
    explanation: "Use 'aunque' + indicative for established facts: 'Aunque llueve, salgo.' Use 'aunque' + subjunctive for hypothetical concessions: 'Aunque llueva, saldré.'"
    examples:
      - 'Aunque no estoy de acuerdo, entiendo tu punto.'
      - 'Aunque no lo creas, tengo razón.'
    cefrNotes: 'B2 learners use concessive clauses with nuanced subjunctive/indicative distinction'
culturalNotes: 'Spanish argumentation at B2 level should demonstrate the ability to construct logical chains of reasoning using connectors like "por lo tanto", "sin embargo", and "en consecuencia".'
