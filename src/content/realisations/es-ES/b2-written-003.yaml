grammar:
  - id: es-ES-B2-WRITTEN-003-G1
    point: 'Adverbial clauses with "antes de que" + subjunctive'
    explanation: "Use 'antes de que' + subjunctive for temporal adverbial clauses: 'Reviso el texto antes de que lo envíe' (I review the text before I send it)."
    examples:
      - 'Corrijo los errores antes de que el texto sea publicado.'
      - 'Reviso la ortografía antes de que termine el plazo.'
    cefrNotes: 'B2 learners use temporal adverbial clauses with subjunctive in written expression'
culturalNotes: 'B2-level writing should demonstrate correct spelling and punctuation. While some errors are acceptable, the ability to self-correct through proofreading is a key development indicator.'
