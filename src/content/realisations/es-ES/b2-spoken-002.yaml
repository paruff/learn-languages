grammar:
  - id: es-ES-B2-SPOKEN-002-G1
    point: 'Temporal expressions with "desde que" + indicative for media comprehension'
    explanation: "Use 'desde que' + indicative for temporal reference in media comprehension: 'Desde que estudio español, entiendo más películas' (Since I study Spanish, I understand more films)."
    examples:
      - 'Desde que vivo en Madrid, entiendo el noticiero sin problemas.'
      - 'Desde que cambiaron el formato, los programas son más claros.'
    cefrNotes: 'B2 learners use temporal clauses to contextualize media comprehension'
culturalNotes: 'Understanding Spanish TV news and films at B2 level requires familiarity with regional accents, colloquial expressions, and cultural references. Spanish films often use regional dialects that add complexity.'
