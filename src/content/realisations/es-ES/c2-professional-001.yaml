  - id: es-ES-C2-PROFESSIONAL-001-007
    concept: structured-summary
    term: resumen ejecutivo
    translation: structured summary
    partOfSpeech: phrase
    gender: masculine
    example: Escribí un resumen ejecutivo claro y bien estructurado.
    exampleTranslation: I wrote a clear and well-structured executive summary.
  - id: es-ES-C2-PROFESSIONAL-001-008
    concept: key-points
    term: material factual
    translation: key points
    partOfSpeech: phrase
    gender: masculine
    example: Puedo seleccionar los puntos clave de material factual complejo.
    exampleTranslation: I can select key points from complex factual material.
  - id: es-ES-C2-PROFESSIONAL-001-004
    concept: appropriate-format
    term: formato adecuado
    translation: appropriate format
    partOfSpeech: phrase
    gender: masculine
    example: Selecciono el formato adecuado según el destinatario.
    exampleTranslation: I select the appropriate format according to the recipient.
  - id: es-ES-C2-PROFESSIONAL-001-005
    concept: professional-style
    term: estilo profesional
    translation: professional style
    partOfSpeech: phrase
    gender: masculine
    example: Mi estilo profesional es claro y efectivo.
    exampleTranslation: My professional style is clear and effective.
  - id: es-ES-C2-PROFESSIONAL-001-009
    concept: complex-factual-material
