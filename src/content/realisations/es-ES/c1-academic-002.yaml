vocabulary:
  - id: es-ES-C1-ACADEMIC-002-007
    concept: conference-paper
    term: exposición compleja
    translation: complex presentation / conference paper
    partOfSpeech: phrase
    gender: feminine
    example: Preparé una exposición compleja para el congreso.
    exampleTranslation: I prepared a complex presentation for the conference.
  - id: es-ES-C1-ACADEMIC-002-003
    concept: specialist-audience
    term: público especializado
    translation: specialist audience
    partOfSpeech: phrase
    gender: masculine
    example: La conferencia fue dirigida a un público especializado.
    exampleTranslation: The conference was aimed at a specialist audience.
  - id: es-ES-C1-ACADEMIC-002-008
    concept: to-serve-as-a-foundation-for-the-presentation
    term: público general
    translation: general audience / to serve as a foundation for the presentation
    partOfSpeech: phrase
    gender: masculine
    example: Adapté mi charla para un público general.
    exampleTranslation: I adapted my talk for a general audience.
  - id: es-ES-C1-ACADEMIC-002-009
    concept: path-of-the-argumentation
    term: estructurar coherentemente
    translation: to structure coherently / path of the argumentation
    partOfSpeech: phrase
    example: Es fundamental estructurar coherentemente la exposición.
    exampleTranslation: It is fundamental to structure the presentation coherently.
    gender: n/a
  - id: es-ES-C1-ACADEMIC-002-010
    concept: to-manage-speaking-time
    term: adaptar
    translation: to adapt / to manage speaking time
    partOfSpeech: verb
    example: Sé adaptar el lenguaje según el interlocutor.
    exampleTranslation: I know how to adapt language according to the interlocutor.
    gender: n/a
  - id: es-ES-C1-ACADEMIC-002-011
    concept: to-refute-without-aggression
    term: contenido complejo
