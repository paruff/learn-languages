nodeId: B1-TEXT-004
lang: es-ES
vocabulary:
  - id: es-ES-B1-TEXT-004-001
    concept: connected-text
    term: texto conectado
    translation: connected text
    partOfSpeech: phrase
    gender: masculine
    example: Puedo escribir un texto conectado sobre temas familiares.
    exampleTranslation: I can write a connected text on familiar topics.
  - id: es-ES-B1-TEXT-004-007
    concept: familiar-topic
    term: desarrollar
    translation: to develop / familiar topic
    partOfSpeech: verb
    example: Necesito desarrollar mis ideas con más detalle.
    exampleTranslation: I need to develop my ideas in more detail.
    gender: n/a
  - id: es-ES-B1-TEXT-004-008
    concept: to-describe-experiences
    term: organizar
    translation: to organize / to describe experiences
    partOfSpeech: verb
    example: Es importante organizar las ideas antes de escribir.
    exampleTranslation: It is important to organize ideas before writing.
    gender: n/a
  - id: es-ES-B1-TEXT-004-009
    concept: to-express-impressions
    term: párrafo
    translation: paragraph / to express impressions
    partOfSpeech: noun
    gender: masculine
    example: Cada párrafo debe tener una idea central.
    exampleTranslation: Each paragraph should have a central idea.
  - id: es-ES-B1-TEXT-004-010
    concept: to-use-connectors
    term: coherencia
    translation: coherence / to use connectors
    partOfSpeech: noun
    gender: feminine
    example: La coherencia del texto es fundamental.
    exampleTranslation: The coherence of the text is fundamental.
  - id: es-ES-B1-TEXT-004-011
    concept: to-rewrite-the-text
    term: temática
    translation: theme / subject matter / to rewrite the text
    partOfSpeech: noun
    gender: feminine
    example: Elegí una temática que conocía bien.
    exampleTranslation: I chose a subject matter I knew well.
grammar:
  - id: es-ES-B1-TEXT-004-G1
    point: Connectors for text coherence
    explanation: "Use connectors for text coherence: 'por lo tanto' (therefore), 'en primer lugar' (firstly), 'en conclusión' (in conclusion)."
    examples:
      - En primer lugar, describiré el problema. Luego, propondré soluciones.
      - En conclusión, la experiencia fue muy positiva.
    cefrNotes: B1 learners use connectors to create coherent written text
culturalNotes: Spanish written texts at B1 level should demonstrate clear paragraph structure, logical connectors, and appropriate use of past tenses for narration.
