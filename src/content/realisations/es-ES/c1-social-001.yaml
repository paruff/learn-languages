grammar:
  - id: es-ES-C1-SOCIAL-001-G1
    point: 'Past subjunctive in hypothetical social situations'
    explanation: "Use past subjunctive for hypothetical social situations: 'Si pudiera expresarlo mejor, lo haría' (If I could express it better, I would)."
    examples:
      - 'Si tuviera más tiempo, explicaría el tema con más detalle.'
      - 'Si pudiera, expresaría mis ideas con más precisión.'
    cefrNotes: 'C1 learners use past subjunctive for fluent hypothetical expression'
culturalNotes: 'Expressing oneself fluently and spontaneously at C1 level means speaking without obvious hesitation, using idiomatic expressions appropriately, and maintaining naturalness in conversation.'
