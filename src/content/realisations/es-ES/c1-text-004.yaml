    partOfSpeech: verb
    example: Sé identificar la línea argumentativa del autor.
    exampleTranslation: I know how to identify the author's line of argument.
    gender: n/a
grammar:
  - id: es-ES-C1-TEXT-004-G1
    point: Non-finite clauses for concise argumentative analysis
    explanation: "Use non-finite clauses for concise argumentative analysis: 'Presentando evidencia sólida, el autor demuestra...' (Presenting solid evidence, the author demonstrates...), 'Basándose en datos...' (Based on data...)."
    examples:
      - El autor, apoyándose en datos estadísticos, demuestra su tesis.
      - Presentando contraejemplos, refuta la posición contraria.
    cefrNotes: C1 learners use non-finite clauses for concise, sophisticated text analysis
culturalNotes: Understanding complex argumentative texts at C1 level means being able to identify the author's line of argumentation, claims, evidence, and conclusion — a key academic and professional reading skill.
