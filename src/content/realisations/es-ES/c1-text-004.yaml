vocabulary:
  - id: es-ES-C1-TEXT-004-007
    concept: line-of-argumentation
    term: texto argumentativo complejo
    translation: line of argumentation
    partOfSpeech: phrase
    gender: masculine
    example: Puedo analizar textos argumentativos complejos con profundidad.
    exampleTranslation: I can analyse complex argumentative texts in depth.
  - id: es-ES-C1-TEXT-004-008
    concept: theses-and-antitheses
    term: línea argumentativa
    translation: theses and antitheses
    partOfSpeech: phrase
    gender: feminine
    example: Reconozco la línea argumentativa del autor.
    exampleTranslation: I recognise the author's line of argument.
  - id: es-ES-C1-TEXT-004-009
    concept: circumstantial-evidence
    term: afirmaciones
    translation: circumstantial evidence
    partOfSpeech: noun
    gender: feminine
    example: Puedo identificar las afirmaciones principales del autor.
    exampleTranslation: I can identify the author's main claims.
  - id: es-ES-C1-TEXT-004-010
    concept: turning-point
    term: evidencia
    translation: turning point
    partOfSpeech: noun
    gender: feminine
    example: Evalúo la evidencia presentada en el texto.
    exampleTranslation: I evaluate the evidence presented in the text.
  - id: es-ES-C1-TEXT-004-011
    concept: convergence-of-factors
    term: conclusión
    translation: convergence of factors
    partOfSpeech: noun
    gender: feminine
    example: La conclusión del autor es convincente.
    exampleTranslation: The author's conclusion is convincing.
  - id: es-ES-C1-TEXT-004-012
    concept: to-follow-the-reasoning
    term: identificar
