nodeId: B1-DISCOURSE-002
lang: es-ES
vocabulary:
  - id: es-ES-B1-DISCOURSE-002-001
    term: 'narrar'
    translation: 'to narrate'
    partOfSpeech: verb
    example: 'Puedo narrar acontecimientos de forma clara.'
    exampleTranslation: 'I can narrate events clearly.'
  - id: es-ES-B1-DISCOURSE-002-002
    term: 'secuencia temporal'
    translation: 'temporal sequence'
    partOfSpeech: phrase
    gender: feminine
    example: 'Es importante respetar la secuencia temporal.'
    exampleTranslation: 'It is important to respect the temporal sequence.'
  - id: es-ES-B1-DISCOURSE-002-003
    term: 'antes de'
    translation: 'before'
    partOfSpeech: conjunction
    example: 'Antes de salir, revisé todo.'
    exampleTranslation: 'Before leaving, I checked everything.'
  - id: es-ES-B1-DISCOURSE-002-004
    term: 'después de'
    translation: 'after'
    partOfSpeech: conjunction
    example: 'Después de comer, dimos un paseo.'
    exampleTranslation: 'After eating, we took a walk.'
  - id: es-ES-B1-DISCOURSE-002-005
    term: 'mientras tanto'
    translation: 'meanwhile'
    partOfSpeech: conjunction
    example: 'Yo preparaba la cena; mientras tanto, él leía.'
    exampleTranslation: 'I was preparing dinner; meanwhile, he was reading.'
  - id: es-ES-B1-DISCOURSE-002-006
    term: 'finalmente'
    translation: 'finally'
    partOfSpeech: adverb
    example: 'Finalmente, llegamos a nuestro destino.'
    exampleTranslation: 'Finally, we arrived at our destination.'
grammar:
  - id: es-ES-B1-DISCOURSE-002-G1
    point: 'Narrative connectors for temporal sequence'
    explanation: "Use connectors like 'primero' (first), 'luego/después' (then), 'mientras tanto' (meanwhile), 'finalmente' (finally) to order events."
    examples:
      - 'Primero visitamos el museo, luego fuimos a comer.'
      - 'Mientras tanto, la lluvia no paraba.'
    cefrNotes: 'B1 learners sequence events with temporal connectors for clear narration'
culturalNotes: 'Spanish narratives often follow chronological order, though literary and journalistic styles may use anachrony (flashbacks, flashforwards) for dramatic effect.'
