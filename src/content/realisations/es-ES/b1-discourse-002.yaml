grammar:
  - id: es-ES-B1-DISCOURSE-002-G1
    point: Narrative connectors for temporal sequence
    explanation: Use connectors like 'primero' (first), 'luego/después' (then), 'mientras tanto' (meanwhile), 'finalmente' (finally) to order events.
    examples:
      - Primero visitamos el museo, luego fuimos a comer.
      - Mientras tanto, la lluvia no paraba.
    cefrNotes: B1 learners sequence events with temporal connectors for clear narration
culturalNotes: Spanish narratives often follow chronological order, though literary and journalistic styles may use anachrony (flashbacks, flashforwards) for dramatic effect.
