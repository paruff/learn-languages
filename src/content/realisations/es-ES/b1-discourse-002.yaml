vocabulary:
  - id: es-ES-B1-DISCOURSE-002-007
    concept: following
    term: narrar
    translation: following
    partOfSpeech: verb
    example: Puedo narrar acontecimientos de forma clara.
    exampleTranslation: I can narrate events clearly.
    gender: n/a
  - id: es-ES-B1-DISCOURSE-002-008
    concept: after-that
    term: secuencia temporal
    translation: after that
    partOfSpeech: phrase
    gender: feminine
    example: Es importante respetar la secuencia temporal.
    exampleTranslation: It is important to respect the temporal sequence.
  - id: es-ES-B1-DISCOURSE-002-009
    concept: first-of-all
    term: antes de
    translation: first of all
    partOfSpeech: conjunction
    example: Antes de salir, revisé todo.
    exampleTranslation: Before leaving, I checked everything.
