    example: 'Reconozco el significado implícito en textos complejos.'
    exampleTranslation: 'I recognise implicit meaning in complex texts.'
  - id: es-ES-C1-TEXT-001-003
    concept: 'extended-texts'
    term: 'textos extensos'
    translation: 'extended texts'
    partOfSpeech: phrase
    gender: masculine
    example: 'Leo textos extensos sin perder el hilo.'
    exampleTranslation: 'I read extended texts without losing the thread.'
  - id: es-ES-C1-TEXT-001-004
    concept: 'layers-of-meaning'
    term: 'capas de significado'
    translation: 'layers of meaning'
    partOfSpeech: phrase
    gender: feminine
    example: 'Los textos literarios tienen múltiples capas de significado.'
    exampleTranslation: 'Literary texts have multiple layers of meaning.'
  - id: es-ES-C1-TEXT-001-005
    concept: 'global-comprehension'
    term: 'comprensión global'
    translation: 'global comprehension'
    partOfSpeech: phrase
    gender: feminine
    example: 'Mi comprensión global de textos exigentes ha mejorado.'
    exampleTranslation: 'My global comprehension of demanding texts has improved.'
  - id: es-ES-C1-TEXT-001-006
    concept: 'deep-reading'
    term: 'lectura profunda'
    translation: 'deep reading'
    partOfSpeech: phrase
    gender: feminine
    example: 'La lectura profunda es esencial para entender textos complejos.'
    exampleTranslation: 'Deep reading is essential for understanding complex texts.'
  - id: es-ES-C1-TEXT-001-007
    concept: 'to-read-between-the-lines'
    term: 'leer entre líneas'
    translation: 'to read between the lines'
    partOfSpeech: phrase
    example: 'Un lector atento sabe leer entre líneas los editoriales.'
    exampleTranslation: 'An attentive reader knows how to read between the lines of editorials.'
  - id: es-ES-C1-TEXT-001-008
    concept: 'to-grasp-the-implicit-meaning'
    term: 'captar el sentido implícito'
    translation: 'to grasp the implicit meaning'
    partOfSpeech: phrase
    example: 'El crítico captó el sentido implícito de la novela.'
    exampleTranslation: 'The critic grasped the implicit meaning of the novel.'
  - id: es-ES-C1-TEXT-001-009
    concept: 'to-discern-the-irony'
    term: 'discernir la ironía'
    translation: 'to discern the irony'
    partOfSpeech: phrase
    example: 'Solo un lector experimentado puede discernir la ironía del texto.'
    exampleTranslation: 'Only an experienced reader can discern the irony of the text.'
  - id: es-ES-C1-TEXT-001-010
    concept: 'long-form-text'
    term: 'texto extenso'
    translation: 'long-form text'
    partOfSpeech: phrase
    gender: masculine
    example: 'El ensayo es un texto extenso sobre la identidad europea.'
    exampleTranslation: 'The essay is a long-form text on European identity.'
  - id: es-ES-C1-TEXT-001-011
    concept: 'to-contextualise-the-work'
    term: 'contextualizar la obra'
    translation: 'to contextualise the work'
    partOfSpeech: phrase
    example: 'Conviene contextualizar la obra en la época en que se escribió.'
    exampleTranslation: 'It is advisable to contextualise the work within the era in which it was written.'
  - id: es-ES-C1-TEXT-001-012
    concept: 'to-infer-the-point-of-view'
    term: 'inferir el punto de vista'
    translation: 'to infer the point of view'
    partOfSpeech: phrase
    example: 'El punto de vista del autor se puede inferir de la elección de los ejemplos.'
    exampleTranslation: "The author's point of view can be inferred from the choice of examples."
grammar:
  - id: es-ES-C1-TEXT-001-G1
    point: 'Subjunctive in relative clauses for literary evaluation'
    explanation: "Use subjunctive in relative clauses to express literary evaluation: 'Busco textos que trasciendan lo superficial' (I seek texts that transcend the superficial)."
    examples:
      - 'Puedo leer textos que requieran análisis profundo.'
      - 'Entiendo obras que contemplen múltiples interpretaciones.'
    cefrNotes: 'C1 learners use subjunctive in literary-evaluative relative clauses'
culturalNotes: "Understanding demanding, longer texts at C1 level requires the ability to recognise implicit meaning, appreciate layers of interpretation, and engage critically with the text's content and style."
