grammar:
  - id: es-ES-B2-SOCIAL-001-G1
    point: 'Present subjunctive for spontaneous suggestions'
    explanation: "Use present subjunctive for spontaneous suggestions in conversation: '¿Qué tal si vamos al cine?' (What about going to the cinema?), '¿No crees que deberíamos salir?' (Don't you think we should go out?)."
    examples:
      - '¿Qué tal si hablamos del tema mañana?'
      - '¿No te parece que deberíamos cambiar de tema?'
    cefrNotes: 'B2 learners use subjunctive for natural conversational suggestions'
culturalNotes: 'B2-level Spanish conversation demonstrates natural fluency with idiomatic expressions and conversational fillers that signal engagement and spontaneity.'
