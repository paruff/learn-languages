grammar:
  - id: es-ES-B1-TEXT-003-G1
    point: 'Imperative in technical instructions'
    explanation: "Use imperative (usted form) in technical instructions: 'Conecte el cable' (Connect the cable), 'Pulse el botón' (Press the button)."
    examples:
      - 'Gire la llave en sentido horario.'
      - 'Inserte la moneda en la ranura.'
    cefrNotes: 'B1 learners understand imperative mood in technical texts'
culturalNotes: "Technical Spanish uses formal register (usted) in instructions. The passive voice is also common: 'Se recomienda leer las instrucciones' (It is recommended to read the instructions)."
