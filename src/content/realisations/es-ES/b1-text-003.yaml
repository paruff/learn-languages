vocabulary:
  - id: es-ES-B1-TEXT-003-001
    term: 'técnico'
    translation: 'technical'
    partOfSpeech: adjective
    gender: masculine
    example: 'El texto técnico contiene vocabulario específico.'
    exampleTranslation: 'The technical text contains specific vocabulary.'
  - id: es-ES-B1-TEXT-003-002
    term: 'ámbito profesional'
    translation: 'professional field'
    partOfSpeech: phrase
    gender: masculine
    example: 'En mi ámbito profesional, utilizo textos técnicos.'
    exampleTranslation: 'In my professional field, I use technical texts.'
  - id: es-ES-B1-TEXT-003-003
    term: 'vocabulario específico'
    translation: 'specific vocabulary'
    partOfSpeech: phrase
    gender: masculine
    example: 'El vocabulario específico es clave para entender el texto.'
    exampleTranslation: 'Specific vocabulary is key to understanding the text.'
  - id: es-ES-B1-TEXT-003-004
    term: 'información práctica'
