    partOfSpeech: phrase
    example: 'Los compañeros de trabajo se tratan de tú desde el primer día.'
    exampleTranslation: 'Co-workers have addressed each other informally, with tú, since day one.'
  - id: es-ES-C1-SOCIAL-002-010
