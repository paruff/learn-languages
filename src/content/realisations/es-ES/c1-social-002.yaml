    translation: 'to adjust the tone'
    partOfSpeech: phrase
    example: 'Sabe ajustar el tono al contexto social en el que se encuentra.'
    exampleTranslation: 'She knows how to adjust her tone to the social context she is in.'
  - id: es-ES-C1-SOCIAL-002-011
