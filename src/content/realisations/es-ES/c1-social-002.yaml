    translation: 'to keep respectful distance'
    partOfSpeech: phrase
    example: 'En las primeras conversaciones es prudente guardar una distancia respetuosa.'
    exampleTranslation: 'In first conversations, it is prudent to keep a respectful distance.'
  - id: es-ES-C1-SOCIAL-002-012
