grammar:
  - id: es-ES-C2-MODALITY-002-G1
    point: 'Advanced discourse connectors for structured argumentation'
    explanation: "Use advanced discourse connectors: 'no obstante' (nevertheless), 'en todo caso' (in any case), 'en lo que respecta a' (regarding), 'a tenor de' (in light of)."
    examples:
      - 'No obstante, cabe señalar que la evidencia es inconsistente.'
      - 'En todo caso, el análisis revela una tendencia clara.'
    cefrNotes: 'C2 learners use advanced discourse connectors for structured spoken argumentation'
culturalNotes: 'Presenting clear, smoothly-flowing descriptions and arguments at C2 level demonstrates near-native command of spoken production, with appropriate use of register and emphasis.'
