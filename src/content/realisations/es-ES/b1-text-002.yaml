grammar:
  - id: es-ES-B1-TEXT-002-G1
    point: 'Reading comprehension with present perfect for recent news'
    explanation: "Use present perfect for recent news: 'Han arrestado al sospechoso' (They have arrested the suspect). This tense is standard in Spanish news headlines."
    examples:
      - 'Han aprobado una nueva ley educativa.'
      - 'Ha aumentado el número de parados.'
    cefrNotes: 'B1 learners understand present perfect in news contexts'
culturalNotes: 'Spanish news articles use present perfect for recent events and preterite for older events. This distinction is important for comprehension of news texts.'
