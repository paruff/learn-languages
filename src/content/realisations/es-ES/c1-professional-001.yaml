    partOfSpeech: phrase
    gender: feminine
    example: 'La objeción de los socios obligó a dar un paso atrás en el calendario.'
    exampleTranslation: 'The objection of the partners forced a step back on the timetable.'
  - id: es-ES-C1-PROFESSIONAL-001-009
