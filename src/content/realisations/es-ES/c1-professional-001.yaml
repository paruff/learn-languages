    translation: 'to set the record straight'
    partOfSpeech: phrase
    example: 'En la reunión dejó las cosas claras sobre los plazos.'
    exampleTranslation: 'At the meeting he set the record straight about the deadlines.'
  - id: es-ES-C1-PROFESSIONAL-001-010
