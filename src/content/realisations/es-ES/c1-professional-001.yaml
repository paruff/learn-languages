    translation: 'proposal for discussion'
    partOfSpeech: phrase
    gender: feminine
    example: 'La propuesta para debatir recibió un análisis minucioso.'
    exampleTranslation: 'The proposal for discussion received careful analysis.'
  - id: es-ES-C1-PROFESSIONAL-001-008
    concept: 'objection-of-the-partners'
