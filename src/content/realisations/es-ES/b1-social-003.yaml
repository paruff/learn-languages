grammar:
  - id: es-ES-B1-SOCIAL-003-G1
    point: Expressing feelings with "me siento" + adjective
    explanation: "Use 'me siento' + adjective to express emotional states: 'me siento contento' (I feel happy), 'me siento preocupado' (I feel worried)."
    examples:
      - Me siento muy a gusto en esta ciudad.
      - Me siento nervioso antes de hablar en público.
    cefrNotes: B1 learners express a range of emotional states using periphrastic constructions
culturalNotes: Spanish speakers tend to express emotions more openly than many other cultures. Physical gestures (hand movements, facial expressions) accompany verbal expression of feelings.
