grammar:
  - id: es-ES-C2-NUANCE-001-G1
    point: Subjunctive in conditional clauses for nuanced domain expression
    explanation: "Use subjunctive in conditional clauses for nuanced expression: 'Si pudiera encontrar la palabra exacta, la utilizaría' (If I could find the exact word, I would use it)."
    examples:
      - Si encontrara la expresión perfecta, la emplearía sin dudar.
      - Si pudiera matizar más, lo haría para mayor precisión.
    cefrNotes: C2 learners use subjunctive in conditional clauses for nuanced domain expression
culturalNotes: Expressing finer shades of meaning at C2 level across a wide range of subjects demonstrates the highest level of lexical and syntactic mastery, enabling precise communication in any domain.
