grammar:
  - id: es-ES-B1-DISCOURSE-004-G1
    point: Temporal markers in written narratives
    explanation: Use temporal markers like 'ayer' (yesterday), 'la semana pasada' (last week), 'hace tres años' (three years ago) to anchor past events in written narratives.
    examples:
      - Ayer fui al cine. Después, cené con amigos.
      - Hace dos años viajé a Barcelona.
    cefrNotes: B1 learners use temporal markers to structure written narratives
culturalNotes: Written Spanish narratives at B1 level should demonstrate coherent use of past tenses (preterite vs. imperfect) and temporal connectors.
