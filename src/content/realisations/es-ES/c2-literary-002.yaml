grammar:
  - id: es-ES-C2-LITERARY-002-G1
    point: Subjunctive in relative clauses for style evaluation
    explanation: "Use subjunctive in relative clauses for literary style evaluation: 'Busco un estilo que refleje la sutileza del pensamiento' (I seek a style that reflects the subtlety of thought)."
    examples:
      - Elijo un estilo que evoque la atmósfera adecuada.
      - Busco una expresión que transmita exactamente la emoción.
    cefrNotes: C2 learners use subjunctive in evaluative relative clauses for literary style control
culturalNotes: Writing with precision and subtlety at C2 level demonstrates the ability to convey intended effects on the reader, adapting style to text and audience with near-native command of the language.
