grammar:
  - id: es-ES-C2-ACADEMIC-001-G1
    point: 'Advanced conditional structures for academic hedging'
    explanation: "Use advanced conditional structures for academic hedging: 'Se podría argumentar que...' (It could be argued that...), 'No sería descabellado afirmar que...' (It would not be unreasonable to claim that...)."
    examples:
      - 'Se podría argumentar que la evidencia respalda esta hipótesis.'
      - 'No sería descabellado afirmar que el método es efectivo.'
    cefrNotes: 'C2 learners use advanced conditional structures for academic hedging'
culturalNotes: 'Writing clearly and fluently on complex subjects at C2 level demonstrates the highest level of academic writing, with effective use of language repertoire and coherent, convincing argumentation.'
