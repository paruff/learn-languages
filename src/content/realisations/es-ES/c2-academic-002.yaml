grammar:
  - id: es-ES-C2-ACADEMIC-002-G1
    point: Advanced temporal connectors for academic spoken production
    explanation: "Use advanced temporal connectors: 'A modo de introducción' (As an introduction), 'En lo que respecta a' (Regarding), 'A modo de cierre' (To conclude)."
    examples:
      - A modo de introducción, describiré el contexto histórico.
      - En lo que respecta a los resultados, puedo afirmar que...
    cefrNotes: C2 learners use advanced temporal connectors for structured academic spoken production
culturalNotes: Presenting clear, detailed and accurate descriptions of complex subjects at C2 level demonstrates the highest level of academic spoken production, with effective integration of sub-themes and appropriate conclusions.
