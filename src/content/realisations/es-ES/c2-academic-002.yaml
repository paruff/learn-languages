    concept: detailed-description
    term: exposición académica
    translation: academic presentation / detailed description
    partOfSpeech: phrase
    gender: feminine
    example: Presento exposiciones académicas claras y detalladas.
    exampleTranslation: I present clear and detailed academic presentations.
  - id: es-ES-C2-ACADEMIC-002-008
    concept: related-sub-themes
