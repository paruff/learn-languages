nodeId: C2-ACADEMIC-002
lang: es-ES
vocabulary:
  - id: es-ES-C2-ACADEMIC-002-001
    term: 'exposición académica'
    translation: 'academic presentation'
    partOfSpeech: phrase
    gender: feminine
    example: 'Presento exposiciones académicas claras y detalladas.'
    exampleTranslation: 'I present clear and detailed academic presentations.'
  - id: es-ES-C2-ACADEMIC-002-002
    term: 'subtemas'
    translation: 'sub-themes'
    partOfSpeech: noun
    gender: masculine
    example: 'Integro subtemas de forma natural en mis presentaciones.'
    exampleTranslation: 'I integrate sub-themes naturally in my presentations.'
  - id: es-ES-C2-ACADEMIC-002-003
    term: 'desarrollo exhaustivo'
    translation: 'exhaustive development'
    partOfSpeech: phrase
    gender: masculine
    example: 'El desarrollo de cada punto es exhaustivo y riguroso.'
    exampleTranslation: 'The development of each point is exhaustive and rigorous.'
  - id: es-ES-C2-ACADEMIC-002-004
    term: 'conclusión apropiada'
    translation: 'appropriate conclusion'
    partOfSpeech: phrase
    gender: feminine
    example: 'Cierro con una conclusión apropiada y bien fundamentada.'
    exampleTranslation: 'I close with an appropriate and well-founded conclusion.'
  - id: es-ES-C2-ACADEMIC-002-005
    term: 'descripción precisa'
    translation: 'precise description'
    partOfSpeech: phrase
    gender: feminine
    example: 'Mis descripciones son precisas y completas.'
    exampleTranslation: 'My descriptions are precise and complete.'
  - id: es-ES-C2-ACADEMIC-002-006
    term: 'redondear'
    translation: 'to round off'
    partOfSpeech: verb
    example: 'Sé redondear mis exposiciones de forma elegante.'
    exampleTranslation: 'I know how to round off my presentations elegantly.'
grammar:
  - id: es-ES-C2-ACADEMIC-002-G1
    point: 'Advanced temporal connectors for academic spoken production'
    explanation: "Use advanced temporal connectors: 'A modo de introducción' (As an introduction), 'En lo que respecta a' (Regarding), 'A modo de cierre' (To conclude)."
    examples:
      - 'A modo de introducción, describiré el contexto histórico.'
      - 'En lo que respecta a los resultados, puedo afirmar que...'
    cefrNotes: 'C2 learners use advanced temporal connectors for structured academic spoken production'
culturalNotes: 'Presenting clear, detailed and accurate descriptions of complex subjects at C2 level demonstrates the highest level of academic spoken production, with effective integration of sub-themes and appropriate conclusions.'
