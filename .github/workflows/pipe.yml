name: PIPE — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pages: write

# A new push to a PR supersedes the previous run; never cancel runs on main (deploys).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Major-only pin: tracks 26.x patches (and the move to LTS). Keep in step with
  # package.json engines and .devcontainer/Dockerfile.
  NODE_VERSION: '26'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  empty-diff:
    name: Empty Diff Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fail when the PR changes no files
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}" "${{ github.head_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...origin/${{ github.head_ref }}" | wc -l | tr -d ' ')
          if [ "$changed" -eq 0 ]; then
            echo "::error::This PR changes no files. An empty merge hides unimplemented work."
            exit 1
          fi
          echo "PR changes $changed file(s)."

  sync-content:
    name: Sync Content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:content
      # Runtime/build deps only: dev-only advisories (e.g. braces via
      # eslint-plugin-astro, no fixed version yet) don't reach the shipped site.
      - run: npm audit --omit=dev --audit-level=high

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    needs: sync-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx astro sync
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: sync-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: sync-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx astro sync
      - run: npm run test
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  coverage:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: sync-content
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit-test, coverage]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # One job per Playwright project, with the slow ones split into 3 shards, so
  # everything runs concurrently (was one serial job, 25+ min).
  e2e-shard:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium, shard: 1/3 }
          - { project: chromium, browser: chromium, shard: 2/3 }
          - { project: chromium, browser: chromium, shard: 3/3 }
          - { project: mobile-chrome, browser: chromium, shard: 1/3 }
          - { project: mobile-chrome, browser: chromium, shard: 2/3 }
          - { project: mobile-chrome, browser: chromium, shard: 3/3 }
          - { project: firefox, browser: firefox, shard: 1/1 }
          - { project: webkit, browser: webkit, shard: 1/3 }
          - { project: webkit, browser: webkit, shard: 2/3 }
          - { project: webkit, browser: webkit, shard: 3/3 }
          - { project: mobile-safari, browser: webkit, shard: 1/1 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      # Browser download is skipped on a cache hit; --with-deps still installs OS libraries.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  # Stable required-check name (branch protection) that gates on every shard.
  e2e:
    name: E2E + Accessibility Tests
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - run: |
          [ "${{ needs.e2e-shard.result }}" = "success" ] || { echo "::error::E2E shard result: ${{ needs.e2e-shard.result }}"; exit 1; }

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, e2e, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5
